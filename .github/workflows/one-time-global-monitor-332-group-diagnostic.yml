name: Isolated group assertion diagnostic 332
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-global-monitor-332-group-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: sealed-global-monitor-332-diagnostic
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '9d5b3dd751f15f293be92c3303397f9863ea8e4f' && github.event.head_commit.message == 'ci: identify failed isolated group assertion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Public guard checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata isolation
        run: node scripts/public-content-check.mjs
      - name: Checkout immutable private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: b69f56c6792278a83d1961b054c5ba9a6415b3f8
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Require exactly approved candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'b69f56c6792278a83d1961b054c5ba9a6415b3f8'
      - name: Identify group regression without private output
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const packageData = JSON.parse(readFileSync('candidate/package.json','utf8'));
          const files = packageData.scripts['test:group:governance'].split(' ').slice(2);
          for (let index=0; index<files.length; index++) {
            const run = spawnSync('node',['--test','--test-reporter=spec',files[index]],{cwd:'candidate',encoding:'utf8',timeout:120000});
            if (run.status === 0) { console.log('GROUP_FILE '+(index+1)+' PASS'); continue; }
            const log = (run.stdout || '') + (run.stderr || '');
            const positions = log.match(/\.test\.mjs:(\d+):(\d+)/g) || [];
            console.log('GROUP_FILE '+(index+1)+' FAIL '+[...new Set(positions)].join(' '));
          }
          NODE
