name: One-time scoped static assets full rebuild and QA release
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-static-assets-rebuild-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify_dist_then_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '5294b159eae28daad373697d1cec0826e2389959' && github.event.head_commit.message == 'ci: scoped static assets rebuild private-path safe 20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout original public isolation runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public source isolation
        run: npm run check:public
      - name: Check existing sealed original QA-only access
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Existing restricted QA-only authorization unavailable'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout original private QA snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Pin unmodified original QA source
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f4a4790a723b93218ac3740249adca5d78f5426e'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git status --porcelain)"
          echo 'Original QA source pinned; no application files modified.'
      - name: Force fresh complete dependency install and Vite dist build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/static-dist-rebuild-20261119.log"
          trap 'rm -f "$log"' EXIT
          if (cd candidate && npm ci --no-audit --no-fund && npm run build) > "$log" 2>&1; then
            echo 'Full fresh npm ci and Vite dist build PASS.'
          else
            echo 'Full fresh npm ci or Vite dist build FAILED; private build log withheld.'
            exit 1
          fi
      - name: Inspect exactly the built dist image and CSS outputs before deployment
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import { resolve, relative, basename, sep } from 'node:path';
          const sourceHtml = readFileSync('account/index.html', 'utf8');
          const sourceCss = readFileSync('account/ivory-entry.css', 'utf8');
          const img = sourceHtml.match(/<img\b[^>]*class=["']hero-image["'][^>]*src=["']([^"']+)["']/i)?.[1];
          const frame = sourceCss.match(/--frame\s*:\s*url\(["']?([^"'\)]+)["']?\)/)?.[1];
          const foliage = sourceCss.match(/--foliage\s*:\s*url\(["']?([^"'\)]+)["']?\)/)?.[1];
          const roots = [{ label: 'hero.webp', ref: img }, {label: 'ornament.webp', ref: frame}, { label: 'leafshadow.webp', ref: foliage }];
          let valid = true;
          function verify(source, output, label, format) {
            if (!existsSync(source) || !existsSync(output)) {
              console.log('DIST FILE MISSING: ' + label); valid = false; return;
            }
            const a = readFileSync(source), b = readFileSync(output);
            const signature = format === 'webp' ?
              b.length >= 16 && b.toString('ascii',0,4) === 'RIFF' && b.toString('ascii',8,12) === 'WEBP' :
              b.length > 0 && b.toString('utf8',0,256).trim().length > 0;
            const same = a.equals(b);
            console.log('DIST FILE ' + ((signature && same) ? 'OK' : 'INVALID') +
              ': ' + label + ' | ' + b.length + ' bytes | source match=' + same);
            if (!signature || !same) valid = false;
          }
          for (const { label, ref } of roots) {
            if (!ref) { console.log('SOURCE REFERENCE MISSING: ' + label); valid=false; continue; }
            const source = resolve('account', ref);
            const sourceRel = relative(process.cwd(),source);
            if (sourceRel.startsWith('..'+sep) || sourceRel.startsWith('/') ||
                !sourceRel.startsWith('assets'+sep) || basename(sourceRel) !== label) {
              console.log('SOURCE PATH INVALID: ' + label); valid=false; continue;
            }
            verify(source, resolve('dist',sourceRel), label, 'webp');
          }
          for (const name of ['ivory-entry.css','account.css']) {
            verify(resolve('account',name),resolve('dist/account',name),name,'css');
          }
          const builtHtml = readFileSync('dist/account/index.html','utf8');
          console.log('DIST HTML PRESENT: ' + (builtHtml.length > 0));
          if (!valid) process.exitCode=1;
          JS
      - name: Re-run all established private Node Vite Chromium and QA-only release gates
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
