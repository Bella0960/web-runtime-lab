name: Isolated candidate full-regression diagnostic
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-surface-gate.yml
permissions:
  contents: write
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.actor == github.repository_owner &&
      github.event.before == '84a03d449c942c16373a2d68d94b1a95fd9cf4d4' &&
      github.event.head_commit.message == 'ci: fix diagnostic workflow expression'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public privacy guard
        run: npm run check:public
      - name: Get restricted candidate without publication
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Run sealed diagnostic
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '8c66f9a27c8eeb9292cf205b5092c28529f667ac'
          {
            cd candidate
            npm ci --no-audit --no-fund
            npm run build
            npx playwright install --with-deps chromium
          } > "$RUNNER_TEMP/private-setup.log" 2>&1
          cd candidate
          set +e
          node --test --test-concurrency=1 > "$RUNNER_TEMP/private-node.log" 2>&1
          status=$?
          set -e
          if test "$status" -ne 0; then echo "fail" > "$RUNNER_TEMP/diagnostic-result"; else echo "pass" > "$RUNNER_TEMP/diagnostic-result"; fi
      - name: Save numeric-only failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const file = process.env.RUNNER_TEMP + '/private-node.log';
          const source = existsSync(file) ? readFileSync(file,'utf8') : '';
          const files = existsSync('candidate/tests')
            ? readdirSync('candidate/tests').filter(x=>/\.test\.mjs$/.test(x)).sort()
            : [];
          const errorSections = source.split(/\n(?=\s*not ok\s+\d+\s+-\s+)/m)
            .filter(x=>/^\s*not ok\s+\d+\s+-/m.test(x)).slice(0,30);
          const failedIndices = errorSections.map(x => Number((x.match(/^\s*not ok\s+(\d+)/m)||[])[1]))
            .filter(x => Number.isInteger(x));
          const fileIndices = [...new Set(errorSections.flatMap(block => {
            const names = [...block.matchAll(/tests\/([a-zA-Z0-9_.-]+\.test\.mjs)/g)].map(m=>m[1]);
            return names.map(name=>files.indexOf(name)+1).filter(n=>n>0);
          }))].slice(0,20);
          const summary = source.match(/#\s+(tests|pass|fail|duration_ms)\s+([\d.]+)/g)||[];
          const statusFile = process.env.RUNNER_TEMP + '/diagnostic-result';
          const result = existsSync(statusFile) ? readFileSync(statusFile,'utf8').trim() : 'setup-failed';
          const payload = {run_id:process.env.RUN_ID,stage:'full-node',result,
            failed_test_numbers:failedIndices,file_indices:fileIndices,test_files:files.length,
            summary:summary.slice(-5).map(s=>s.match(/#\s+(\w+)\s+([\d.]+)/)?.slice(1))};
          const url = 'https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/contents/ci-status/node-diagnostic.json';
          const headers = {Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const prev = await fetch(url+'?ref=qa-candidate',{headers});
          const sha = prev.ok ? (await prev.json()).sha : undefined;
          const response = await fetch(url,{method:'PUT',headers,body:JSON.stringify({
            message:'ci: record sealed numeric regression diagnostics',branch:'qa-candidate',
            content:Buffer.from(JSON.stringify(payload)+'\n').toString('base64'),
            ...(sha?{sha}:{})
          })});
          if(!response.ok)throw Error('Cannot publish generic diagnostic receipt: '+response.status);
          console.log('Numeric-only diagnostic receipt recorded.');
          NODE