name: Isolated targeted regression audit
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-surface-gate.yml]
permissions:
  contents: write
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.actor == github.repository_owner &&
      github.event.before == '28cb2c2db2c7a39ce3a6ea743c35538fe0148b97' &&
      github.event.head_commit.message == 'ci: correct isolated test working directory'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public guard
        run: npm run check:public
      - name: Checkout verified candidate in sealed runner
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: refs/pull/345/head
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Build candidate and run targeted suites
        id: test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'bdbb368b958bd3d45edf593b3f7495dd4ed4d011'
          (
            cd candidate
            npm ci --no-audit --no-fund
            npm run build
            npx playwright install --with-deps chromium
          ) > "$RUNNER_TEMP/private-setup.log" 2>&1
          node --input-type=module <<'NODE'
          import {readdirSync,writeFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const files=readdirSync('candidate/tests').filter(f=>f.endsWith('.test.mjs')).sort();
          const ids=[48,50,60,67,72,82,86,93,99,102];
          const results=[];
          for(const id of ids){
            const path=files[id-1];
            if(!path) throw Error('Missing indexed test '+id);
            const r=spawnSync(process.execPath,['--test','tests/'+path],{
              cwd:'candidate',encoding:'utf8',maxBuffer:32*1024*1024,timeout:120000
            });
            const log=String(r.stdout||'')+'\n'+String(r.stderr||'');
            const status=r.status===0&&!r.error;
            results.push({index:id,ok:status,error_type:status?'none':
              /TimeoutError|timeout/i.test(log)?'timeout':
              /AssertionError|ERR_ASSERTION/i.test(log)?'assertion':'other'});
          }
          writeFileSync(process.env.RUNNER_TEMP+'/numeric-suites.json',JSON.stringify(results)+'\n');
          NODE
      - name: Publish anonymized verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const f=process.env.RUNNER_TEMP+'/numeric-suites.json';
          const tests=existsSync(f)?JSON.parse(readFileSync(f,'utf8')):[];
          const payload={run_id:process.env.RUN_ID,result:tests.length===10?'complete':'incomplete',tests};
          const url='https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/contents/ci-status/targeted-audit.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const prior=await fetch(url+'?ref=qa-candidate',{headers});
          const sha=prior.ok?(await prior.json()).sha:undefined;
          const res=await fetch(url,{method:'PUT',headers,body:JSON.stringify({
            message:'ci: record anonymized targeted regression audit',branch:'qa-candidate',
            content:Buffer.from(JSON.stringify(payload)+'\n').toString('base64'),
            ...(sha?{sha}:{})
          })});
          if(!res.ok)throw Error('Cannot record audit receipt: '+res.status);
          console.log('Generic numeric audit recorded.');
          NODE