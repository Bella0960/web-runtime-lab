name: One-time sealed persona chat suite diagnosis
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-persona-chat-gate-isolate-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '133ad074189a63289adcf1d937695ef6ef843be0' && github.event.head_commit.message == 'ci: classify private chat regression using sealed ordinals only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no private content exists in public checkout
        run: npm run check:public
      - name: Verify scoped access
        env:
          SOURCE_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO" && test -n "$SOURCE_REF" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPO"
          echo "::add-mask::${SOURCE_REPO##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Require fixed original QA source
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f3f447d961d9113d6565774a65a7473e49741780'
      - name: Print ordinal-only failing test references (no private logs)
        run: node scripts/sealed-chat-suite-isolator.mjs
