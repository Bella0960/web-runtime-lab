name: Isolated recovery module verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoped-recovery-336.yml'
permissions:
  contents: read
concurrency:
  group: scoped-recovery-336
  cancel-in-progress: false
jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent private source in public runner repo
        run: node scripts/public-content-check.mjs
      - name: Restricted repository configuration
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::$(basename "$SOURCE_REPOSITORY")"
      - name: Checkout pinned candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: cec5766e958f82701069b21116cad250d49e107e
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify source and run isolated recovery gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'cec5766e958f82701069b21116cad250d49e107e'
          cd candidate
          echo 'STAGE 1: dependencies'
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/recovery-install.log" 2>&1 || { echo 'FAILED stage 1'; exit 1; }
          echo 'STAGE 2: dedicated contract'
          node --test tests/luck-room-contract.test.mjs >"$RUNNER_TEMP/recovery-contract.log" 2>&1 || {
            awk '/^not ok [0-9]+/ { print "FAILED_TEST_ORDINAL=" $3 }' "$RUNNER_TEMP/recovery-contract.log" || true
            echo 'FAILED stage 2'; exit 1;
          }
          echo 'STAGE 3: full Vite build'
          npm run build >"$RUNNER_TEMP/recovery-build.log" 2>&1 || { echo 'FAILED stage 3'; exit 1; }
          if [[ ! -f dist/luck-room/luck-room.html ]]; then echo 'FAILED built app HTML missing'; exit 1; fi
          echo 'BUILT_APP_ROUTE_PRESENT'
          echo 'STAGE 4: chromium dependencies'
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/recovery-chrome.log" 2>&1 || { echo 'FAILED stage 4'; exit 1; }
          echo 'STAGE 5: interactive chromium regression'
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/recovery-static-server.log" 2>&1 &
          STATIC_SERVER_PID=$!
          trap 'kill "$STATIC_SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -s -o /dev/null --max-time 5 -w 'STATIC_APP_HTTP_STATUS=%{http_code}\n' http://127.0.0.1:4173/luck-room/luck-room.html || true
          LUCK_ROOM_BASE_URL=http://127.0.0.1:4173 node tests/luck-room-browser.mjs >"$RUNNER_TEMP/recovery-browser.log" 2>&1 || {
            node --input-type=module -e 'import { readFileSync } from "node:fs"; const s=readFileSync(process.env.RUNNER_TEMP+"/recovery-browser.log","utf8"); const m=s.match(/luck-room-browser\.mjs:(\d+):/); console.log("BROWSER_FAIL_LINE="+(m?m[1]:"unknown")); const lines=s.split(String.fromCharCode(10)); const err=lines.find(t=>t.trim().startsWith("Error: ")); const source=readFileSync("tests/luck-room-browser.mjs","utf8").split(String.fromCharCode(10)); const msg=err?err.trim().slice(7):""; const ix=msg?source.findIndex(t=>t.includes(msg)):-1; console.log("ASSERTION_SOURCE_LINE="+(ix>=0?ix+1:"unknown"));'
            echo 'FAILED stage 5'; exit 1;
          }
          echo 'TARGETED RECOVERY GATES PASSED - no deployment'
