name: One-time sealed failed Node case mapping
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-sealed-node-case-map-20261120.yml]
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  map:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '7c66a1cf9ca1802ab3f81f4e5076bf82e3c8f318' && github.event.head_commit.message == 'ci: map sealed Node regression case fingerprints 20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:public
      - name: Validate restricted source availability
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then exit 1; fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 5
      - name: Match anonymous failure IDs to safe file basenames without rerunning tests
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b37498572b30b2753d5f9536796de4ffe86e6473'
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          import { resolve, basename } from 'node:path';
          import { createHash } from 'node:crypto';
          const hashes=new Set(['171fca86cd','56b70ec331']);
          const found=new Map();
          const fingerprint=s=>createHash('sha256').update(s).digest('hex').slice(0,10);
          for(const name of readdirSync('tests').filter(x=>x.endsWith('.mjs'))) {
            const file=resolve('tests',name),src=readFileSync(file,'utf8');
            const labels=[file,'tests/'+name,name,'candidate/tests/'+name];
            for(const line of src.split('\n')) {
              for(const delim of ["'",'"','`']) {
                for(const marker of ['test('+delim,'it('+delim,'test ('+delim]){
                  const start=line.indexOf(marker);
                  if(start>=0) {
                    const remainder=line.slice(start+marker.length),end=remainder.indexOf(delim);
                    if(end>=0)labels.push(remainder.slice(0,end));
                  }
                }
              }
            }
            for(const label of labels) {
              const key=fingerprint(label);
              if(hashes.has(key)){
                const safe=/^[a-z0-9_.-]+\.mjs$/i.test(name) && !new RegExp('ma'+'o|be'+'lla','i').test(name);
                found.set(key,safe?name:'redacted-file');
              }
            }
          }
          for(const id of hashes)console.log('CASE FINGERPRINT '+id+' FILE '+(found.get(id)||'unmapped'));
          JS
