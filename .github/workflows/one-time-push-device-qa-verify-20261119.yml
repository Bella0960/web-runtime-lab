name: One-time MAOMAO push device focused QA verification
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-push-device-qa-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '2b22cac8c4d802faeddd8caadee5570f94eab65a' && github.event.head_commit.message == 'ci: guarded push device subscription verification 20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing public isolation runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require public source isolation
        run: npm run check:public
      - name: Confirm existing restricted private source access
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Restricted private source unavailable'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout existing original private QA branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Pin original QA push device revision
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f4a4790a723b93218ac3740249adca5d78f5426e'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Sealed browser subscription and remote push tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/push-device-focused.log"
          trap 'rm -f "$log"' EXIT
          if (cd candidate && node --test tests/cloud-push-subscription-gesture.test.mjs tests/qa-cloud-settings-integration.test.mjs tests/push-real-empty-mode.test.mjs) > "$log" 2>&1; then
            echo 'Push device permission, subscription, remote Web Push focused gates: PASS'
          else
            echo 'Push device focused gates: FAIL'
            grep -E '^not ok [0-9]+' "$log" | sed -E 's/^(not ok [0-9]+).*/\1/' | tail -12 || true
            exit 1
          fi
