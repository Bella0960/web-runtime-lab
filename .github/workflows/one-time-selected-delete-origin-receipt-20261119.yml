name: One-time read-only selected-delete QA origin receipt check
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-selected-delete-origin-receipt-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-receipt-check
  cancel-in-progress: false
jobs:
  read_only:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '0bc3d107a428384bc9fe11d4d5bf7a93bbd75b2e' && github.event.head_commit.message == 'ci: restrict read-only receipt source to private verified source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve public content isolation
        run: npm run check:public
      - name: Check out exact restricted private QA source read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Verify existing phone QA origin receipt, no deployment or credentials
        env:
          EXPECTED_SHA: '7060d2bd32e346513518c0e8ef9398afe817b6d9'
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const expected=process.env.EXPECTED_SHA;
          const head=execFileSync('git',['-C','candidate','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(head,expected,'Selected QA source changed');
          const source=readFileSync('candidate/scripts/qa-direct-release.mjs','utf8');
          const originLine=source.split(String.fromCharCode(10)).find(s=>s.includes("const url = '")&&s.includes('expectedCommit'));
          assert.ok(originLine,'Original source QA origin contract missing');
          const prefix=originLine.split("'")[1];
          assert.ok(prefix?.startsWith('https://'),'Origin URL is not HTTPS');
          const url=prefix+expected;
          const response = await fetch(url, {
            redirect:'manual',cache:'no-store',headers:{accept:'application/json'},signal:AbortSignal.timeout(15000)
          });
          console.log('QA receipt HTTP status: '+response.status);
          assert.equal(response.status,200,'Original phone QA receipt is not available');
          const receipt=await response.json();
          assert.equal(typeof receipt,'object','QA receipt must be JSON');
          const matched=receipt?.sourceCommit===process.env.EXPECTED_SHA;
          console.log('QA tested SHA receipt match: '+matched);
          assert.ok(matched,'Existing QA domain does not serve this candidate');
          console.log('QA origin version receipt verified (read-only).');
          EOF
