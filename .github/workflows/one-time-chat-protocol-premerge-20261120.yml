name: One-time isolated role protocol premerge validation
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-chat-protocol-premerge-20261120.yml
permissions:
  contents: read
concurrency:
  group: sealed-chat-protocol-premerge-20261120
  cancel-in-progress: false
jobs:
  gate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Public guard checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata isolation
        run: node scripts/public-content-check.mjs
      - name: Checkout immutable private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-CHAT-PROTOCOL-001/weak-persona-preserve-global-rp-20261120
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Require exactly approved candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '08c429791d350e097d8875bc01021b8291a24117'
      - name: Execute private targeted Node and Vite checks with sealed output
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const gates = [
            ['npm', ['ci', '--no-audit', '--no-fund']],
            ['node', ['--test', 'tests/chat-strict-role-isolation.test.mjs']],
            ['node', ['--test', 'tests/offline-worldbook-binding-parity.test.mjs']],
            ['npm', ['run', 'test:chat:contract']],
            ['npm', ['run', 'build']],
            ['npx', ['playwright', 'install', '--with-deps', 'chromium']],
            ['node', ['tests/chat-light-surfaces-browser.mjs']]
          ];
          for (let index = 0; index < gates.length; index++) {
            const [cmd,args] = gates[index];
            const run = spawnSync(cmd,args,{
              cwd:'candidate',stdio:'ignore',timeout:12*60*1000
            });
            if (run.error || run.status !== 0) {
              console.log('SEALED_FAILED_GATE_ORDINAL: ' + (index+1));
              throw new Error('Private candidate premerge gate failed (no private logs emitted)');
            }
            console.log('SEALED_PASS_GATE_ORDINAL: ' + (index+1));
          }
          console.log('PASS: isolated role protocol contracts, full chat contract, Vite and Chromium page');
          NODE
