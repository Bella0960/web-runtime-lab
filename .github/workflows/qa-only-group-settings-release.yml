name: One-time pinned QA-only group settings release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-only-group-settings-release.yml']
permissions:
  contents: read
concurrency:
  group: qa-only-release-gate
  cancel-in-progress: ${{ github.repository_owner == github.actor }}
jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public guard and exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '94861ea3a3b12067dd06b57d3c6c73a4ee4747c6'
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = '.github/workflows/qa-only-group-settings-release.yml'
          node scripts/public-content-check.mjs
      - name: Verify restricted source and target configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          DEPLOY: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_TOKEN"
          test -n "$ACCOUNT" && test -n "$DEPLOY"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::$(basename "$SOURCE_REPOSITORY")"
      - name: Checkout immutable QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: integration/account-fanwai-stack-20261115
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          persist-credentials: true
          path: candidate
          fetch-depth: 10
      - name: Verify pinned SHA and invoke existing QA-only safety gate
        shell: bash
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'ad341afc481063c4a0943380650722e306f3ba20'
          node scripts/run-candidate.mjs release