name: One-time group header Node diagnosis

on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-header-node-diagnosis.yml

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '98540c33a6bb86b4a29d2e49d5d137222eb9ae43' && github.event.head_commit.message == 'ci: one-time inspect group header Node gate without private logs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout private candidate read only
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Run narrow regression groups with redacted output
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          umask 077
          cd candidate
          npm ci --ignore-scripts --no-audit --no-fund > "${RUNNER_TEMP}/qa-deps.log" 2>&1
          deps=$?
          if [ "$deps" -ne 0 ]; then echo "deps: FAIL"; exit 1; fi
          echo "deps: PASS"
          node --test tests/chat-group-title-count.test.mjs > "${RUNNER_TEMP}/group-probe1.log" 2>&1
          c1=$?
          node --test tests/chat-light-surfaces.test.mjs tests/group-social-settings-contract.test.mjs tests/group-governance.test.mjs > "${RUNNER_TEMP}/group-probe2.log" 2>&1
          c2=$?
          node --test tests/chat-regression-contract.test.mjs tests/chat-reply-bubble-mode.test.mjs > "${RUNNER_TEMP}/group-probe3.log" 2>&1
          c3=$?
          node --test tests/qa-release-snapshot.test.mjs tests/qa-release-live-version.test.mjs > "${RUNNER_TEMP}/group-probe4.log" 2>&1
          c4=$?
          for n in 1 2 3 4; do
            flag="c${n}"
            if [ "${!flag}" -eq 0 ]; then echo "probe-${n}: PASS"; else
              echo "probe-${n}: FAIL"
              grep -E "^not ok [0-9]+ " "${RUNNER_TEMP}/group-probe${n}.log" | sed -E "s/^not ok ([0-9]+) .*/probe-${n}-case-\1/" || true
            fi
          done
          rm -f "${RUNNER_TEMP}/qa-deps.log" "${RUNNER_TEMP}/group-probe1.log" "${RUNNER_TEMP}/group-probe2.log" "${RUNNER_TEMP}/group-probe3.log" "${RUNNER_TEMP}/group-probe4.log"
          if (( c1 || c2 || c3 || c4 )); then exit 1; fi
