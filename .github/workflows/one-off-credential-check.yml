name: One-time QA credentials presence check

on:
  push:
    branches:
      - qa-candidate

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'efd267374122cbd27fec11769f4e3c189c5c2224' && github.event.head_commit.message == 'ci: one-time verify QA credentials' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check QA credentials presence without revealing values
        shell: bash
        env:
          ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          DEPLOY_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo 'QA account identifier: configured'
          else
            echo 'QA account identifier: missing or malformed'
            exit 1
          fi
          if [[ "${#DEPLOY_TOKEN}" -ge 20 ]]; then
            echo 'QA deployment secret: configured'
          else
            echo 'QA deployment secret: missing or malformed'
            exit 1
          fi
          echo 'Presence check passed. No token contents verified or displayed. No deployment.'
