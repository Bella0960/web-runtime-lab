name: One-time original QA role lore full verification
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-qa-role-lore-verify-20261119.yml]
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '40ffb1b811ec44527637a3e0d976958ec0a0fc89' && github.event.head_commit.message == 'ci: sealed full QA role lore verification after complete contract repair' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public safety runner
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Node 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Public privacy and metadata guard
        run: npm run check:public
      - name: Confirm restricted existing source authorization
        shell: bash
        env:
          SRC: ${{ secrets.CANDIDATE_REPOSITORY }}
          REF: ${{ secrets.CANDIDATE_REF }}
          TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SRC" && test -n "$REF" && test -n "$TOKEN"
          echo "::add-mask::$SRC"
          echo "::add-mask::${SRC##*/}"
          echo "::add-mask::$REF"
      - name: Checkout private original QA only
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact verified QA branch snapshot
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd9863dcb7cbb40890c3492b16b23ff70a55dca70'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
          echo 'Exact private QA source pinned.'
      - name: Run existing complete private Node Vite Chromium security validation
        run: node scripts/run-candidate.mjs verify
