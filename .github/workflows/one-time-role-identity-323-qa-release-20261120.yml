name: One-time fully gated weak-role identity QA-only deployment
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-role-identity-323-qa-release-20261120.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '3445766f2f379f6095a478cc79e603e71ea47943' && github.event.head_commit.message == 'ci: owner-approved weak-role identity QA-only release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing public safety scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public isolation policy
        run: node scripts/public-content-check.mjs
      - name: Checkout original private QA branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require immutable approved QA source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'e71766bdbe4af9cd53dcb49c0fe67c78dc746672'
          test "$(git -C candidate branch --show-current)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git -C candidate status --porcelain)"
      - name: Run original complete Node Vite Chromium gates and QA-only deployment
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
