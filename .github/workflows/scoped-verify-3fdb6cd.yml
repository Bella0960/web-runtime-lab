name: Scoped candidate verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoped-verify-3fdb6cd.yml'

permissions:
  contents: read

concurrency:
  group: scoped-verify-3fdb6cd-${{ startsWith(github.event.head_commit.message, 'VERIFY_LAYOUT_') && 'desktop-only' || 'shared' }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Confirm restricted source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_REF" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event.head_commit.message == 'VERIFY_LAYOUT_CLOCK_FIX_439_20261123' && 'integration/qa-desktop-439-20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_CLOCK_DIAG_439_20261123' && 'integration/qa-desktop-439-20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_QA_RELEASE_RETRY_439_20261123' && 'integration/qa-desktop-439-20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_QA_RELEASE_439_20261123' && 'integration/qa-desktop-439-20261123' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_QA_V125_PWA_20261123' && 'integration/qa-admin-cloud-v125-20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_FINAL_GATE_R10_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_FINAL_INTERACTIONS_R9_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_UNBLOCK_R8_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_FULL_FIXTURE_R7_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_STORAGE_R6_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R5_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R4_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_OVERFLOW_DIAG_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VIEWPORT_R2_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_CORE_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || '3db5c6764d2daa12effd6bc0aa49a1ec16a91938' }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 100
      - name: Run all existing candidate gates with sealed logs
        if: github.event.head_commit.message != 'VERIFY_LAYOUT_VISIBLE_DRAG_R5_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_STORAGE_R6_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_FULL_FIXTURE_R7_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_UNBLOCK_R8_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_FINAL_GATE_R10_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_QA_RELEASE_439_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_QA_RELEASE_RETRY_439_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_CLOCK_DIAG_439_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_CLOCK_FIX_439_20261123'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_QA_V125_PWA_20261123' && 'a44210fad43b4eec2eebf4c929403e086086406e' || github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R4_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_OVERFLOW_DIAG_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VIEWPORT_R2_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_CORE_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || '3db5c6764d2daa12effd6bc0aa49a1ec16a91938' }}"
          test "$(git -C candidate rev-parse HEAD)" = "$expected"
          cd candidate
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_QA_V125_PWA_20261123' ]]; then
            echo 'ADMIN_QA_V125 exact source full release gates, verify only'
            node scripts/qa-direct-release.mjs >"$RUNNER_TEMP/admin-full-qa-v125.log" 2>&1 || {
              grep -E '(failed \(exit|QA release stopped:|Error:|not ok [0-9]+|^# fail [1-9])' "$RUNNER_TEMP/admin-full-qa-v125.log" | tail -n 12 | cut -c1-160 || true
              echo 'ADMIN_QA_FULL_FAIL; never deploy on failure'
              exit 1
            }
            echo 'ADMIN_QA_FULL_PASS Node, Vite, Chromium, WebKit, Workerd and existing release guards; no deploy'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_CORE_20261123' || "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_VIEWPORT_R2_20261123' || "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_OVERFLOW_DIAG_20261123' ]]; then
            echo 'LAYOUT_QA pinned candidate; verify only'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/desk-install.log" 2>&1 || { echo 'LAYOUT_FAIL npm-ci'; exit 1; }
            if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_CORE_20261123' ]]; then
            node --test tests/default-desktop-layout.test.mjs >"$RUNNER_TEMP/desk-node.log" 2>&1 || {
              echo 'LAYOUT_FAIL node'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/desk-node.log" | tail -n 12 | cut -c1-135 || true
              exit 1
            }
            grep -E '^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/desk-node.log" | tail -n 4 || true
            echo 'LAYOUT_PASS node'
            else
              echo 'LAYOUT_REUSE prior Node 21/21 pass, run 45170447836'
            fi
            npm run build >"$RUNNER_TEMP/desk-vite.log" 2>&1 || { echo 'LAYOUT_FAIL vite'; exit 1; }
            echo 'LAYOUT_PASS vite'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/desk-chromium-install.log" 2>&1 || { echo 'LAYOUT_FAIL chromium-install'; exit 1; }
            if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_CORE_20261123' ]]; then
            node tests/desktop-app-navigation.browser.mjs >"$RUNNER_TEMP/desk-browser-navigation.log" 2>&1 || { echo 'LAYOUT_FAIL navigation-browser'; exit 1; }
            echo 'LAYOUT_PASS navigation-browser'
            else
              echo 'LAYOUT_REUSE prior Chromium navigation pass, run 45170447836'
            fi
            set +e
            node --input-type=module >"$RUNNER_TEMP/desk-viewport.log" 2>&1 <<'DESKTOP_QA_SCRIPT'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import path from 'node:path';
          import {chromium} from 'playwright';
          const dist=path.resolve('dist');
          const server=createServer(async(req,res)=>{
            try{
              const name=new URL(req.url||'/','http://127.0.0.1').pathname;
              const file=path.resolve(dist,'.'+(name==='/'?'/index.html':name));
              if(!file.startsWith(dist+path.sep)){res.writeHead(403).end();return;}
              const data=await readFile(file);
              res.setHeader('Content-Type',({'.html':'text/html','.js':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.webp':'image/webp','.svg':'image/svg+xml','.woff2':'font/woff2'})[path.extname(file)]||'application/octet-stream');
              res.setHeader('Cache-Control','no-store');
              res.end(data);
            }catch{res.writeHead(404).end();}
          });
          await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(0,'127.0.0.1',resolve);});
          const browser=await chromium.launch({headless:true});
          let checkpoint='start';
          try{
            for(const [w,h] of [[375,667],[390,844],[430,932]]){
              checkpoint='context_'+w;console.log('VIEWPORT_CHECK context '+w);
              const ctx=await browser.newContext({viewport:{width:w,height:h},isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const page=await ctx.newPage();const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:'+server.address().port+'/index.html',{waitUntil:'load'});
              assert.equal(response?.status(),200);
              await page.locator('#gridPage0 [data-drag="clock-lg"]').waitFor({timeout:25000});
              checkpoint='base_'+w;
              const base=await page.evaluate(()=>{
                const g=document.getElementById('gridPage0');
                return {items:[...g.querySelectorAll(':scope > [data-drag]')].map(x=>x.dataset.drag),defaultLayout:g.classList.contains('is-default-layout'),docWidth:document.documentElement.scrollWidth,gridWidth:g.getBoundingClientRect().width,dockSize:document.querySelectorAll('#dockBar > [data-drag]').length};
              });
              console.log('VIEWPORT_CHECK base '+w+' count='+base.items.length+' default='+Number(base.defaultLayout)+' scroll='+base.docWidth+' grid='+Math.round(base.gridWidth)+' dock='+base.dockSize);
              const sizes=await page.evaluate(()=>{
                const entries=[
                  ['root',document.documentElement],['body',document.body],
                  ['stage',document.querySelector('.simulator-stage')],
                  ['frame',document.querySelector('.phone')],
                  ['screen',document.querySelector('.phone-screen')],
                  ['pages',document.querySelector('.pages-container')],
                  ['firstpage',document.querySelector('#gridPage0')?.closest('.home-page')],
                  ['firstgrid',document.querySelector('#gridPage0')],
                  ['dockwrap',document.querySelector('.dock-wrapper')],
                  ['dock',document.querySelector('#dockBar')]
                ];
                return entries.map(([label,node])=>{
                  if(!node)return {label,missing:true};
                  const b=node.getBoundingClientRect();
                  return {label,l:Math.round(b.left),r:Math.round(b.right),w:Math.round(b.width),client:node.clientWidth,scroll:node.scrollWidth};
                });
              });
              console.log('VIEWPORT_CHECK sizes '+w+' '+JSON.stringify(sizes));
              assert.equal(base.items.length,11);assert.equal(base.defaultLayout,true);
              assert.equal(new Set(base.items).size,base.items.length);
              assert.ok(base.gridWidth>0&&base.gridWidth<=w);
              assert.ok(base.docWidth<=w+3,'horizontal overflow');
              assert.ok(base.dockSize>=2);
              const order=[...base.items];[order[1],order[2]]=[order[2],order[1]];
              const layout={v:14,pages:[order,[],[]],dock:['app_chat','app_shop'],removed:[]};
              await page.evaluate(v=>localStorage.setItem('ds_layout_v14',JSON.stringify(v)),layout);
              checkpoint='reload_'+w;console.log('VIEWPORT_CHECK reload '+w);
              await page.reload({waitUntil:'load'});
              await page.waitForFunction(()=>document.getElementById('gridPage0')?.firstElementChild?.dataset.drag==='clock-lg');
              const after=await page.evaluate(()=>{
                const g=document.getElementById('gridPage0');
                return {items:[...g.querySelectorAll(':scope > [data-drag]')].map(x=>x.dataset.drag),defaultLayout:g.classList.contains('is-default-layout'),stored:JSON.parse(localStorage.getItem('ds_layout_v14'))};
              });
              checkpoint='after_'+w;
              console.log('VIEWPORT_CHECK after '+w+' default='+Number(after.defaultLayout)+' storedPages='+after.stored.pages.length);
              assert.deepEqual(after.items.slice(0,3),order.slice(0,3));
              assert.equal(after.defaultLayout,false);
              assert.deepEqual(after.stored.pages[0],order);
              assert.deepEqual(errors,[]);
              await page.screenshot({path:process.env.RUNNER_TEMP+'/desk-'+w+'.png'});
              console.log('VIEWPORT_PASS '+w+'x'+h);
              await ctx.close();
            }
          }catch(e){console.log('VIEWPORT_CHECK failure checkpoint='+checkpoint+' kind='+String(e.name||'Error').replace(/[^a-zA-Z]/g,''));throw e;}
          finally{await browser.close();await new Promise(resolve=>server.close(resolve));}
          DESKTOP_QA_SCRIPT
            viewport_exit=$?
            set -e
            grep -E '^VIEWPORT_(CHECK|PASS) ' "$RUNNER_TEMP/desk-viewport.log" | tail -n 25 | cut -c1-170 || true
            if [[ "$viewport_exit" -ne 0 ]]; then
              echo 'LAYOUT_FAIL viewport-persistence; exact reason in sealed runner log'
              exit 1
            fi
            echo 'LAYOUT_PASS viewports 375 390 430 and persistent custom order; no deploy'
            exit 0
          fi
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const source = readFileSync('scripts/qa-direct-release.mjs', 'utf8');
          const list = source.match(/const TESTS = (\[[\s\S]*?\n\]);/);
          if (!list) throw new Error('Release test list unavailable');
          const gates = Function('return ' + list[1])();
          const reporter = process.env.RUNNER_TEMP + '/sealed-reporter.mjs';
          writeFileSync(reporter, `import { createHash } from 'node:crypto';
          export default async function* (events) {
            for await (const event of events) {
              if (event.type !== 'test:fail') continue;
              const d = event.data;
              const file = (d.file || '').replace(process.cwd() + '/', '');
              const hash = createHash('sha256').update(file).digest('hex').slice(0, 12);
              yield 'SEALED_FAIL ' + hash + ':' + (Number(d.line) || 0) + '\\n';
            }
          }`);
          for (const [index, [command, args]] of gates.entries()) {
            if (index === 16) args.push('--test-reporter=' + reporter);
            if (index === 16) {
              const failure = spawnSync(command, args, {encoding:'utf8', maxBuffer: 32 * 1024 * 1024, timeout: 4500000});
              for (const line of (failure.stdout || '').split('\n')) {
                if (/^SEALED_FAIL [a-f0-9]{12}:\d+$/.test(line)) console.log(line);
              }
              if (failure.status !== 0) throw new Error('Full Node regression failed');
              continue;
            }
            const result = spawnSync(command, args, {stdio:'ignore', timeout: 4500000});
            if (result.status !== 0) throw new Error('Candidate failed at gate ' + (index + 1) + ' of ' + gates.length);
          }
          console.log('All ' + gates.length + ' gates passed.');
          JS

      - name: Pinned desktop browser and data-safety QA
        if: github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R5_20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_STORAGE_R6_20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_FULL_FIXTURE_R7_20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_UNBLOCK_R8_20261123'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '8ff181c2afbf2d3c15130684fe7f196e6adb33f8'
          cd candidate
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/desktop-ci.log" 2>&1 || { echo 'DQA_FAIL dependency'; exit 1; }
          npm run build >"$RUNNER_TEMP/desktop-build.log" 2>&1 || { echo 'DQA_FAIL vite'; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/desktop-browser-install.log" 2>&1 || { echo 'DQA_FAIL browser-install'; exit 1; }
          set +e
          node --input-type=module >"$RUNNER_TEMP/desktop-visible.log" 2>&1 <<'DESKTOP_VISIBLE_QA'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import path from 'node:path';
          import {chromium} from 'playwright';
          const root=path.resolve('dist');
          const server=createServer(async(req,res)=>{
            try{
              const name=new URL(req.url||'/','http://127.0.0.1').pathname;
              const file=path.resolve(root,'.'+(name==='/'?'/index.html':name));
              if(!file.startsWith(root+path.sep)){res.writeHead(403).end();return;}
              const data=await readFile(file);
              res.setHeader('Content-Type',({'.html':'text/html','.css':'text/css','.js':'text/javascript','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.webp':'image/webp','.woff2':'font/woff2'})[path.extname(file)]||'application/octet-stream');
              res.end(data);
            }catch{res.writeHead(404).end();}
          });
          await new Promise((yes,no)=>{server.once('error',no);server.listen(0,'127.0.0.1',yes);});
          const browser=await chromium.launch({headless:true});
          let stage='setup';
          try{
            for(const [w,h] of [[375,667],[390,844],[430,932]]){
              stage='start'+w;
              const context=await browser.newContext({viewport:{width:w,height:h},isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:'+server.address().port+'/index.html',{waitUntil:'load'});
              assert.equal(response?.status(),200);
              await page.locator('#gridPage0 > [data-drag="clock-lg"]').waitFor({timeout:18000});
              stage='geometry'+w;
              const visible=await page.evaluate(()=>{
                const g=document.querySelector('#gridPage0'),items=[...g.querySelectorAll(':scope > [data-drag]')].map(x=>x.dataset.drag);
                const rects=['.simulator-stage','.phone','.phone-screen','.pages-container','#gridPage0','#dockBar'].map(id=>document.querySelector(id).getBoundingClientRect());
                return {items,default:g.classList.contains('is-default-layout'),bodyWidth:document.body.scrollWidth,viewport:innerWidth,clip:getComputedStyle(document.documentElement).overflowX,rects:rects.map(r=>({left:r.left,right:r.right}))};
              });
              assert.equal(visible.items.length,11);
              assert.equal(new Set(visible.items).size,11);
              assert.equal(visible.default,true);
              assert.ok(visible.bodyWidth<=w+3,'visible body overflow');
              assert.ok(visible.clip==='hidden'||visible.clip==='clip','visible overflow not clipped');
              for(const rect of visible.rects)assert.ok(rect.left>=-3&&rect.right<=w+3,'visible element outside viewport');
              console.log('DQA_PASS geometry_'+w);
              stage='storage'+w;
              const order=[...visible.items];[order[1],order[2]]=[order[2],order[1]];
              await page.evaluate(ids=>{
                const old=JSON.parse(localStorage.getItem('ds_layout_v14'));
                if(!old||!Array.isArray(old.pages)||old.pages.length<3)throw Error('Invalid complete baseline fixture');
                old.pages[0]=ids;
                localStorage.setItem('ds_layout_v14',JSON.stringify(old));
              },order);
              await page.reload({waitUntil:'load'});
              await page.waitForFunction(()=>document.querySelector('#gridPage0 > [data-drag]')?.dataset.drag==='clock-lg');
              const restored=await page.evaluate(()=>{const grid=document.querySelector('#gridPage0');return {ids:[...grid.querySelectorAll(':scope > [data-drag]')].map(x=>x.dataset.drag),fixed:grid.classList.contains('is-default-layout'),saved:JSON.parse(localStorage.getItem('ds_layout_v14'))}});
              console.log('DQA_STATE storage_'+w+' original='+order.length+' actual='+restored.ids.length+
                ' first3='+Number(JSON.stringify(restored.ids.slice(0,3))===JSON.stringify(order.slice(0,3)))+
                ' fixed='+Number(restored.fixed)+' savedLen='+restored.saved.pages[0].length+
                ' savedMatch='+Number(JSON.stringify(restored.saved.pages[0])===JSON.stringify(order)));
              assert.deepEqual(restored.ids.slice(0,3),order.slice(0,3));
              assert.equal(restored.fixed,false);
              assert.deepEqual(restored.saved.pages[0],order);
              console.log('DQA_PASS persistence_'+w);
              if(w===390){
                stage='mouse-drag';
                const source=page.locator('#gridPage0 > [data-drag="app_inspect"]'),dest=page.locator('#gridPage0 > [data-drag="app_worldbook"]');
                await source.scrollIntoViewIfNeeded();
                const box=await source.boundingBox(),target=await dest.boundingBox();
                assert.ok(box&&target);
                await page.mouse.move(box.x+box.width/2,box.y+box.height/2);
                await page.mouse.down();await page.waitForTimeout(320);
                await page.mouse.move(target.x+target.width/2,target.y+target.height/2,{steps:6});await page.mouse.up();
                const drag=await page.evaluate(()=>({ids:[...document.querySelectorAll('#gridPage0 > [data-drag]')].map(x=>x.dataset.drag),stored:JSON.parse(localStorage.getItem('ds_layout_v14')),ghosts:document.querySelectorAll('.drag-placeholder,.drag-avatar').length}));
                assert.equal(drag.ids.length,order.length);
                assert.equal(new Set(drag.ids).size,order.length);
                assert.deepEqual(drag.stored.pages[0],drag.ids);
                assert.equal(drag.ghosts,0);
                console.log('DQA_PASS mouse_drag_390');
                stage='touch-cancel';
                const before=await page.evaluate(()=>localStorage.getItem('ds_layout_v14'));
                await page.evaluate(()=>{
                  const el=document.querySelector('#gridPage0 > [data-drag="app_inspect"]'),r=el.getBoundingClientRect();
                  const t=new Touch({identifier:2,target:el,clientX:r.left+r.width/2,clientY:r.top+r.height/2});
                  el.dispatchEvent(new TouchEvent('touchstart',{bubbles:true,touches:[t],targetTouches:[t],changedTouches:[t]}));
                });
                await page.waitForTimeout(170);
                await page.evaluate(()=>document.dispatchEvent(new TouchEvent('touchcancel',{bubbles:true,touches:[],changedTouches:[]})));
                const cancel=await page.evaluate(()=>({saved:localStorage.getItem('ds_layout_v14'),ghosts:document.querySelectorAll('.drag-placeholder,.drag-avatar').length,hidden:document.querySelector('#gridPage0 > [data-drag="app_inspect"]')?.classList.contains('is-dragging-source')}));
                assert.equal(cancel.saved,before);assert.equal(cancel.ghosts,0);assert.equal(cancel.hidden,false);
                console.log('DQA_PASS cancel_390');
              }
              assert.deepEqual(errors,[]);
              await page.screenshot({path:process.env.RUNNER_TEMP+'/desktop-'+w+'.png'});
              await context.close();
            }
          }catch(e){console.log('DQA_FAIL '+stage+' '+String(e.name||'Error').replace(/[^A-Za-z]/g,''));throw e;}
          finally{await browser.close();await new Promise(done=>server.close(done));}
          DESKTOP_VISIBLE_QA
          outcome=$?
          set -e
          grep -E '^DQA_(PASS|FAIL|STATE) ' "$RUNNER_TEMP/desktop-visible.log" | tail -n 20 | cut -c1-120 || true
          test "$outcome" -eq 0 || { echo 'DQA_FAILED test-only; no merge or deploy'; exit 1; }
          echo 'DQA_ALL_PASS verify-only; no deployment'

      - name: Pinned desktop final interaction verification
        if: github.event.head_commit.message == 'VERIFY_LAYOUT_FINAL_INTERACTIONS_R9_20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_FINAL_GATE_R10_20261123'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '8ff181c2afbf2d3c15130684fe7f196e6adb33f8'
          cd candidate
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/desktop-final-ci.log" 2>&1 || { echo 'DFINAL_FAIL dependencies'; exit 1; }
          npm run build >"$RUNNER_TEMP/desktop-final-build.log" 2>&1 || { echo 'DFINAL_FAIL build'; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/desktop-final-browser.log" 2>&1 || { echo 'DFINAL_FAIL chromium-install'; exit 1; }
          set +e
          node --input-type=module >"$RUNNER_TEMP/desktop-final.log" 2>&1 <<'DESKTOP_FINAL_QA'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import path from 'node:path';
          import {chromium} from 'playwright';
          const base=path.resolve('dist');
          const server=createServer(async(req,res)=>{
            try{
              const url=new URL(req.url||'/','http://127.0.0.1');
              const file=path.resolve(base,'.'+(url.pathname==='/'?'/index.html':url.pathname));
              if(!file.startsWith(base+path.sep)){res.writeHead(403).end();return;}
              const payload=await readFile(file);
              res.setHeader('Content-Type',({'.html':'text/html','.js':'text/javascript','.css':'text/css','.png':'image/png','.svg':'image/svg+xml','.webp':'image/webp','.woff2':'font/woff2','.json':'application/json'})[path.extname(file)]||'application/octet-stream');
              res.setHeader('Cache-Control','no-store');
              res.end(payload);
            }catch{res.writeHead(404).end();}
          });
          await new Promise((yes,no)=>{server.once('error',no);server.listen(0,'127.0.0.1',yes);});
          const browser=await chromium.launch({headless:true});
          const url=()=> 'http://127.0.0.1:'+server.address().port+'/index.html';
          const open=async()=>{
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            await page.goto(url(),{waitUntil:'load'});
            await page.locator('#gridPage0 [data-drag="clock-lg"]').waitFor({timeout:18000});
            return {context,page};
          };
          const drag=async(page,selector,toX,toY)=>{
            const el=page.locator(selector);await el.scrollIntoViewIfNeeded();
            const b=await el.boundingBox();assert.ok(b);
            await page.mouse.move(b.x+b.width/2,b.y+b.height/2);
            await page.mouse.down();
            await page.waitForTimeout(340);
            await page.mouse.move(toX,toY,{steps:10});
          };
          let stage='init';
          try{
            stage='cross-page-prepare';
            {
              const {context,page}=await open();
              await page.evaluate(()=>{
                const l=JSON.parse(localStorage.getItem('ds_layout_v14'));
                l.removed=l.removed.filter(x=>x!=='social');
                l.pages[1].unshift('social');
                localStorage.setItem('ds_layout_v14',JSON.stringify(l));
              });
              await page.reload({waitUntil:'load'});
              await page.locator('#gridPage1 > [data-drag="social"]').waitFor();
              const span=await page.locator('#gridPage1 > [data-drag="social"]').evaluate(el=>{const s=getComputedStyle(el);return [s.gridColumnStart,s.gridColumnEnd,s.gridRowStart,s.gridRowEnd]});
              assert.ok(span.join(' ').includes('span 4'),'social width not four columns');
              assert.ok(span.join(' ').includes('span 3'),'social height not three rows');
              console.log('DFINAL_PASS wide-widget-4x3');
              stage='cross-page-drag';
              await page.evaluate(()=>document.querySelectorAll('.page-dots .dot')[1].click());
              await page.waitForTimeout(500);
              await drag(page,'#gridPage1 > [data-drag="social"]',380,210);
              await page.waitForTimeout(530);
              await page.mouse.up();
              const end=await page.evaluate(()=>({
                onLast:!!document.querySelector('#gridPage2 > [data-drag="social"]'),
                stored:JSON.parse(localStorage.getItem('ds_layout_v14')),
                ghostCount:document.querySelectorAll('.drag-avatar,.drag-placeholder').length
              }));
              assert.equal(end.onLast,true,'wide widget did not cross to next page');
              assert.equal(end.stored.pages[2].includes('social'),true);
              assert.equal(end.ghostCount,0);
              await page.reload({waitUntil:'load'});
              assert.equal(await page.locator('#gridPage2 > [data-drag="social"]').count(),1);
              console.log('DFINAL_PASS wide-widget-cross-page-and-reload');
              await context.close();
            }
            stage='dock-limit';
            {
              const {context,page}=await open();
              await page.evaluate(()=>{
                const v=JSON.parse(localStorage.getItem('ds_layout_v14'));
                const extra=['app_inspect','app_worldbook','app_memory'];
                v.pages=v.pages.map(p=>p.filter(id=>!extra.includes(id)));
                v.dock=[...v.dock,...extra];
                localStorage.setItem('ds_layout_v14',JSON.stringify(v));
              });
              await page.reload({waitUntil:'load'});
              assert.equal(await page.locator('#dockBar > [data-drag]').count(),5);
              const box=await page.locator('#dockBar').boundingBox();assert.ok(box);
              await drag(page,'#gridPage0 > [data-drag="app_forum"]',box.x+box.width/2,box.y+box.height/2);
              await page.mouse.up();
              const state=await page.evaluate(()=>({
                dock:[...document.querySelectorAll('#dockBar > [data-drag]')].map(el=>el.dataset.drag),
                forumInGrid:!!document.querySelector('#gridPage0 > [data-drag="app_forum"]'),
                persisted:JSON.parse(localStorage.getItem('ds_layout_v14')),
                ghosts:document.querySelectorAll('.drag-placeholder,.drag-avatar').length
              }));
              assert.equal(state.dock.length,5);
              assert.equal(state.forumInGrid,true);
              assert.equal(state.persisted.dock.length,5);
              assert.equal(state.persisted.pages[0].includes('app_forum'),true);
              assert.equal(state.ghosts,0);
              console.log('DFINAL_PASS dock-max-five-no-data-loss');
              await context.close();
            }
            stage='legacy-preservation';
            {
              const {context,page}=await open();
              const original=await page.evaluate(()=>{
                const old=localStorage.getItem('ds_layout_v14');
                localStorage.setItem('ds_layout_v13',old);
                localStorage.removeItem('ds_layout_v14');
                return old;
              });
              await page.reload({waitUntil:'load'});
              const migrated=await page.evaluate(()=>({old:localStorage.getItem('ds_layout_v13'),latest:localStorage.getItem('ds_layout_v14')}));
              assert.equal(migrated.old,original,'legacy record deleted or rewritten');
              assert.ok(migrated.latest,'new version was not created');
              await page.evaluate(()=>localStorage.setItem('ds_layout_v14','{broken'));
              await page.reload({waitUntil:'load'});
              const recovered=await page.evaluate(()=>({old:localStorage.getItem('ds_layout_v13'),latest:JSON.parse(localStorage.getItem('ds_layout_v14'))}));
              assert.equal(recovered.old,original);
              assert.equal(recovered.latest.v,14);
              assert.ok(recovered.latest.pages.length>=3);
              console.log('DFINAL_PASS legacy-preserved-and-corrupt-recovered');
              await context.close();
            }
          }catch(e){console.log('DFINAL_FAIL '+stage+' '+String(e.name||'Error').replace(/[^a-zA-Z]/ig,''));throw e;}
          finally{await browser.close();await new Promise(done=>server.close(done));}
          DESKTOP_FINAL_QA
          status=$?
          set -e
          grep -E '^DFINAL_(PASS|FAIL) ' "$RUNNER_TEMP/desktop-final.log" | tail -n 15 | cut -c1-120 || true
          test "$status" -eq 0 || exit 1
          echo 'DFINAL_ALL_PASS; no deploy'

      - name: Pinned desktop integrated QA-only release
        if: github.event.head_commit.message == 'VERIFY_LAYOUT_QA_RELEASE_439_20261123' || github.event.head_commit.message == 'VERIFY_LAYOUT_QA_RELEASE_RETRY_439_20261123'
        shell: bash
        env:
          CANDIDATE_READ_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
