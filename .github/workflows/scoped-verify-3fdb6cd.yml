name: Scoped candidate verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoped-verify-3fdb6cd.yml'

permissions:
  contents: read

concurrency:
  group: scoped-verify-3fdb6cd
  cancel-in-progress: false

jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Confirm restricted source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_REF" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_001_SCOPED_20261123' && '08b61d81024c8c98e6c168f6512dfb2fc408d0bf' || '3db5c6764d2daa12effd6bc0aa49a1ec16a91938' }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 100
      - name: Run all existing candidate gates with sealed logs
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_001_SCOPED_20261123' && '08b61d81024c8c98e6c168f6512dfb2fc408d0bf' || '3db5c6764d2daa12effd6bc0aa49a1ec16a91938' }}"
          test "$(git -C candidate rev-parse HEAD)" = "$expected"
          cd candidate
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_001_SCOPED_20261123' ]]; then
            echo 'ADMIN-CLOUD-001 SOURCE_SHA_VERIFIED, test-only'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-ci.log" 2>&1 || { echo 'ADMIN_FAIL npm-ci'; exit 1; }
            npm run test:admin:cloud >"$RUNNER_TEMP/admin-node.log" 2>&1 || {
              echo 'ADMIN_FAIL node-test'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-node.log" | head -n 40 | cut -c1-180 || true
              exit 1
            }
            grep -E '^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-node.log" | tail -n 5 || true
            echo 'ADMIN_PASS node-test'
            npm run build >"$RUNNER_TEMP/admin-vite.log" 2>&1 || { echo 'ADMIN_FAIL vite-build'; exit 1; }
            test -f dist/admin/cloud.html && test -f dist/admin/js/cloud-admin.js && test -f dist/admin/js/cloud-admin-core.js && test -f dist/admin/css/cloud-admin.css || { echo 'ADMIN_FAIL assets'; exit 1; }
            node --input-type=module -e '
              import fs from "node:fs";
              const list=JSON.parse(fs.readFileSync("dist/pwa-pages.json","utf8"));
              if(!Array.isArray(list)||list.some(p=>String(p).startsWith("admin/")))process.exit(1);
            ' || { echo 'ADMIN_FAIL private-pwa'; exit 1; }
            echo 'ADMIN_PASS vite-and-pwa'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/admin-chromium-setup.log" 2>&1 || { echo 'ADMIN_FAIL chromium-install'; exit 1; }
            npm run test:admin:cloud:browser >"$RUNNER_TEMP/admin-browser.log" 2>&1 || {
              echo 'ADMIN_FAIL chromium'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-browser.log" | head -n 25 | cut -c1-180 || true
              exit 1
            }
            echo 'ADMIN_PASS browser-375-390-430; no deploy'
            exit 0
          fi
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const source = readFileSync('scripts/qa-direct-release.mjs', 'utf8');
          const list = source.match(/const TESTS = (\[[\s\S]*?\n\]);/);
          if (!list) throw new Error('Release test list unavailable');
          const gates = Function('return ' + list[1])();
          const reporter = process.env.RUNNER_TEMP + '/sealed-reporter.mjs';
          writeFileSync(reporter, `import { createHash } from 'node:crypto';
          export default async function* (events) {
            for await (const event of events) {
              if (event.type !== 'test:fail') continue;
              const d = event.data;
              const file = (d.file || '').replace(process.cwd() + '/', '');
              const hash = createHash('sha256').update(file).digest('hex').slice(0, 12);
              yield 'SEALED_FAIL ' + hash + ':' + (Number(d.line) || 0) + '\\n';
            }
          }`);
          for (const [index, [command, args]] of gates.entries()) {
            if (index === 16) args.push('--test-reporter=' + reporter);
            if (index === 16) {
              const failure = spawnSync(command, args, {encoding:'utf8', maxBuffer: 32 * 1024 * 1024, timeout: 4500000});
              for (const line of (failure.stdout || '').split('\n')) {
                if (/^SEALED_FAIL [a-f0-9]{12}:\d+$/.test(line)) console.log(line);
              }
              if (failure.status !== 0) throw new Error('Full Node regression failed');
              continue;
            }
            const result = spawnSync(command, args, {stdio:'ignore', timeout: 4500000});
            if (result.status !== 0) throw new Error('Candidate failed at gate ' + (index + 1) + ' of ' + gates.length);
          }
          console.log('All ' + gates.length + ' gates passed.');
          JS
