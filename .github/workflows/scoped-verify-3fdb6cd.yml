          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const source=readFileSync('candidate/scripts/qa-direct-release.mjs','utf8');
          const extract=(start,until)=>{
            const a=source.indexOf(start),b=source.indexOf(until,a);
            assert.ok(a>=0 && b>a,'V148_EXACT_SMOKE_CONTRACT_MISSING');
            return source.slice(a,b);
          };
          // Call the actual private-source post-upload functions as-is, with
          // no credentials and only read-only fetch. Private response bodies
          // and messages never enter the public log.
          const functions=extract('async function verifyOwnerQaOrigin(', '\nfunction secretNames(')
            +'\n'+extract('async function qaHttpSmoke(', '\nfunction verifiedAccountCounts(');
          const ctx={fetch,assert,URL,AbortSignal,console:{log(){}}};
          const api=vm.runInNewContext(functions+'\n({verifyOwnerQaOrigin,qaHttpSmoke})',ctx);
          const classify=err=>{
            const message=String(err?.message||'');
            const labels=[
              ['login-document',/QA login document|login form/],
              ['login-js',/login HTML is still referencing|password warning JavaScript|QA login JavaScript/],
              ['login-css',/stylesheet|password warning style|QA login stylesheet|login source stylesheet/],
              ['setup-page',/QA founder setup|QA setup cannot/],
              ['status-endpoint',/QA status endpoint|QA account mode|QA core is not reachable|QA identity|QA bootstrap|QA one-time setup/],
              ['owner-receipt',/QA domain|different QA build|build receipt/],
              ['fetch-timeout',/fetch failed|timeout|AbortError|ECONNRESET|ENOTFOUND|EAI_AGAIN/]
            ];
            return labels.find(([,r])=>r.test(message))?.[0]||'other-protected-condition';
          };
          const checks=[
            ['login-smoke',()=>api.qaHttpSmoke(true)],
            ['owner-sha',()=>api.verifyOwnerQaOrigin('34db4621777e28e441ef2f9d5d28809ce5891da0')]
          ];
