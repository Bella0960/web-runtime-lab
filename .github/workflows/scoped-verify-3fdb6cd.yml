nt.head_commit.message != 'VERIFY_LAYOUT_QA_HD_WALLPAPER_RELEASE_459_20261123' && github.event.head_commit.message != 'RELEASE_ADMIN_EDITORIAL_V145_QA_ONLY_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_QA_HD_WALLPAPER_R2_RELEASE_459_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_QA_HD_WALLPAPER_ON_V145_RELEASE_459_20261123' && github.event.head_commit.message != 'VERIFY_ADMIN_WORKSPACE_002_20261123' && github.event.head_commit.message != 'VERIFY_ADMIN_WORKSPACE_V147_FULL_20261123' && github.event.head_commit.message != 'RELEASE_ADMIN_WORKSPACE_V147_QA_ONLY_20261123' && github.event.head_commit.message != 'VERIFY_ADMIN_USAGE_LEDGER_001_20261123'
        shell: bash
