          fi
          if [[ "$VERIFY_MODE" == envelope ]]; then
            run_check envelope-node node --test tests/envelope-write-safety.test.mjs
            run_check envelope-build npm run build
            run_check envelope-browser-install npx playwright install --with-deps chromium
            run_check envelope-browser node tests/envelope-draft.browser.mjs
            exit 0
          fi
          if [[ "$VERIFY_MODE" == story ]]; then
            run_check story-node node --test tests/story-storage-trust.test.mjs
            run_check story-build npm run build
            run_check story-browser-install npx playwright install --with-deps chromium
            run_check story-browser node tests/story-save.browser.mjs
            exit 0
          fi
          if [[ "$VERIFY_MODE" == batch2 ]]; then
