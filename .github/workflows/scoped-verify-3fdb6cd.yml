name: Scoped candidate verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoped-verify-3fdb6cd.yml'

permissions:
  contents: read

concurrency:
  group: scoped-verify-3fdb6cd-${{ contains(github.event.head_commit.message, 'RELEASE') && 'qa-release' || startsWith(github.event.head_commit.message, 'VERIFY_LAYOUT_') && 'desktop-only' || 'shared' }}
  cancel-in-progress: false

jobs:
