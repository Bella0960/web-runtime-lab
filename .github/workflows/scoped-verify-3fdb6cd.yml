              assert.ok(base.dockSize>=2);
              const order=[...base.items];[order[1],order[2]]=[order[2],order[1]];
              const layout={v:14,pages:[order,[],[]],dock:['app_chat','app_shop'],removed:[]};
              await page.evaluate(v=>localStorage.setItem('ds_layout_v14',JSON.stringify(v)),layout);
