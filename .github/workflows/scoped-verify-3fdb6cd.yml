            run_check build npm run build
            run_check browser-install npx playwright install --with-deps chromium
            run_check browser node tests/cooking-interaction.browser.mjs
            exit 0
          fi
          run_check node npm run test:admin:cloud
          run_check delegated node --test tests/admin-cloud-delegated-authority.test.mjs
          run_check build npm run build
          run_check pwa npm run test:pwa:navigation
          run_check browsers npx playwright install --with-deps chromium webkit
          run_check chromium npm run test:admin:cloud:browser
          run_check webkit node tests/admin-cloud-ios-webkit.mjs
          run_check workerd node tests/admin-cloud-workerd.runtime.mjs
