                return {items,default:g.classList.contains('is-default-layout'),bodyWidth:document.body.scrollWidth,viewport:innerWidth,clip:getComputedStyle(document.documentElement).overflowX,rects:rects.map(r=>({left:r.left,right:r.right}))};
