name: Scoped candidate verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoped-verify-3fdb6cd.yml'

permissions:
  contents: read

concurrency:
  group: scoped-verify-3fdb6cd
  cancel-in-progress: false

jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Confirm restricted source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_REF" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event.head_commit.message == 'VERIFY_LAYOUT_STORAGE_R6_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R5_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R4_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_OVERFLOW_DIAG_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VIEWPORT_R2_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_MOBILE_DELEGATED_20261123' && '68259b97db882030b03f335e99788af62a4260e0' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_FINAL_20261123' && '2a3b789bc39ef9847b453d90a6a2ab7b1b57880a' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_COMPAT_20261123' && '1aa403d01f34e4415afbd11a64c6091e237b93d9' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_LOG_20261123' && 'ddeb061d5d38f3ab9743885ab2f9722d77ffac92' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_DIAG_20261123' && 'b32b13773b792964a5e839224f2b69c93fa4c438' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_20261123' && '1238b884509606ee291f3ad2db31ae83165a216c' || github.event.head_commit.message == 'VERIFY_LAYOUT_CORE_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_001_DEPLOY_GATES_20261123' && '08b61d81024c8c98e6c168f6512dfb2fc408d0bf' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_001_SCOPED_20261123' && '08b61d81024c8c98e6c168f6512dfb2fc408d0bf' || '3db5c6764d2daa12effd6bc0aa49a1ec16a91938' }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 100
      - name: Run all existing candidate gates with sealed logs
        if: github.event.head_commit.message != 'VERIFY_LAYOUT_VISIBLE_DRAG_R5_20261123' && github.event.head_commit.message != 'VERIFY_LAYOUT_STORAGE_R6_20261123'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.head_commit.message == 'VERIFY_LAYOUT_VISIBLE_DRAG_R4_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_OVERFLOW_DIAG_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_LAYOUT_VIEWPORT_R2_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_MOBILE_DELEGATED_20261123' && '68259b97db882030b03f335e99788af62a4260e0' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_FINAL_20261123' && '2a3b789bc39ef9847b453d90a6a2ab7b1b57880a' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_COMPAT_20261123' && '1aa403d01f34e4415afbd11a64c6091e237b93d9' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_LOG_20261123' && 'ddeb061d5d38f3ab9743885ab2f9722d77ffac92' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_DIAG_20261123' && 'b32b13773b792964a5e839224f2b69c93fa4c438' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_WORKERD_20261123' && '1238b884509606ee291f3ad2db31ae83165a216c' || github.event.head_commit.message == 'VERIFY_LAYOUT_CORE_20261123' && '8ff181c2afbf2d3c15130684fe7f196e6adb33f8' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_001_DEPLOY_GATES_20261123' && '08b61d81024c8c98e6c168f6512dfb2fc408d0bf' || github.event.head_commit.message == 'VERIFY_ADMIN_CLOUD_001_SCOPED_20261123' && '08b61d81024c8c98e6c168f6512dfb2fc408d0bf' || '3db5c6764d2daa12effd6bc0aa49a1ec16a91938' }}"
          test "$(git -C candidate rev-parse HEAD)" = "$expected"
          cd candidate
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_MOBILE_DELEGATED_20261123' ]]; then
            echo 'ADMIN_FINAL_MOBILE: pinned delegated and mobile-engine acceptance; local only'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-mobile-install.log" 2>&1 || { echo 'ADMIN_FINAL_MOBILE_FAIL npm-ci'; exit 1; }
            node --test tests/admin-cloud-delegated-authority.test.mjs >"$RUNNER_TEMP/admin-delegated.log" 2>&1 || {
              grep -E '^not ok [0-9]+|^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-delegated.log" | tail -n 13 | cut -c1-150 || true
              echo 'ADMIN_FINAL_MOBILE_FAIL delegated'
              exit 1
            }
            grep -E '^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-delegated.log" | tail -n 5 || true
            echo 'ADMIN_FINAL_MOBILE_PASS delegated'
            npm run build >"$RUNNER_TEMP/admin-mobile-build.log" 2>&1 || { echo 'ADMIN_FINAL_MOBILE_FAIL vite'; exit 1; }
            npx playwright install --with-deps chromium webkit >"$RUNNER_TEMP/admin-mobile-engine-install.log" 2>&1 || { echo 'ADMIN_FINAL_MOBILE_FAIL engine-install'; exit 1; }
            npm run test:admin:cloud:browser >"$RUNNER_TEMP/admin-android.log" 2>&1 || {
              grep -E '^FAIL |^[0-9]+/[0-9]+ browser checks' "$RUNNER_TEMP/admin-android.log" | tail -n 12 | cut -c1-150 || true
              echo 'ADMIN_FINAL_MOBILE_FAIL android-chromium'; exit 1;
            }
            grep -E '^ADMIN_BROWSER_ENGINE=|^[0-9]+/[0-9]+ browser checks' "$RUNNER_TEMP/admin-android.log" | tail -n 3 || true
            ADMIN_BROWSER_ENGINE=webkit npm run test:admin:cloud:browser >"$RUNNER_TEMP/admin-ios-webkit.log" 2>&1 || {
              grep -E '^FAIL |^[0-9]+/[0-9]+ browser checks' "$RUNNER_TEMP/admin-ios-webkit.log" | tail -n 12 | cut -c1-150 || true
              echo 'ADMIN_FINAL_MOBILE_FAIL iphone-webkit'; exit 1;
            }
            grep -E '^ADMIN_BROWSER_ENGINE=|^[0-9]+/[0-9]+ browser checks' "$RUNNER_TEMP/admin-ios-webkit.log" | tail -n 3 || true
            echo 'ADMIN_FINAL_MOBILE_PASS all synthetic delegated and browser-engine tests; no deploy'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_WORKERD_FINAL_20261123' ]]; then
            echo 'ADMIN_WORKERD_FINAL source SHA pinned; local sandbox only'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-final-install.log" 2>&1 || { echo 'ADMIN_FINAL_FAIL npm-ci'; exit 1; }
            npm run build >"$RUNNER_TEMP/admin-final-build.log" 2>&1 || { echo 'ADMIN_FINAL_FAIL vite'; exit 1; }
            node --check tests/admin-cloud-workerd.runtime.mjs || { echo 'ADMIN_FINAL_FAIL syntax'; exit 1; }
            node tests/admin-cloud-workerd.runtime.mjs >"$RUNNER_TEMP/admin-final-workerd.log" 2>&1 || {
              grep -E '^WORKERD_(START_CATEGORY|SANITIZED_LINE|ACCEPTANCE_FAIL|PASS)' "$RUNNER_TEMP/admin-final-workerd.log" | tail -n 14 | cut -c1-190 || true
              echo 'ADMIN_FINAL_FAIL workerd'
              exit 1
            }
            grep -E '^WORKERD_(PASS|ACCEPTANCE_PASS)' "$RUNNER_TEMP/admin-final-workerd.log" | tail -n 10 || true
            echo 'ADMIN_FINAL_PASS Workerd 4.166.0; no deployment'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_WORKERD_COMPAT_20261123' ]]; then
            echo 'ADMIN_WORKERD latest compatible runtime, no deployment'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-compat-npm.log" 2>&1 || { echo 'ADMIN_COMPAT_FAIL npm-ci'; exit 1; }
            npm run build >"$RUNNER_TEMP/admin-compat-vite.log" 2>&1 || { echo 'ADMIN_COMPAT_FAIL vite'; exit 1; }
            version="$(npm view wrangler version --json 2>/dev/null | tr -d '"')"
            echo "WORKERD_CLI_VERSION=$version"
            node tests/admin-cloud-workerd.runtime.mjs >"$RUNNER_TEMP/admin-compat-runtime.log" 2>&1 || {
              grep -E '^WORKERD_(START_CATEGORY|SANITIZED_LINE|PASS|ACCEPTANCE_FAIL)' "$RUNNER_TEMP/admin-compat-runtime.log" | tail -n 14 | cut -c1-220 || true
              echo 'ADMIN_COMPAT_FAIL workerd'
              exit 1
            }
            grep -E '^WORKERD_(PASS|ACCEPTANCE_PASS)' "$RUNNER_TEMP/admin-compat-runtime.log" | tail -n 14 || true
            echo 'ADMIN_COMPAT_PASS real local workerd; no deployment'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_WORKERD_LOG_20261123' ]]; then
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-workerd-install3.log" 2>&1 || { echo 'WORKERD_LOG npm-ci-failed'; exit 1; }
            npm run build >"$RUNNER_TEMP/admin-workerd-build3.log" 2>&1 || { echo 'WORKERD_LOG vite-failed'; exit 1; }
            node tests/admin-cloud-workerd.runtime.mjs >"$RUNNER_TEMP/admin-workerd-log3.log" 2>&1 || {
              grep -E '^WORKERD_(START_CATEGORY|SANITIZED_LINE|ACCEPTANCE_FAIL|PASS)' "$RUNNER_TEMP/admin-workerd-log3.log" | tail -n 12 | cut -c1-220 || true
              echo 'WORKERD_LOG local-workerd-failed'
              exit 1
            }
            grep -E '^WORKERD_(PASS|ACCEPTANCE_PASS)' "$RUNNER_TEMP/admin-workerd-log3.log" || true
            echo 'WORKERD_LOG workerd-acceptance-passed; no deploy'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_WORKERD_DIAG_20261123' ]]; then
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-diag-install.log" 2>&1 || { echo 'ADMIN_DIAG_FAIL npm-ci'; exit 1; }
            npm run build >"$RUNNER_TEMP/admin-diag-build.log" 2>&1 || { echo 'ADMIN_DIAG_FAIL vite-build'; exit 1; }
            node tests/admin-cloud-workerd.runtime.mjs >"$RUNNER_TEMP/admin-diag-runtime.log" 2>&1 || {
              grep -E '^WORKERD_(START_CATEGORY|ACCEPTANCE_FAIL|PASS)' "$RUNNER_TEMP/admin-diag-runtime.log" | tail -n 12 | cut -c1-185 || true
              echo 'ADMIN_DIAG_FAIL local-workerd'
              exit 1
            }
            grep -E '^WORKERD_(PASS|ACCEPTANCE_PASS)' "$RUNNER_TEMP/admin-diag-runtime.log" | tail -n 12 || true
            echo 'ADMIN_DIAG_PASS local Workerd acceptance'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_WORKERD_20261123' ]]; then
            echo 'ADMIN_WORKERD source pinned, synthetic local runtime; no deploy'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-workerd-install.log" 2>&1 || { echo 'ADMIN_WORKERD_FAIL npm-ci'; exit 1; }
            npm run build >"$RUNNER_TEMP/admin-workerd-build.log" 2>&1 || { echo 'ADMIN_WORKERD_FAIL vite-build'; exit 1; }
            node tests/admin-cloud-workerd.runtime.mjs >"$RUNNER_TEMP/admin-workerd-smoke.log" 2>&1 || {
              grep -E '^WORKERD_(PASS|ACCEPTANCE_FAIL|LOCAL_START_FAILED)' "$RUNNER_TEMP/admin-workerd-smoke.log" | tail -n 12 | cut -c1-180 || true
              echo 'ADMIN_WORKERD_FAIL runtime'
              exit 1
            }
            grep -E '^WORKERD_(PASS|ACCEPTANCE_PASS)' "$RUNNER_TEMP/admin-workerd-smoke.log" | tail -n 12 || true
            echo 'ADMIN_WORKERD_PASS local workerd + SQLite DO + auth; no deploy'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_CORE_20261123' || "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_VIEWPORT_R2_20261123' || "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_OVERFLOW_DIAG_20261123' ]]; then
            echo 'LAYOUT_QA pinned candidate; verify only'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/desk-install.log" 2>&1 || { echo 'LAYOUT_FAIL npm-ci'; exit 1; }
            if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_CORE_20261123' ]]; then
            node --test tests/default-desktop-layout.test.mjs >"$RUNNER_TEMP/desk-node.log" 2>&1 || {
              echo 'LAYOUT_FAIL node'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/desk-node.log" | tail -n 12 | cut -c1-135 || true
              exit 1
            }
            grep -E '^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/desk-node.log" | tail -n 4 || true
            echo 'LAYOUT_PASS node'
            else
              echo 'LAYOUT_REUSE prior Node 21/21 pass, run 45170447836'
            fi
            npm run build >"$RUNNER_TEMP/desk-vite.log" 2>&1 || { echo 'LAYOUT_FAIL vite'; exit 1; }
            echo 'LAYOUT_PASS vite'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/desk-chromium-install.log" 2>&1 || { echo 'LAYOUT_FAIL chromium-install'; exit 1; }
            if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_LAYOUT_CORE_20261123' ]]; then
            node tests/desktop-app-navigation.browser.mjs >"$RUNNER_TEMP/desk-browser-navigation.log" 2>&1 || { echo 'LAYOUT_FAIL navigation-browser'; exit 1; }
            echo 'LAYOUT_PASS navigation-browser'
            else
              echo 'LAYOUT_REUSE prior Chromium navigation pass, run 45170447836'
            fi
            set +e
            node --input-type=module >"$RUNNER_TEMP/desk-viewport.log" 2>&1 <<'DESKTOP_QA_SCRIPT'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import path from 'node:path';
          import {chromium} from 'playwright';
          const dist=path.resolve('dist');
          const server=createServer(async(req,res)=>{
            try{
              const name=new URL(req.url||'/','http://127.0.0.1').pathname;
              const file=path.resolve(dist,'.'+(name==='/'?'/index.html':name));
              if(!file.startsWith(dist+path.sep)){res.writeHead(403).end();return;}
              const data=await readFile(file);
              res.setHeader('Content-Type',({'.html':'text/html','.js':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.webp':'image/webp','.svg':'image/svg+xml','.woff2':'font/woff2'})[path.extname(file)]||'application/octet-stream');
              res.setHeader('Cache-Control','no-store');
              res.end(data);
            }catch{res.writeHead(404).end();}
          });
          await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(0,'127.0.0.1',resolve);});
          const browser=await chromium.launch({headless:true});
          let checkpoint='start';
          try{
            for(const [w,h] of [[375,667],[390,844],[430,932]]){
              checkpoint='context_'+w;console.log('VIEWPORT_CHECK context '+w);
              const ctx=await browser.newContext({viewport:{width:w,height:h},isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const page=await ctx.newPage();const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:'+server.address().port+'/index.html',{waitUntil:'load'});
              assert.equal(response?.status(),200);
              await page.locator('#gridPage0 [data-drag="clock-lg"]').waitFor({timeout:25000});
              checkpoint='base_'+w;
              const base=await page.evaluate(()=>{
                const g=document.getElementById('gridPage0');
                return {items:[...g.querySelectorAll(':scope > [data-drag]')].map(x=>x.dataset.drag),defaultLayout:g.classList.contains('is-default-layout'),docWidth:document.documentElement.scrollWidth,gridWidth:g.getBoundingClientRect().width,dockSize:document.querySelectorAll('#dockBar > [data-drag]').length};
              });
              console.log('VIEWPORT_CHECK base '+w+' count='+base.items.length+' default='+Number(base.defaultLayout)+' scroll='+base.docWidth+' grid='+Math.round(base.gridWidth)+' dock='+base.dockSize);
              const sizes=await page.evaluate(()=>{
                const entries=[
                  ['root',document.documentElement],['body',document.body],
                  ['stage',document.querySelector('.simulator-stage')],
                  ['frame',document.querySelector('.phone')],
                  ['screen',document.querySelector('.phone-screen')],
                  ['pages',document.querySelector('.pages-container')],
                  ['firstpage',document.querySelector('#gridPage0')?.closest('.home-page')],
                  ['firstgrid',document.querySelector('#gridPage0')],
                  ['dockwrap',document.querySelector('.dock-wrapper')],
                  ['dock',document.querySelector('#dockBar')]
                ];
                return entries.map(([label,node])=>{
                  if(!node)return {label,missing:true};
                  const b=node.getBoundingClientRect();
                  return {label,l:Math.round(b.left),r:Math.round(b.right),w:Math.round(b.width),client:node.clientWidth,scroll:node.scrollWidth};
                });
              });
              console.log('VIEWPORT_CHECK sizes '+w+' '+JSON.stringify(sizes));
              assert.equal(base.items.length,11);assert.equal(base.defaultLayout,true);
              assert.equal(new Set(base.items).size,base.items.length);
              assert.ok(base.gridWidth>0&&base.gridWidth<=w);
              assert.ok(base.docWidth<=w+3,'horizontal overflow');
              assert.ok(base.dockSize>=2);
              const order=[...base.items];[order[1],order[2]]=[order[2],order[1]];
              const layout={v:14,pages:[order,[],[]],dock:['app_chat','app_shop'],removed:[]};
              await page.evaluate(v=>localStorage.setItem('ds_layout_v14',JSON.stringify(v)),layout);
              checkpoint='reload_'+w;console.log('VIEWPORT_CHECK reload '+w);
              await page.reload({waitUntil:'load'});
              await page.waitForFunction(()=>document.getElementById('gridPage0')?.firstElementChild?.dataset.drag==='clock-lg');
              const after=await page.evaluate(()=>{
                const g=document.getElementById('gridPage0');
                return {items:[...g.querySelectorAll(':scope > [data-drag]')].map(x=>x.dataset.drag),defaultLayout:g.classList.contains('is-default-layout'),stored:JSON.parse(localStorage.getItem('ds_layout_v14'))};
              });
              checkpoint='after_'+w;
              console.log('VIEWPORT_CHECK after '+w+' default='+Number(after.defaultLayout)+' storedPages='+after.stored.pages.length);
              assert.deepEqual(after.items.slice(0,3),order.slice(0,3));
              assert.equal(after.defaultLayout,false);
              assert.deepEqual(after.stored.pages[0],order);
              assert.deepEqual(errors,[]);
              await page.screenshot({path:process.env.RUNNER_TEMP+'/desk-'+w+'.png'});
              console.log('VIEWPORT_PASS '+w+'x'+h);
              await ctx.close();
            }
          }catch(e){console.log('VIEWPORT_CHECK failure checkpoint='+checkpoint+' kind='+String(e.name||'Error').replace(/[^a-zA-Z]/g,''));throw e;}
          finally{await browser.close();await new Promise(resolve=>server.close(resolve));}
          DESKTOP_QA_SCRIPT
            viewport_exit=$?
            set -e
            grep -E '^VIEWPORT_(CHECK|PASS) ' "$RUNNER_TEMP/desk-viewport.log" | tail -n 25 | cut -c1-170 || true
            if [[ "$viewport_exit" -ne 0 ]]; then
              echo 'LAYOUT_FAIL viewport-persistence; exact reason in sealed runner log'
              exit 1
            fi
            echo 'LAYOUT_PASS viewports 375 390 430 and persistent custom order; no deploy'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_001_DEPLOY_GATES_20261123' ]]; then
            echo 'ADMIN-CLOUD-001 deploy safety gates; no deployment'
            node scripts/verify-production-worker-source.mjs >"$RUNNER_TEMP/admin-prod-gate.log" 2>&1 || { echo 'FAIL production-worker-source'; exit 1; }
            echo 'PASS production-worker-source'
            node scripts/verify-app-worker-static.mjs >"$RUNNER_TEMP/admin-static-gate.log" 2>&1 || { echo 'FAIL app-worker-static'; exit 1; }
            echo 'PASS app-worker-static'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_ADMIN_CLOUD_001_SCOPED_20261123' ]]; then
            echo 'ADMIN-CLOUD-001 SOURCE_SHA_VERIFIED, test-only'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/admin-ci.log" 2>&1 || { echo 'ADMIN_FAIL npm-ci'; exit 1; }
            npm run test:admin:cloud >"$RUNNER_TEMP/admin-node.log" 2>&1 || {
              echo 'ADMIN_FAIL node-test'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-node.log" | head -n 40 | cut -c1-180 || true
              exit 1
            }
            grep -E '^# (tests|pass|fail|skipped) [0-9]+' "$RUNNER_TEMP/admin-node.log" | tail -n 5 || true
            echo 'ADMIN_PASS node-test'
            npm run build >"$RUNNER_TEMP/admin-vite.log" 2>&1 || { echo 'ADMIN_FAIL vite-build'; exit 1; }
            test -f dist/admin/cloud.html && test -f dist/admin/js/cloud-admin.js && test -f dist/admin/js/cloud-admin-core.js && test -f dist/admin/css/cloud-admin.css || { echo 'ADMIN_FAIL assets'; exit 1; }
            node --input-type=module -e '
              import fs from "node:fs";
              const list=JSON.parse(fs.readFileSync("dist/pwa-pages.json","utf8"));
