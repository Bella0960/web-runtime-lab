  main-feature-verification:
    if: github.actor == github.repository_owner && (github.event.head_commit.message == 'VERIFY_ADMIN_MAIN_482_20261124' || github.event.head_commit.message == 'VERIFY_CAFE_ARCHIVE_MAIN_427_R2_20261124' || github.event.head_commit.message == 'VERIFY_ENVELOPE_MAIN_460_20261124' || github.event.head_commit.message == 'VERIFY_STORY_MAIN_450_20261124' || github.event.head_commit.message == 'VERIFY_KITCHEN_MAIN_432_20261124')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/public-content-check.mjs
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          ref: ${{ github.event.head_commit.message == 'VERIFY_KITCHEN_MAIN_432_20261124' && 'f9585588f48b264e177c2c336dbbcbd003921f27' || github.event.head_commit.message == 'VERIFY_STORY_MAIN_450_20261124' && 'f765548ea50032891ab9f98c5b940565ddb610aa' || github.event.head_commit.message == 'VERIFY_ENVELOPE_MAIN_460_20261124' && '57e177a6b7a53671523f7b1fe0956ad4fcbb3ab4' || github.event.head_commit.message == 'VERIFY_CAFE_ARCHIVE_MAIN_427_R2_20261124' && '0b8e7250e0f111e4c5dbc68679094b28988dc365' || '99e505e2b93002209cfa6a335c328e33da0be3b1' }}
          path: candidate
          persist-credentials: false
      - name: Verify fixed source in isolation
        env:
          VERIFY_MODE: ${{ github.event.head_commit.message == 'VERIFY_KITCHEN_MAIN_432_20261124' && 'batch2' || github.event.head_commit.message == 'VERIFY_STORY_MAIN_450_20261124' && 'story' || github.event.head_commit.message == 'VERIFY_ENVELOPE_MAIN_460_20261124' && 'envelope' || github.event.head_commit.message == 'VERIFY_CAFE_ARCHIVE_MAIN_427_R2_20261124' && 'cafe' || 'admin' }}
          EXPECTED_REF: ${{ github.event.head_commit.message == 'VERIFY_KITCHEN_MAIN_432_20261124' && 'f9585588f48b264e177c2c336dbbcbd003921f27' || github.event.head_commit.message == 'VERIFY_STORY_MAIN_450_20261124' && 'f765548ea50032891ab9f98c5b940565ddb610aa' || github.event.head_commit.message == 'VERIFY_ENVELOPE_MAIN_460_20261124' && '57e177a6b7a53671523f7b1fe0956ad4fcbb3ab4' || github.event.head_commit.message == 'VERIFY_CAFE_ARCHIVE_MAIN_427_R2_20261124' && '0b8e7250e0f111e4c5dbc68679094b28988dc365' || '99e505e2b93002209cfa6a335c328e33da0be3b1' }}
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local label="$1"
            shift
            "$@" >"$RUNNER_TEMP/main-admin-$label.log" 2>&1 || { echo "FAIL $label"; return 1; }
            echo "PASS $label"
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_REF"
          run_check install npm ci --no-audit --no-fund
          if [[ "$VERIFY_MODE" == cafe ]]; then
            run_check cafe-node node --test tests/cafe-app-contract.test.mjs tests/cafe-archive-entry.test.mjs tests/cafe-growth-claim.test.mjs
            run_check cafe-build npm run build
