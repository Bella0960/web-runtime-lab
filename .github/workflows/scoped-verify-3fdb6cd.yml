                ' fixed='+Number(restored.fixed)+' savedLen='+restored.saved.pages[0].length+
                ' savedMatch='+Number(JSON.stringify(restored.saved.pages[0])===JSON.stringify(order)));
              assert.deepEqual(restored.ids.slice(0,3),order.slice(0,3));
