name: One-time welcome SW v267 corrected contract QA release
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-welcome-sw-v267-final-20261120.yml]
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'dc7c079919d66b15569d232b508ab4757e4ebc53' && github.event.head_commit.message == 'ci: guarded welcome SW v267 final QA-only 20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Public-source guard
        run: npm run check:public
      - name: Verify original restricted QA-only access
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then exit 1; fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Pin QA SHA and enforce only SW plus version contract test changed
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'dede754746cb879eef627f01cb62e946fcf17d31'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git status --porcelain)"
          files="$(git diff --name-only 'c493f53b82aaad16b36e8dc9be5b251b1eb388be' HEAD)"
          test "$files" = "$(printf 'sw.js\ntests/npc-qa-integration.test.mjs')"
          echo 'QA source pinned; only SW strategy and one test assertion changed.'
      - name: Build and test network/offline, PWA, NPC version and isolated receipt suite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/sw-v267-final-focused.log"
          trap 'rm -f "$log"' EXIT
          if (cd candidate && npm ci --no-audit --no-fund && npm run build &&
            node --test tests/sw-navigation-cache-lifecycle.test.mjs tests/pwa-navigation-cache.test.mjs tests/push-real-empty-mode.test.mjs tests/npc-qa-integration.test.mjs tests/group-game-chat-receipts.test.mjs) > "$log" 2>&1; then
            echo 'Vite full build, welcome SW, PWA, push and corrected version contract PASS'
          else
            echo 'Focused regression FAILED; private logs withheld'
            sed -n 's/^not ok \([0-9][0-9]*\).*/failed case \1/p' "$log" | tail -12 || true
            exit 1
          fi
      - name: Original complete private Node Vite Chromium and QA-only release gates
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
