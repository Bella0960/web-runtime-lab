name: One-time sealed direct role response validation
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-direct-role-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'd14befc6cc783ad3a6de80051063b094dbad1938' && github.event.head_commit.message == 'ci: sealed verify direct role identity response gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public source isolation
        run: npm run check:public
      - name: Check existing restricted candidate credentials
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO"
          test -n "$SOURCE_REF"
          test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPO"
          echo "::add-mask::${SOURCE_REPO##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require unchanged original QA branch and verified source revision
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '353c89ec053cb02f378892351370c66d327dc03e'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Run original full private Node Vite Chromium release gates without deploying
        run: node scripts/run-candidate.mjs verify
