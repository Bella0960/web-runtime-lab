name: Isolated memory cleanup verification
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-memory-cleanup-verify.yml]
permissions:
  contents: read
concurrency:
  group: sealed-memory-verification
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'd0e3668e387348bbf7005a1609cfedc2e3636024' && github.event.head_commit.message == 'ci: diagnose isolated memory layout assertions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/public-content-check.mjs
      - name: Checkout restricted candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          ref: 'ad5ab0a0187ef70d20c3ebcc605409be0bfd3d87'
          path: candidate
          persist-credentials: false
      - name: Verify exact checkout and run sealed regression
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ad5ab0a0187ef70d20c3ebcc605409be0bfd3d87'
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          run() {
            local stage="$1"
            shift
            if "$@" >"$log" 2>&1; then
              echo "$stage passed"
            else
              if [[ "$stage" == Memory-Chromium ]]; then
                grep -E '^[[:space:]+-]*(searchHeight|searchFont|alignment|actionFonts|gap|leftBorders|bodyFont|timeColor):[ 0-9,().\[\]a-z\x27"-]* in the restricted candidate"
              exit 1
            fi
          }
          run Install npm ci
          run Vite npm run build
          run Chromium-install npx playwright install --with-deps chromium
          run Memory-storage node --test tests/memory-space-cleanup.test.mjs
          run Memory-Chromium node --test tests/memory-space-cleanup.browser.test.mjs
 "$log" || true
                grep -oE 'memory-space-cleanup\.browser\.test\.mjs:[0-9]+:[0-9]+' "$log" | sort -u || true
              fi
              echo "::error::$stage failed in the restricted candidate"
              exit 1
            fi
          }
          run Install npm ci
          run Vite npm run build
          run Chromium-install npx playwright install --with-deps chromium
          run Memory-storage node --test tests/memory-space-cleanup.test.mjs
          run Memory-Chromium node --test tests/memory-space-cleanup.browser.test.mjs
          run Full-Node node --test --test-concurrency=1
