name: One-time QA identity reconnect repaired full gate
on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-qa-identity-reconnect-verified-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'd1a8661571d9c15803654a3561e6692a2db4c541' && github.event.head_commit.message == 'ci: sealed QA identity reconnect repaired full gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout original public safety runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public source isolation
        run: npm run check:public
      - name: Verify sealed original candidate access
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Restricted QA source unavailable'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout original QA branch without exposing source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Enforce exact QA revision for repaired identity probe
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e4cdcbbaf02e0e253f081bd5c1e34e3f10297d79'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Full original private Node Vite Chromium and security gates
        run: node scripts/run-candidate.mjs verify
