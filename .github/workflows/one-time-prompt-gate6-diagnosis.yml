name: One-time gate6 chat-contract diagnostics

on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-prompt-gate6-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '366def459ca602023912e5a50491b4040c772c9c' && github.event.head_commit.message == 'ci: isolate gate6 chat contract without exposing private tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only private candidate checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
          fetch-depth: 1
      - name: Run only original chat gate and classify test file slots
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          umask 077
          cd candidate
          npm ci --no-audit --no-fund > "${RUNNER_TEMP}/prompt-deps.log" 2>&1
          if [ "$?" -ne 0 ]; then echo 'deps: FAIL'; exit 1; fi
          echo 'deps: PASS'
          files=(
            chat-regression-contract.test.mjs
            chat-role-sticker-library.test.mjs
            role-avatar-library.test.mjs
            chat-image-vision.test.mjs
            role-gallery-image-autonomy.test.mjs
            chat-fanwai.test.mjs
            chat-fanwai-ui.test.mjs
            chat-fanwai-extension.test.mjs
            phone-api-abort.test.mjs
            chat-history-corruption-guard.test.mjs
            chat-phone-storage-primary-guard.test.mjs
            chat-forward-media-rollback.test.mjs
          )
          failed=0
          for index in "${!files[@]}"; do
            slot=$((index+1))
            file="tests/${files[index]}"
            node --test "$file" > "${RUNNER_TEMP}/prompt-check-${slot}.log" 2>&1
            result=$?
            if [ "$result" -eq 0 ]; then
              echo "slot-${slot}: PASS"
            else
              failed=1
              echo "slot-${slot}: FAIL"
              grep -E "^not ok [0-9]+ " "${RUNNER_TEMP}/prompt-check-${slot}.log" | sed -E "s/^not ok ([0-9]+) .*/slot-${slot}-case-\1/" || true
            fi
            rm -f "${RUNNER_TEMP}/prompt-check-${slot}.log"
          done
          rm -f "${RUNNER_TEMP}/prompt-deps.log"
          if [ "$failed" -ne 0 ]; then exit 1; fi
