name: Pinned QA-only luck scroll CSS guarded retry 338
on:
  push:
    branches: [main]
    paths: ['.github/workflows/luck-scroll-338-release-retry.yml']
permissions:
  contents: read
concurrency:
  group: qa-only-release-gate
  cancel-in-progress: false
jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact parent and public scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e8eef008558777ace4fe577cf7676a49ad3fd588'
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = '.github/workflows/luck-scroll-338-release-retry.yml'
          node scripts/public-content-check.mjs
      - name: Verify restricted QA-only credentials
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          DEPLOY: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_TOKEN"
          test -n "$ACCOUNT" && test -n "$DEPLOY"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
      - name: Checkout original private QA integration branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: integration/account-fanwai-stack-20261115
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          persist-credentials: true
          fetch-depth: 100
          path: candidate
      - name: Immutable SHA and all protected QA release gates
        shell: bash
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '58b028fe8bee19f660294a889670d08108d559f5'
          node scripts/run-candidate.mjs release
