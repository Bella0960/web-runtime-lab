name: One-time QA group header release

on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-qa-group-header.yml

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'fdb4768f107902ea541bdf404edb0bb113b367bf' && github.event.head_commit.message == 'ci: one-time authorized QA group header fix release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout approved public release guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source safety checks
        run: npm run check:public
      - name: Verify existing QA-only source and deployment authorization
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Restricted source or QA deployment authorization missing.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
          echo 'Existing QA-only authorization checked.'
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Lock exact approved candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a1d60bd9da1e9a5a40b33d43e623ba9847913c1c'
          echo 'Approved candidate snapshot confirmed.'
      - name: Complete gated QA-only tests and deployment
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
