name: Single-run Node regression triage

on:
  push:
    branches:
      - qa-candidate

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'ed97e3a2f4ead51636c67256621476baca938ec1' && github.event.head_commit.message == 'ci: single-run Node regression triage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout public diagnostics
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public content guard
        run: npm run check:public
      - name: Confirm existing read-only source access
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo "Read-only source authorization unavailable."
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout disposable private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 4
      - name: Diagnose Node regression without publishing source logs
        run: node scripts/node-oneoff-triage.mjs
