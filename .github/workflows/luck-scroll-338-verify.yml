name: Pinned luck room CSS mobile regression 338
on:
  push:
    branches: [main]
    paths: ['.github/workflows/luck-scroll-338-verify.yml']
permissions:
  contents: read
concurrency:
  group: luck-scroll-338-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact public change guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'edd30a423bb223130fcb4698531a32f0724bd65a'
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = '.github/workflows/luck-scroll-338-verify.yml'
          node scripts/public-content-check.mjs
      - name: Restricted candidate settings
        shell: bash
        env:
          REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO" && test -n "$TOKEN"
          echo "::add-mask::$REPO"
          echo "::add-mask::${REPO##*/}"
      - name: Checkout private fixed SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: fc12d0531aad034428f7cc10ebbf9e23ef1a7151
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Node, Vite, Chromium and mobile CSS scroll gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'fc12d0531aad034428f7cc10ebbf9e23ef1a7151'
          cd candidate
          grep -qF 'overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none' luck-room/css/luck-room.css
          grep -qF '.luck-app::-webkit-scrollbar{display:none}' luck-room/css/luck-room.css
          echo 'STAGE 1: install'
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/luck-css-install.log" 2>&1 || { echo 'FAILED stage 1'; exit 1; }
          echo 'STAGE 2: Node contract'
          node --test tests/luck-room-contract.test.mjs >"$RUNNER_TEMP/luck-css-node.log" 2>&1 || { echo 'FAILED stage 2'; exit 1; }
          echo 'STAGE 3: Vite build'
          npm run build >"$RUNNER_TEMP/luck-css-build.log" 2>&1 || { echo 'FAILED stage 3'; exit 1; }
          test -f dist/luck-room/css/luck-room.css
          echo 'STAGE 4: Chromium dependencies'
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/luck-css-chromium.log" 2>&1 || { echo 'FAILED stage 4'; exit 1; }
          echo 'STAGE 5: browser tests and mobile widths'
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/luck-css-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          LUCK_ROOM_BASE_URL=http://127.0.0.1:4173 node tests/luck-room-browser.mjs >"$RUNNER_TEMP/luck-css-browser.log" 2>&1 || { echo 'FAILED stage 5 existing browser'; exit 1; }
          node --input-type=module >"$RUNNER_TEMP/luck-css-scroll.log" 2>&1 <<'JS' || { echo 'FAILED stage 5 mobile scroll'; exit 1; }
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          try {
            for (const width of [375,390,430]) {
              const page = await browser.newPage({viewport:{width,height:812},isMobile:true,hasTouch:true});
              try {
                await page.goto('http://127.0.0.1:4173/luck-room/luck-room.html', {waitUntil:'networkidle'});
                const result = await page.locator('.luck-app').evaluate(node => {
                  const style = getComputedStyle(node);
                  node.scrollTop = 200;
                  return {overflow:style.overflowY,scrollbar:style.scrollbarWidth,top:node.scrollTop,height:node.clientHeight,content:node.scrollHeight};
                });
                if(result.overflow !== 'auto' || result.scrollbar !== 'none' || result.top < 50 || result.content <= result.height) throw Error('scroll container check failed for '+width);
              } finally {await page.close();}
            }
          } finally {await browser.close();}
          JS
          echo 'CSS ONLY: Node, Vite, Chromium and 375/390/430 viewport scroll PASS'
