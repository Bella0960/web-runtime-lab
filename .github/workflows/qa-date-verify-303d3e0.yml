name: MAOMAO offline reply parser pinned QA verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-date-verify-303d3e0.yml'

permissions:
  contents: read

concurrency:
  group: maomao-qa-date-verify-303d3e0
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'Bella0960/web-runtime-lab' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Confirm restricted source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_REF" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Pin candidate to approved PR 299 commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '303d3e025ede6b5bd068459a00047b55424457f7'
          test "$(git -C candidate branch --show-current)" = 'integration/account-fanwai-stack-20261115'
      - name: Execute complete private QA gates (sealed logs)
        run: node scripts/run-candidate.mjs verify
