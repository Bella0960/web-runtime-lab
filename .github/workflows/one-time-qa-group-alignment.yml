name: One-time QA group alignment and persona release

on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-qa-group-alignment.yml

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '9711c21807f57f7ccd9dbec1b7084be8f9c4e4ec' && github.event.head_commit.message == 'ci: one-time authorized QA group alignment and persona fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout approved public release guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source safety checks
        run: npm run check:public
      - name: Verify existing source and QA-only deployment authorization
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Restricted source or QA deployment authorization missing.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
          echo 'Existing QA-only authorization checked.'
      - name: Checkout isolated QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Lock approved QA candidate snapshot
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '3cf70954ea48f8c1e61efbb1fc5cf6bf2bd869b0'
          echo 'QA-only source snapshot verified.'
      - name: Run original complete gated QA-only tests and publish
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
