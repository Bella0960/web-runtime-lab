name: One-time read-only QA origin receipt check
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-origin-receipt-check-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-receipt-check
  cancel-in-progress: false
jobs:
  check_origin:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '9ba4657d6fb378a35e605ceb22df3547cdd80ad5' && github.event.head_commit.message == 'ci: read-only QA origin receipt post-release check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep public guard intact
        run: npm run check:public
      - name: Confirm restricted source configuration
        shell: bash
        env:
          SRC_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          SRC_REF: ${{ secrets.CANDIDATE_REF }}
          SRC_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SRC_REPO"
          test -n "$SRC_REF"
          test -n "$SRC_TOKEN"
          echo "::add-mask::$SRC_REPO"
          echo "::add-mask::${SRC_REPO##*/}"
          echo "::add-mask::$SRC_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact deployed source and public origin without exposing content
        env:
          EXPECTED_COMMIT: 'd6664ea8212fc4a44277939b47f1e3599597bec0'
        run: |
          node --input-type=module <<'EOF'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const expected=process.env.EXPECTED_COMMIT;
          const checked=execFileSync('git',['-C','candidate','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(checked!==expected)throw new Error('Candidate changed; refusing stale receipt check');
          const source=readFileSync('candidate/scripts/qa-direct-release.mjs','utf8');
          const owner=source.match(/const url = '([^']+)' \+ expectedCommit;/);
          const direct=source.match(/const origin = '([^']+)'/);
          if(!owner||!direct)throw new Error('Original QA origin contracts unavailable');
          const endpoints=[
            {kind:'owner-origin',url:owner[1]+expected},
            {kind:'direct-QA-worker',url:direct[1]+'/qa-build-receipt.json?commit='+expected}
          ];
          let successful=true;
          for(const item of endpoints){
            let status=0,matches=false,json=false;
            try {
              const response=await fetch(item.url,{cache:'no-store',redirect:'manual',headers:{accept:'application/json'},signal:AbortSignal.timeout(15000)});
              status=response.status;
              if(status===200){
                const payload=await response.json().catch(()=>null);
                json=!!payload&&typeof payload==='object';
                matches=payload?.sourceCommit===expected;
              }
            }catch(_){}
            console.log(item.kind+' receipt: status='+status+' json='+json+' sha-match='+matches);
            if(!matches)successful=false;
          }
          if(!successful)process.exitCode=1;
          EOF
