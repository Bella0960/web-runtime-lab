name: Candidate verification (manual)

# Public QA changes must not automatically start another build.
# Use the existing sealed-candidate workflow for guarded source verification/release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public content guard
        run: npm run check:public
      - name: Targeted tests
        run: npm test
      - name: Build artifact locally for verification
        run: npm run build
      - name: Verify build integrity
        run: npm run test:bundle
