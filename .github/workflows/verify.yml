name: Candidate verification

on:
  workflow_dispatch:
  push:
    branches:
      - qa-candidate

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted tests
        run: npm test
      - name: Build artifact
        run: npm run build
      - name: Verify build integrity
        run: npm run test:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 2
