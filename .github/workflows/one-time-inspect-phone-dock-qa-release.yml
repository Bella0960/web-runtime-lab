name: Guarded isolated QA-only release
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-inspect-phone-dock-qa-release.yml
permissions:
  contents: write
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      github.actor == github.repository_owner && github.event.before == '166cad660fd6cd4e58ba1c04acba22a63deda0e9' && github.event.head_commit.message == 'ci: retry scoped candidate release with receipt'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public repository privacy
        run: node scripts/public-content-check.mjs
      - name: Verify restricted source and scoped QA authorization
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Restricted QA-only authorization unavailable.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout existing private QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact merged QA commit and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '1d85dae038a6d9781e6865991d7d1b16ec0ec6fd'
          test "$(git -C candidate branch --show-current)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git -C candidate status --porcelain)"
          echo 'Exact approved QA candidate verified.'
      - name: Run original complete private regression and QA Worker-only release
        id: release
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/run-candidate.mjs release 2>&1 | tee "$RUNNER_TEMP/summary.log"
      - name: Record generic QA release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const path = process.env.RUNNER_TEMP + '/summary.log';
          const log = existsSync(path) ? readFileSync(path,'utf8') : '';
          const match = log.match(/Candidate validation stopped at ([a-z0-9_-]+)/);
          const stage = match ? match[1] : process.env.RELEASE_RESULT === 'success' ? 'complete' : 'preflight';
          const payload = {
            run_id: process.env.RUN_ID,
            phase: 'qa-release',
            result: process.env.RELEASE_RESULT === 'success' ? 'pass' : 'fail',
            stage
          };
          const url = 'https://api.github.com/repos/' + process.env.GH_REPOSITORY + '/contents/ci-status/surface-release.json';
          const headers = {
            Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          };
          const prev = await fetch(url + '?ref=qa-candidate', {headers});
          const sha = prev.ok ? (await prev.json()).sha : undefined;
          const result = await fetch(url, {method:'PUT',headers,body:JSON.stringify({
            message:'ci: record generic QA release result', branch:'qa-candidate',
            content:Buffer.from(JSON.stringify(payload)+'\n').toString('base64'),
            ...(sha?{sha}:{})
          })});
          if (!result.ok) throw new Error('Generic receipt update failed: HTTP '+result.status);
          console.log('Generic release result recorded.');
          NODE
