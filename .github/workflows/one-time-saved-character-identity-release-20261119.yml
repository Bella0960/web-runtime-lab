name: One-time verified character identity original QA-only release
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-saved-character-identity-release-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '26d95c824443c8f9e74c9c98d0556f3da3c189b2' && github.event.head_commit.message == 'ci: deploy verified character identity fix to original QA only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public source isolation
        run: npm run check:public
      - name: Verify existing QA-only restricted authorization
        env:
          SOURCE_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPO" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Scoped QA-only deployment authorization unavailable'; exit 1
          fi
          echo "::add-mask::$SOURCE_REPO"
          echo "::add-mask::${SOURCE_REPO##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact fully verified original QA source commit and branch
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '82befda4afb717c29914f8f487ea4b4678c246cf'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Repeat all full Node Vite Chromium and safety gates then publish QA Worker only
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
