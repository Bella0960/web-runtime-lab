name: One-time QA direct role identity regression release

on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-qa-direct-role-fix.yml

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '31ed782526843420feab844ca48fa7876a824a9b' && github.event.head_commit.message == 'ci: approved one-time QA direct role identity regression release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout approved public release guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata safety checks
        run: npm run check:public
      - name: Confirm configured isolated QA-only credentials
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'QA-only authorization missing.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
          echo 'QA-only authorization confirmed.'
      - name: Checkout private QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Lock exact approved QA source snapshot
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ec5d628f164cec9c4ccd09dd0ef3cb439f581a8d'
          echo 'QA candidate snapshot locked.'
      - name: Run existing full validation and QA-only deployment
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
