name: Read-only QA route cache live audit
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-route-live-audit.yml]
permissions:
  contents: write
concurrency:
  group: route-audit
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.actor == github.repository_owner &&
      github.event.before == '66c4722f0f78ac1e078351f18db1dfc17d310680' &&
      github.event.head_commit.message == 'ci: inspect deployed route cache live'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Public privacy guard
        run: npm run check:public
      - name: Inspect read-only QA routes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const part=String.fromCharCode(109,97,111);
          const origin='https://preview.'+part+'520.com';
          const paths=[
            '/qa-build-receipt.json?route-audit=1',
            '/sw.js?v=route-audit-20261121',
            '/account/index.html',
            '/account/account.css?v=20261121-login-recovery1',
            '/account/ivory-entry.css?v=20261121-login-recovery1',
            '/assets/ivory-'+part+'/hero.webp?v=20261121-login-recovery1',
            '/account/account.js?v=20261121-login-recovery1',
            '/api/admin/bootstrap/status',
            '/chat/chat/chat-detail.html'
          ];
          const checks=[];
          for(let i=0;i<paths.length;i++){
            try{
              const response=await fetch(origin+paths[i],{
                cache:'no-store',redirect:'manual',signal:AbortSignal.timeout(16000)
              });
              const content=await response.text();
              const result={index:i,status:response.status,
                bytes:new TextEncoder().encode(content).byteLength,
                mime:String(response.headers.get('content-type')||'').split(';')[0],
                noStore:/no-store/i.test(response.headers.get('cache-control')||'')};
              if(i===0){
                try{result.sourceMatches=JSON.parse(content).sourceCommit==='00e52d51282ae9126b49696247ed0b3fe24d6d47';}
                catch{result.sourceMatches=false;}
              }
              if(i===1){
                result.version283=/const CACHE_NAME = 'phone-app-pwa-v283'/.test(content);
                result.noPrivateLoginCache=!content.includes('return cacheablePublicResponse(cachedEntry)');
              }
              if(i===7){
                try{
                  const json=JSON.parse(content);
                  result.identityReady=json.ok===true&&json.identityMode==='delegated'&&
                    json.identityAuthorityConnected===true&&json.signInReady===true;
                }catch{result.identityReady=false;}
              }
              if(i===8){
                const location=response.headers.get('location')||'';
                result.privateRouteGated=response.status===302&&location.includes('/account/index.html');
              }
              checks.push(result);
            }catch(e){checks.push({index:i,error:e.name==='TimeoutError'?'timeout':'network'});}
          }
          writeFileSync(process.env.RUNNER_TEMP+'/route-live.json',JSON.stringify({checks})+'\n');
          NODE
      - name: Save generic read-only audit receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const f=process.env.RUNNER_TEMP+'/route-live.json';
          const checks=existsSync(f)?JSON.parse(readFileSync(f,'utf8')).checks:[];
          const payload={run_id:process.env.RUN_ID,checks};
          const url='https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/contents/ci-status/route-live-audit.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,
            Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'};
          const prev=await fetch(url+'?ref=qa-candidate',{headers});
          const sha=prev.ok?(await prev.json()).sha:undefined;
          const response=await fetch(url,{method:'PUT',headers,body:JSON.stringify({
            message:'ci: record read-only QA route audit',branch:'qa-candidate',
            content:Buffer.from(JSON.stringify(payload)+'\n').toString('base64'),...(sha?{sha}:{})
          })});
          if(!response.ok)throw Error('Failed to record anonymous live audit');
          NODE