name: Sealed candidate verification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify only, or publish the approved isolated QA build'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - release
      candidate:
        description: 'Sealed baseline or approved single-chat QA candidate'
        type: choice
        required: true
        default: sealed
        options:
          - sealed
          - chat-p0-375
      confirmation:
        description: 'For release only: enter qa-only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # No private deployment credentials enter an unapproved verify-only run.
    if: >-
      ${{ (inputs.candidate == 'sealed' || (inputs.candidate == 'chat-p0-375' && github.actor == github.repository_owner)) && (inputs.operation == 'verify' || (inputs.operation == 'release' && github.actor == github.repository_owner && inputs.confirmation == 'qa-only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Verify restricted configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Missing restricted source configuration.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Verify approved single-chat candidate SHA
        if: ${{ inputs.candidate == 'chat-p0-375' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='40c39d1cc9cd42aed7c0acc53ad07ad17eacf9a5'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Approved QA candidate changed; refuse unverified source.'
            exit 1
          fi
      - name: Run private validation without public logs
        env:
          CANDIDATE_RELEASE_ACK: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.operation == 'release' && secrets.CANDIDATE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'release' && secrets.CANDIDATE_DEPLOY_TOKEN || '' }}
        run: node scripts/run-candidate.mjs "${{ inputs.operation }}"
