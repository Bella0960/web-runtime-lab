name: Sealed candidate verification

on:
  # Existing sealed workflow: owner pushes to this file automatically verify
  # the approved pinned QA snapshot. No deploy secrets enter push verification.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sealed-candidate.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify only, or publish the approved isolated QA build'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - release
      candidate:
        description: 'Sealed baseline, single-chat QA, or first-batch QA candidate'
        type: choice
        required: true
        default: sealed
        options:
          - sealed
          - chat-p0-375
          - batch1-p0-376
      confirmation:
        description: 'For release only: enter qa-only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # No private deployment credentials enter an unapproved verify-only run.
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'workflow_dispatch' && (inputs.candidate == 'sealed' || ((inputs.candidate == 'chat-p0-375' || inputs.candidate == 'batch1-p0-376') && github.actor == github.repository_owner)) && (inputs.operation == 'verify' || (inputs.operation == 'release' && github.actor == github.repository_owner && inputs.confirmation == 'qa-only'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Verify restricted configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ github.event_name == 'push' && 'integration/qa-batch1-376' || inputs.candidate == 'batch1-p0-376' && 'integration/qa-batch1-376' || inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          OPERATION: ${{ github.event_name == 'push' && 'verify' || inputs.operation }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Missing restricted source configuration.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event_name == 'push' && 'integration/qa-batch1-376' || inputs.candidate == 'batch1-p0-376' && 'integration/qa-batch1-376' || inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Verify approved single-chat candidate SHA
        if: ${{ inputs.candidate == 'chat-p0-375' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='ecda24302f2e7ccb4c15b9ffc1194949de1434a7'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Approved QA candidate changed; refuse unverified source.'
            exit 1
          fi
      - name: Verify approved batch1 QA candidate SHA
        if: ${{ github.event_name == 'push' || inputs.candidate == 'batch1-p0-376' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='72a2b57769c9543e8c033636b9dabe81d0ac4a7c'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Batch1 candidate ref changed; refuse unverified source.'
            exit 1
          fi
      # The runner prints allowlisted failing-test locations only; raw logs remain ephemeral.
      - name: Run sealed validation with sanitized failure locations
        env:
          CANDIDATE_RELEASE_ACK: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'release' && secrets.CANDIDATE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'release' && secrets.CANDIDATE_DEPLOY_TOKEN || '' }}
        run: node scripts/run-candidate.mjs "${{ github.event_name == 'push' && 'verify' || inputs.operation }}"
