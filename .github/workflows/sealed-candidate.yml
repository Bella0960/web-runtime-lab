name: Sealed candidate verification
# QA-only post-test failures emit a fixed sanitized category; never raw logs.

on:
  # Existing sealed workflow: owner pushes to this file automatically verify
  # the approved pinned QA snapshot. No deploy secrets enter push verification.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sealed-candidate.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify only, or publish the approved isolated QA build'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - release
      candidate:
        description: 'Sealed, single-chat, batch1, role layout or neutral role-card QA candidate'
        type: choice
        required: true
        default: sealed
        options:
          - sealed
          - chat-p0-375
          - batch1-p0-376
          - role-list-v117
          - role-editor-v118
          - role-copy-v119
      confirmation:
        description: 'For release only: enter qa-only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # No private deployment credentials enter an unapproved verify-only run.
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'workflow_dispatch' && (inputs.candidate == 'sealed' || ((inputs.candidate == 'chat-p0-375' || inputs.candidate == 'batch1-p0-376' || inputs.candidate == 'role-list-v117' || inputs.candidate == 'role-editor-v118' || inputs.candidate == 'role-copy-v119') && github.actor == github.repository_owner)) && (inputs.operation == 'verify' || (inputs.operation == 'release' && github.actor == github.repository_owner && inputs.confirmation == 'qa-only'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Verify restricted configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_IMAGE_BATCH_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_IMAGE_BATCH_QA_ONLY_20261122') && 'integration/qa-chat-image-batch-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_PLUS_CARDS_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_PLUS_CARDS_QA_ONLY_20261122') && 'integration/qa-chat-plus-cards-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_UNSENT_DRAFT_V2_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_UNSENT_DRAFT_V2_QA_ONLY_20261122') && 'integration/qa-chat-unsent-draft-v2-20261122' || github.event_name == 'push' && github.event.head_commit.message == 'VERIFY_CHAT_UNSENT_DRAFT_20261122' && 'integration/qa-chat-unsent-draft-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_SEARCH_INDEX_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_SEARCH_INDEX_QA_ONLY_20261122') && 'integration/qa-chat-search-index-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_FOLLOWUP_STOP_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_FOLLOWUP_STOP_QA_ONLY_20261122') && 'integration/qa-chat-followup-stop-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_DOCK_CENTER_20261122' || github.event.head_commit.message == 'RELEASE_DOCK_CENTER_QA_ONLY_20261122') && 'integration/qa-dock-center-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHARACTER_AI_V2_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_V2_QA_ONLY_20261122') && 'integration/qa-character-ai-v2-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHARACTER_AI_STABILIZE_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_STABILIZE_QA_ONLY_20261122') && 'integration/qa-character-ai-stabilize-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_PORTRAIT_ARCHIVE_AI_20261122' || github.event.head_commit.message == 'RELEASE_PORTRAIT_ARCHIVE_AI_QA_ONLY_20261122') && 'integration/qa-portrait-archive-ai-20261122' || github.event_name == 'push' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-copy-v119' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-editor-v118' && 'integration/qa-role-editor-labels-v118-20261122' || inputs.candidate == 'role-list-v117' && 'integration/qa-role-list-v117-20261122' || inputs.candidate == 'batch1-p0-376' && 'integration/qa-batch1-376' || inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          OPERATION: ${{ (github.event_name == 'push' && (github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_PORTRAIT_ARCHIVE_AI_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_STABILIZE_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_V2_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_DOCK_CENTER_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_FOLLOWUP_STOP_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_SEARCH_INDEX_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_UNSENT_DRAFT_V2_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_PLUS_CARDS_QA_ONLY_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_IMAGE_BATCH_QA_ONLY_20261122')) && 'release' || github.event_name == 'push' && 'verify' || inputs.operation }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Missing restricted source configuration.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_IMAGE_BATCH_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_IMAGE_BATCH_QA_ONLY_20261122') && 'integration/qa-chat-image-batch-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_PLUS_CARDS_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_PLUS_CARDS_QA_ONLY_20261122') && 'integration/qa-chat-plus-cards-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_UNSENT_DRAFT_V2_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_UNSENT_DRAFT_V2_QA_ONLY_20261122') && 'integration/qa-chat-unsent-draft-v2-20261122' || github.event_name == 'push' && github.event.head_commit.message == 'VERIFY_CHAT_UNSENT_DRAFT_20261122' && 'integration/qa-chat-unsent-draft-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_SEARCH_INDEX_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_SEARCH_INDEX_QA_ONLY_20261122') && 'integration/qa-chat-search-index-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_FOLLOWUP_STOP_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_FOLLOWUP_STOP_QA_ONLY_20261122') && 'integration/qa-chat-followup-stop-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_DOCK_CENTER_20261122' || github.event.head_commit.message == 'RELEASE_DOCK_CENTER_QA_ONLY_20261122') && 'integration/qa-dock-center-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHARACTER_AI_V2_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_V2_QA_ONLY_20261122') && 'integration/qa-character-ai-v2-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHARACTER_AI_STABILIZE_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_STABILIZE_QA_ONLY_20261122') && 'integration/qa-character-ai-stabilize-20261122' || github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_PORTRAIT_ARCHIVE_AI_20261122' || github.event.head_commit.message == 'RELEASE_PORTRAIT_ARCHIVE_AI_QA_ONLY_20261122') && 'integration/qa-portrait-archive-ai-20261122' || github.event_name == 'push' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-copy-v119' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-editor-v118' && 'integration/qa-role-editor-labels-v118-20261122' || inputs.candidate == 'role-list-v117' && 'integration/qa-role-list-v117-20261122' || inputs.candidate == 'batch1-p0-376' && 'integration/qa-batch1-376' || inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Verify pinned chat image batch QA SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_IMAGE_BATCH_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_IMAGE_BATCH_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='2a8f7136337d9aa40eaa8e2e0074325acbd01f50'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Chat image candidate changed; refusing verification.'
            exit 1
          fi
      - name: Verify pinned plus-menu card candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_PLUS_CARDS_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_PLUS_CARDS_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='78db173f62e3c1aa8ebcd271b1d98a5a6fcfc59b'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Plus-menu card QA candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned unsent-draft v2 QA SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_UNSENT_DRAFT_V2_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_UNSENT_DRAFT_V2_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='913d468b9b367bd2c8be723a133637441d222844'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unsent-draft v2 candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned chat search index candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_SEARCH_INDEX_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_SEARCH_INDEX_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='bcf66177a93de40db5164e68494f7f597607519a'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Chat search candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned unsent-draft candidate SHA
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'VERIFY_CHAT_UNSENT_DRAFT_20261122' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='20d46a914f69c87304134c80c522f6b058dc1375'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unsent-draft candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned chat follow-up stop candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHAT_FOLLOWUP_STOP_20261122' || github.event.head_commit.message == 'RELEASE_CHAT_FOLLOWUP_STOP_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='c1ce177a5ca501e5244208739b0a5b83aa24f603'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Follow-up stop candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned Dock center candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_DOCK_CENTER_20261122' || github.event.head_commit.message == 'RELEASE_DOCK_CENTER_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='603be334ff387ea5c0c60cb9958fea268e833a53'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Dock candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned character AI stabilization candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHARACTER_AI_STABILIZE_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_STABILIZE_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='55869b52753a557ec2b4383569535212af02d289'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Character AI source moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned character AI v2 QA candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_CHARACTER_AI_V2_20261122' || github.event.head_commit.message == 'RELEASE_CHARACTER_AI_V2_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='00224c8583b4a20b05f28ea024c2932492599722'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Character AI v2 QA candidate moved; refusing verification.'
            exit 1
          fi
      - name: Verify pinned portrait-archive-AI QA candidate SHA
        if: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'VERIFY_PORTRAIT_ARCHIVE_AI_20261122' || github.event.head_commit.message == 'RELEASE_PORTRAIT_ARCHIVE_AI_QA_ONLY_20261122') }}
        shell: bash
        run: |
          set -euo pipefail
          expected='391170340c9446024324cb21bd5156c1bab2f1d0'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Portrait-archive QA candidate moved; refusing validation.'
            exit 1
          fi
      - name: Verify approved single-chat candidate SHA
        if: ${{ inputs.candidate == 'chat-p0-375' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='ecda24302f2e7ccb4c15b9ffc1194949de1434a7'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Approved QA candidate changed; refuse unverified source.'
            exit 1
          fi
      - name: Verify approved batch1 QA candidate SHA
        if: ${{ inputs.candidate == 'batch1-p0-376' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='110f47167e350394c258a8b3d048c20d21611cab'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Batch1 candidate ref changed; refuse unverified source.'
            exit 1
          fi
      - name: Verify pinned role-layout QA candidate SHA
        if: ${{ inputs.candidate == 'role-list-v117' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='32f02124c3eee942f9569c5ac4127a180e44f872'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Role layout candidate ref changed; refusing unverified source.'
            exit 1
          fi
      - name: Verify pinned neutral editor QA candidate SHA
        if: ${{ inputs.candidate == 'role-editor-v118' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='8eb94f0c7ad69d799e96a05be83762005f3795b1'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Neutral editor candidate changed; refusing unverified source.'
            exit 1
          fi
      - name: Verify pinned role-copy QA candidate SHA
        if: ${{ (github.event_name == 'push' && github.event.head_commit.message != 'VERIFY_CHARACTER_AI_V2_20261122' && github.event.head_commit.message != 'RELEASE_CHARACTER_AI_V2_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_CHARACTER_AI_STABILIZE_20261122' && github.event.head_commit.message != 'RELEASE_CHARACTER_AI_STABILIZE_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_PORTRAIT_ARCHIVE_AI_20261122' && github.event.head_commit.message != 'RELEASE_PORTRAIT_ARCHIVE_AI_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_DOCK_CENTER_20261122' && github.event.head_commit.message != 'RELEASE_DOCK_CENTER_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_CHAT_FOLLOWUP_STOP_20261122' && github.event.head_commit.message != 'RELEASE_CHAT_FOLLOWUP_STOP_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_CHAT_SEARCH_INDEX_20261122' && github.event.head_commit.message != 'VERIFY_CHAT_UNSENT_DRAFT_20261122' && github.event.head_commit.message != 'RELEASE_CHAT_SEARCH_INDEX_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_CHAT_UNSENT_DRAFT_V2_20261122' && github.event.head_commit.message != 'RELEASE_CHAT_UNSENT_DRAFT_V2_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_CHAT_PLUS_CARDS_20261122' && github.event.head_commit.message != 'RELEASE_CHAT_PLUS_CARDS_QA_ONLY_20261122' && github.event.head_commit.message != 'VERIFY_CHAT_IMAGE_BATCH_20261122' && github.event.head_commit.message != 'RELEASE_CHAT_IMAGE_BATCH_QA_ONLY_20261122') || inputs.candidate == 'role-copy-v119' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='da9dbb00b33eebe8152c469e7635646efdc36db0'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Role-copy QA candidate changed; refusing unverified source.'
            exit 1
          fi
      - name: Verify approved staging matches tested batch1 before one-time QA release
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_BATCH1_QA_ONLY_20261122' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch --quiet --no-tags origin integration/batch1-qa-merge-20261122
          merged="$(git -C candidate rev-parse FETCH_HEAD)"
          if [[ "$merged" != '39dbea98ec6e864bcaeee91265ccda137abb5bec' ]]; then
            echo 'Merged staging branch moved; refusing QA release.'
            exit 1
          fi
          actual="$(git -C candidate diff --name-only "$merged" HEAD)"
          expected="$(printf '%s\n' 'scripts/qa-direct-release.mjs' 'tests/memory-space-cleanup.browser.test.mjs')"
