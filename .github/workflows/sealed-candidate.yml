name: Sealed candidate verification

on:
  # Existing sealed workflow: owner pushes to this file automatically verify
  # the approved pinned QA snapshot. No deploy secrets enter push verification.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sealed-candidate.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify only, or publish the approved isolated QA build'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - release
      candidate:
        description: 'Sealed, single-chat, batch1, role layout or neutral role-card QA candidate'
        type: choice
        required: true
        default: sealed
        options:
          - sealed
          - chat-p0-375
          - batch1-p0-376
          - role-list-v117
          - role-editor-v118
          - role-copy-v119
      confirmation:
        description: 'For release only: enter qa-only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # No private deployment credentials enter an unapproved verify-only run.
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'workflow_dispatch' && (inputs.candidate == 'sealed' || ((inputs.candidate == 'chat-p0-375' || inputs.candidate == 'batch1-p0-376' || inputs.candidate == 'role-list-v117' || inputs.candidate == 'role-editor-v118' || inputs.candidate == 'role-copy-v119') && github.actor == github.repository_owner)) && (inputs.operation == 'verify' || (inputs.operation == 'release' && github.actor == github.repository_owner && inputs.confirmation == 'qa-only'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Verify restricted configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ github.event_name == 'push' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-copy-v119' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-editor-v118' && 'integration/qa-role-editor-labels-v118-20261122' || inputs.candidate == 'role-list-v117' && 'integration/qa-role-list-v117-20261122' || inputs.candidate == 'batch1-p0-376' && 'integration/qa-batch1-376' || inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          OPERATION: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122') && 'release' || github.event_name == 'push' && 'verify' || inputs.operation }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Missing restricted source configuration.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event_name == 'push' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-copy-v119' && 'integration/qa-role-copy-errors-20261122' || inputs.candidate == 'role-editor-v118' && 'integration/qa-role-editor-labels-v118-20261122' || inputs.candidate == 'role-list-v117' && 'integration/qa-role-list-v117-20261122' || inputs.candidate == 'batch1-p0-376' && 'integration/qa-batch1-376' || inputs.candidate == 'chat-p0-375' && 'integration/qa-single-chat-375' || secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Verify approved single-chat candidate SHA
        if: ${{ inputs.candidate == 'chat-p0-375' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='ecda24302f2e7ccb4c15b9ffc1194949de1434a7'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Approved QA candidate changed; refuse unverified source.'
            exit 1
          fi
      - name: Verify approved batch1 QA candidate SHA
        if: ${{ inputs.candidate == 'batch1-p0-376' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='110f47167e350394c258a8b3d048c20d21611cab'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Batch1 candidate ref changed; refuse unverified source.'
            exit 1
          fi
      - name: Verify pinned role-layout QA candidate SHA
        if: ${{ inputs.candidate == 'role-list-v117' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='32f02124c3eee942f9569c5ac4127a180e44f872'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Role layout candidate ref changed; refusing unverified source.'
            exit 1
          fi
      - name: Verify pinned neutral editor QA candidate SHA
        if: ${{ inputs.candidate == 'role-editor-v118' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='8eb94f0c7ad69d799e96a05be83762005f3795b1'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Neutral editor candidate changed; refusing unverified source.'
            exit 1
          fi
      - name: Verify pinned role-copy QA candidate SHA
        if: ${{ github.event_name == 'push' || inputs.candidate == 'role-copy-v119' }}
        shell: bash
        run: |
          set -euo pipefail
          expected='da9dbb00b33eebe8152c469e7635646efdc36db0'
          actual="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Role-copy QA candidate changed; refusing unverified source.'
            exit 1
          fi
      - name: Verify approved staging matches tested batch1 before one-time QA release
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_BATCH1_QA_ONLY_20261122' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch --quiet --no-tags origin integration/batch1-qa-merge-20261122
          merged="$(git -C candidate rev-parse FETCH_HEAD)"
          if [[ "$merged" != '39dbea98ec6e864bcaeee91265ccda137abb5bec' ]]; then
            echo 'Merged staging branch moved; refusing QA release.'
            exit 1
          fi
          actual="$(git -C candidate diff --name-only "$merged" HEAD)"
          expected="$(printf '%s\n' 'scripts/qa-direct-release.mjs' 'tests/memory-space-cleanup.browser.test.mjs')"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Merged staging differs from sealed tested app; refusing QA release.'
            exit 1
          fi
      - name: Verify role-layout staging matches pinned QA candidate before release
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_LAYOUT_QA_ONLY_20261122' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch --quiet --no-tags origin integration/batch1-qa-merge-20261122
          merged="$(git -C candidate rev-parse FETCH_HEAD)"
          # Must be set only after the isolated PR has been safely merged.
          if [[ "$merged" != 'f650496ec93ce1c80a61ab1927e08f3c92ca474c' ]]; then
            echo 'Role-layout staging SHA mismatch; refusing QA release.'
            exit 1
          fi
          actual="$(git -C candidate diff --name-only "$merged" HEAD)"
          expected="$(printf '%s\n' 'scripts/qa-direct-release.mjs' 'tests/memory-space-cleanup.browser.test.mjs')"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Role-layout staging differs from tested QA app; refusing release.'
            exit 1
          fi
      - name: Verify neutral editor staging matches the tested candidate before QA release
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_EDITOR_QA_ONLY_20261122' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch --quiet --no-tags origin integration/batch1-qa-merge-20261122
          merged="$(git -C candidate rev-parse FETCH_HEAD)"
          # Fail closed until PR #383 is independently verified and merged.
          if [[ "$merged" != '80bad1174e04c90d0b256790cf685f456fe92203' ]]; then
            echo 'Neutral editor staging SHA mismatch; refusing QA release.'
            exit 1
          fi
          actual="$(git -C candidate diff --name-only "$merged" HEAD)"
          expected="$(printf '%s\n' 'scripts/qa-direct-release.mjs' 'tests/memory-space-cleanup.browser.test.mjs')"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Neutral editor staging differs from the tested app; refusing release.'
            exit 1
          fi
      - name: Verify role-copy staging matches tested SHA before QA release
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch --quiet --no-tags origin integration/batch1-qa-merge-20261122
          merged="$(git -C candidate rev-parse FETCH_HEAD)"
          if [[ "$merged" != '36606bd5cb4cc5909f0ce8e30f2c804623022f84' ]]; then
            echo 'Role-copy staging SHA mismatch; refusing QA release.'
            exit 1
          fi
          actual="$(git -C candidate diff --name-only "$merged" HEAD)"
          expected="$(printf '%s\n' 'scripts/qa-direct-release.mjs' 'tests/memory-space-cleanup.browser.test.mjs')"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Role-copy staging differs from tested candidate; refusing release.'
            exit 1
          fi
      # The runner prints allowlisted failing-test locations only; raw logs remain ephemeral.
      - name: Run sealed validation with sanitized failure locations
        env:
          CANDIDATE_RELEASE_ACK: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122') && 'qa-only' || github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ ((github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')) && secrets.CANDIDATE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ ((github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')) && secrets.CANDIDATE_DEPLOY_TOKEN || '' }}
        run: node scripts/run-candidate.mjs "${{ (github.event_name == 'push' && github.event.head_commit.message == 'RELEASE_ROLE_COPY_QA_ONLY_20261122') && 'release' || github.event_name == 'push' && 'verify' || inputs.operation }}"
