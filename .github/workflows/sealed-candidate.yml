name: Sealed candidate verification
# API-UI-003: v123 QA-only release after full public verification #45072859923; candidate SHA 844ff812ecf1e216a57be74045dbbe33ea644138.
# Owner-approved v122 API UI QA-only deployment after public verify run 45070504276; frozen source c4dfbcc79a4fe288293584ff38296ce4e31f37fb.
# QA-only post-test failures emit a fixed sanitized category; never raw logs.
# v120 QA-only release approved after sealed verify run 45065271085; pinned source 74433602f3be43a18e962e76dda437008c180ae5.
# Approved final3 code-only music QA release, fixed source e136fc74c879ae10a4048daa8d4e04f6ae209541.
# Pinned QA-only storage-after-edit publish request: 08a3ab59f75df89caa6b56a3467ab8cbac9062f8 (guarded by full release gates).

on:
  # Existing sealed workflow: owner pushes to this file automatically verify
  # the approved pinned QA snapshot. No deploy secrets enter push verification.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sealed-candidate.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify only, or publish the approved isolated QA build'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - release
      candidate:
        description: 'Sealed, single-chat, batch1, role layout or neutral role-card QA candidate'
        type: choice
        required: true
        default: sealed
        options:
          - sealed
          - chat-p0-375
          - batch1-p0-376
          - role-list-v117
          - role-editor-v118
          - role-copy-v119
      confirmation:
        description: 'For release only: enter qa-only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep all release operations serialized. This credential-free preview
  # verification has no publish step and must not wait behind a stuck release.
  group: ${{ github.event_name == 'push' && github.event.head_commit.message == 'CHECK_ANDROID_SHORT_HOST_20261124' && 'short-host-https-check' || github.event_name == 'push' && github.event.head_commit.message == 'VERIFY_DESKTOP_STABILITY_P0_20261124' && 'sealed-candidate-desktop-stability' || github.event_name == 'push' && github.event.head_commit.message == 'DEPLOY_ANDROID_LOCKSCREEN_SANDBOX_20261124' && 'sealed-android-lockscreen-preview' || github.event_name == 'push' && github.event.head_commit.message == 'VERIFY_PUSH_LOCKSCREEN_V157_20261124' && 'sealed-candidate-v157-preview-verify' || github.event_name == 'push' && github.event.head_commit.message == 'VERIFY_CLOUD_PREVIEW_20261124' && 'sealed-candidate-cloud-push-verify' || 'sealed-candidate' }}
  cancel-in-progress: false

jobs:
  candidate:
    # No private deployment credentials enter an unapproved verify-only run.
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'workflow_dispatch' && (inputs.candidate == 'sealed' || ((inputs.candidate == 'chat-p0-375' || inputs.candidate == 'batch1-p0-376' || inputs.candidate == 'role-list-v117' || inputs.candidate == 'role-editor-v118' || inputs.candidate == 'role-copy-v119') && github.actor == github.repository_owner)) && (inputs.operation == 'verify' || (inputs.operation == 'release' && github.actor == github.repository_owner && inputs.confirmation == 'qa-only'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public metadata guard
        run: node scripts/public-content-check.mjs
      - name: Verify restricted configuration
