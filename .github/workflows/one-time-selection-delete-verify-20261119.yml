name: One-time safe selected-message delete QA verification
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-selection-delete-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '80fe8916d918efc2f4b4cc2424146f5a11fc8636' && github.event.head_commit.message == 'ci: classify chat contract failure by test ordinal without private logs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source isolation gate
        run: npm run check:public
      - name: Confirm original restricted candidate configuration
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO"
          test -n "$SOURCE_REF"
          test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPO"
          echo "::add-mask::${SOURCE_REPO##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact original QA and fixed review snapshot
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7fa607d14faf16c5c1abdf7e711d081a4b44fba6'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Diagnose single target test without exposing private logs
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { spawnSync } from 'node:child_process';
          const result=spawnSync(process.execPath,['--test','tests/chat-selection-delete-atomic.test.mjs'],{
            cwd:'candidate',encoding:'utf8',maxBuffer:4*1024*1024,timeout:120000
          });
          const output=String(result.stdout||'')+'\n'+String(result.stderr||'');
          const ids=[...output.matchAll(/^not ok\s+(\d+)\s+-/gm)].map(x=>Number(x[1]));
          console.log('Synthetic selection-delete tests: '+(result.status===0?'PASS':'FAIL'));
          console.log('Failed test ordinals: '+(ids.length?ids.join(','):'none-detected'));
          if(result.status!==0) process.exit(1);
          EOF
      - name: Classify exact contract test ordinals without private logs
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { spawnSync } from 'node:child_process';
          const result=spawnSync('npm',['run','test:chat:contract'],{
            cwd:'candidate',encoding:'utf8',maxBuffer:16*1024*1024,timeout:240000
          });
          const output=String(result.stdout||'')+'\n'+String(result.stderr||'');
          const ids=[...output.matchAll(/^\s*not ok\s+(\d+)\s+-/gm)].map(x=>Number(x[1]));
          const count=[...output.matchAll(/^\s*# tests\s+(\d+)/gm)].map(x=>Number(x[1])).at(-1)||0;
          console.log('Chat contract status: '+(result.status===0?'PASS':'FAIL'));
          console.log('Chat contract test count: '+count);
          console.log('Chat contract failed ordinals: '+(ids.length?ids.join(','):'none-detected'));
          if(result.status!==0)process.exit(1);
          EOF
