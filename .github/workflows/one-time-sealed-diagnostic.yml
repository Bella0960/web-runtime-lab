name: One-time sealed diagnostic

on:
  push:
    branches:
      - qa-candidate

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.actor == 'Bella0960' && github.event.before == '8117f4237211b0cc8c65c99c8b9c7bc1c3723e9e' && github.event.head_commit.message == 'ci: one-time sealed diagnostic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout verified public scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public safety guard
        run: npm run check:public
      - name: Verify isolated source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Missing restricted source configuration.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout temporary private candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Run exactly one sealed verification
        run: node scripts/run-candidate.mjs verify
