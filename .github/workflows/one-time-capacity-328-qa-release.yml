name: One-time guarded capacity fallback QA release
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-capacity-328-qa-release.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'a5950e724a327767458e301a94c985ae4d7e6535' && github.event.head_commit.message == 'ci: one-time approved capacity fallback QA-only release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public repository privacy
        run: node scripts/public-content-check.mjs
      - name: Verify restricted source and scoped QA authorization
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Restricted QA-only authorization unavailable.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout existing private QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact merged QA commit and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'e65e7ef203b5a595e38449a15c9e6e4523d2b856'
          test "$(git -C candidate branch --show-current)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git -C candidate status --porcelain)"
          echo 'Exact approved QA candidate verified.'
      - name: Run original complete private regression and QA Worker-only release
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release