name: Pinned QA Node diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinned-node-diagnostics.yml'
permissions:
  contents: read
concurrency:
  group: pinned-node-diagnostics
  cancel-in-progress: false
jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent private source in public runner repo
        run: node scripts/public-content-check.mjs
      - name: Restricted repository configuration
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::$(basename "$SOURCE_REPOSITORY")"
      - name: Checkout pinned candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event.head_commit.message == 'VERIFY_FOOTPRINT_PERSONA_JSON_R6_20261123' && 'dde89484a75f2d3fb7e3421463ac15ff246ab862' || github.event.head_commit.message == 'VERIFY_CHARACTER_AI_ACTIVE_PROFILE_20261123' && 'b594bb18f26e80249fc0bd107ead9c7045704c51' || github.event.head_commit.message == 'VERIFY_MUSIC_QA_NODE_FINAL3_20261123' && 'e136fc74c879ae10a4048daa8d4e04f6ae209541' || github.event.head_commit.message == 'VERIFY_MUSIC_QA_NODE_FINAL2_20261123' && 'd2da3b571adcf31911012b6d1b15aa88d8580a4d' || github.event.head_commit.message == 'VERIFY_MUSIC_BUILD_BROWSER_R2_20261123' && '5468631242b5a2d2406332142c4fc2d360c2bd11' || github.event.head_commit.message == 'VERIFY_STORAGE_BASELINE_20261122' && 'a5415d7e28280fd07cea4d02e19e87d9ec36083e' || github.event.head_commit.message == 'VERIFY_STORAGE_395_20261122' && '2c0685d5b3dd39851c381a2231050827c6076bed' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_395_20261122' && '92b4785c91cc61149070d7ac7e62c86823ffd300' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_FINAL_395_20261122' && 'integration/qa-storage-395-20261122' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_CACHE_FINAL_395_20261122' && 'integration/qa-storage-395-20261122' || github.event.head_commit.message == 'VERIFY_STORAGE_AFTER_CHAT_EDIT_20261123' && 'integration/qa-storage-after-edit-20261123' || 'ad341afc481063c4a0943380650722e306f3ba20' }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify source and run isolated recovery gates
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.head_commit.message == 'VERIFY_FOOTPRINT_PERSONA_JSON_R6_20261123' && 'dde89484a75f2d3fb7e3421463ac15ff246ab862' || github.event.head_commit.message == 'VERIFY_CHARACTER_AI_ACTIVE_PROFILE_20261123' && 'b594bb18f26e80249fc0bd107ead9c7045704c51' || github.event.head_commit.message == 'VERIFY_MUSIC_QA_NODE_FINAL3_20261123' && 'e136fc74c879ae10a4048daa8d4e04f6ae209541' || github.event.head_commit.message == 'VERIFY_MUSIC_QA_NODE_FINAL2_20261123' && 'd2da3b571adcf31911012b6d1b15aa88d8580a4d' || github.event.head_commit.message == 'VERIFY_MUSIC_BUILD_BROWSER_R2_20261123' && '5468631242b5a2d2406332142c4fc2d360c2bd11' || github.event.head_commit.message == 'VERIFY_STORAGE_BASELINE_20261122' && 'a5415d7e28280fd07cea4d02e19e87d9ec36083e' || github.event.head_commit.message == 'VERIFY_STORAGE_395_20261122' && '2c0685d5b3dd39851c381a2231050827c6076bed' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_395_20261122' && '92b4785c91cc61149070d7ac7e62c86823ffd300' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_FINAL_395_20261122' && 'adaa0dc67bfa6759ded721a6618a7f8a9e08b4d1' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_CACHE_FINAL_395_20261122' && 'c67ffe4c21aca0f1de6a02ec066264fce7cf78f7' || github.event.head_commit.message == 'VERIFY_STORAGE_AFTER_CHAT_EDIT_20261123' && '08a3ab59f75df89caa6b56a3467ab8cbac9062f8' || 'ad341afc481063c4a0943380650722e306f3ba20' }}"
          test "$(git -C candidate rev-parse HEAD)" = "$expected"
          cd candidate
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_FOOTPRINT_PERSONA_JSON_R6_20261123' ]]; then
            echo 'FOOTPRINT: pinned source verified, tests only; no deployment'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/footprint-install.log" 2>&1 || { echo 'FAIL footprint npm ci'; exit 1; }
            node --test tests/footprint-persona-json.test.mjs >"$RUNNER_TEMP/footprint-node.log" 2>&1 || {
              echo 'FAIL footprint Node'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/footprint-node.log" | head -n 18 | cut -c1-190 || true
              exit 1
            }
            echo 'PASS footprint Node'
            npm run build >"$RUNNER_TEMP/footprint-build.log" 2>&1 || {
              echo 'FAIL footprint full Vite build'
              grep -Ei 'error during build|error:|could not resolve' "$RUNNER_TEMP/footprint-build.log" | head -n 6 | cut -c1-190 || true
              exit 1
            }
            test -f dist/chat/footprint/footprint.html || { echo 'FAIL built footprint HTML missing'; exit 1; }
            test -f dist/chat/footprint/footprint-ai.js || { echo 'FAIL built footprint JSON module missing'; exit 1; }
            echo 'PASS footprint full Vite + assets'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/footprint-browser-install.log" 2>&1 || {
              echo 'FAIL footprint Chromium setup'
              exit 1
            }
            node --test tests/footprint-persona-mobile.browser.test.mjs >"$RUNNER_TEMP/footprint-chromium.log" 2>&1 || {
              echo 'FAIL footprint real Chromium 375/390/430'
              # Synthetic fixture only; print bounded TAP failure locations, not app data, tokens or raw logs.
              grep -E '^# FP_PHASE|^# FP_FLAGS|^not ok [0-9]+|^# (tests|pass|fail) [0-9]+|^  (error|code|name|location|expected|actual|operator):|^    at .*footprint-persona-mobile' "$RUNNER_TEMP/footprint-chromium.log" | head -n 22 | cut -c1-190 || true
              exit 1
            }
            echo 'PASS footprint real Chromium 375/390/430'
            echo 'SUCCESS footprint persona JSON, Vite and Chromium verified; no deployment'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_CHARACTER_AI_ACTIVE_PROFILE_20261123' ]]; then
            echo 'CHARACTER AI: pinned source, test-only, no deploy'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/role-ai-install.log" 2>&1 || { echo 'FAIL character AI npm ci'; exit 1; }
            node --test tests/character-ai-life-flow.test.mjs tests/character-ai-json-recovery.test.mjs tests/character-ai-output-budget-recovery.test.mjs >"$RUNNER_TEMP/role-ai-node.log" 2>&1 || {
              echo 'FAIL character AI Node'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/role-ai-node.log" | head -n 18 | cut -c1-160 || true
              exit 1
            }
            echo 'PASS character AI Node'
            npm run build >"$RUNNER_TEMP/role-ai-build.log" 2>&1 || {
              echo 'FAIL character AI full Vite build'
              grep -Ei 'error during build|error:|could not resolve' "$RUNNER_TEMP/role-ai-build.log" | head -n 5 | cut -c1-150 || true
              exit 1
            }
            echo 'PASS character AI Vite'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/role-ai-install-chromium.log" 2>&1 || { echo 'FAIL Chromium install'; exit 1; }
            node --test tests/character-ai-mobile-ux.browser.test.mjs >"$RUNNER_TEMP/role-ai-browser.log" 2>&1 || {
              echo 'FAIL character AI Chromium 375/390/430'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+|Error:' "$RUNNER_TEMP/role-ai-browser.log" | head -n 18 | cut -c1-160 || true
              exit 1
            }
            echo 'PASS character AI Chromium 375/390/430'
            echo 'SUCCESS character AI selected-profile, JSON and life-line tests; no deployment'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_MUSIC_QA_NODE_FINAL3_20261123' ]]; then
            echo 'MUSIC FINAL3: fixed SHA checked; validating Android picker, concurrency, duration contracts'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/music-final3-install.log" 2>&1 || { echo 'FAIL music final3 npm ci'; exit 1; }
            if node --test tests/music-extensionless-import.test.mjs tests/music-import-concurrency-guard.test.mjs tests/music-duration-display.test.mjs >"$RUNNER_TEMP/music-final3-node.log" 2>&1; then
              grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-final3-node.log" | tail -n 3 || true
              echo 'PASS music final3 required Node suites'
            else
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-final3-node.log" | head -n 18 | cut -c1-150 || true
              echo 'FAIL music final3 Node regression; no deployment'
              exit 1
            fi
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_MUSIC_QA_NODE_FINAL2_20261123' ]]; then
            echo 'MUSIC FINAL2: exact candidate SHA checked, running only fixed Android/concurrency Node suites'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/music-final2-install.log" 2>&1 || { echo 'FAIL music final2 npm ci'; exit 1; }
            if node --test tests/music-extensionless-import.test.mjs tests/music-import-concurrency-guard.test.mjs >"$RUNNER_TEMP/music-final2-node.log" 2>&1; then
              grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-final2-node.log" | tail -n 3 || true
              echo 'PASS music final2 Android picker and concurrency regression'
            else
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-final2-node.log" | head -n 18 | cut -c1-150 || true
              echo 'FAIL music final2 Node regression; no deployment'
              exit 1
            fi
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_MUSIC_BUILD_BROWSER_R2_20261123' ]]; then
            # Verify-only: use the reviewed fixed SHA, no Worker secrets, no deploy.
            echo 'MUSIC 405: pinned source checked; begin real full checkout gates'
            npm ci --no-audit --no-fund >"$RUNNER_TEMP/music-405-install.log" 2>&1 || {
              echo 'FAIL music-405 dependency installation'
              exit 1
            }
            echo 'PASS music-405 npm ci'
            npm run build >"$RUNNER_TEMP/music-405-vite.log" 2>&1 || {
              echo 'FAIL music-405 complete Vite build'
              grep -Ei 'error during build|could not resolve|error:|Error \[' "$RUNNER_TEMP/music-405-vite.log" | head -n 5 | cut -c1-180 || true
              exit 1
            }
            test -f dist/music/music.html || { echo 'FAIL music-405 expected built music page missing'; exit 1; }
            echo 'PASS music-405 full Vite build and postbuild'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/music-405-browser-install.log" 2>&1 || {
              echo 'FAIL music-405 Chromium installation'
              exit 1
            }
            echo 'PASS music-405 Chromium installed'
            browser_failed=0
            node tests/music-mobile-browser.mjs >"$RUNNER_TEMP/music-405-browser.log" 2>&1 || {
              browser_failed=1
              echo 'FAIL music-405 real Chromium 375/390/430 mobile test'
              grep -E 'PASS Chromium|FAIL MUSIC Chromium QA:|AssertionError|TimeoutError|Error:|music-mobile-browser.mjs:[0-9]+' "$RUNNER_TEMP/music-405-browser.log" | head -n 10 | cut -c1-200 || true
            }
            if [[ "$browser_failed" -eq 0 ]]; then echo 'PASS music-405 real Chromium at 375/390/430px'; fi
            music_node_failed=0
            npm run test:music:experience >"$RUNNER_TEMP/music-405-node.log" 2>&1 || {
              music_node_failed=1
              echo 'FAIL music-405 real Node experience suite'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-405-node.log" | head -n 16 | cut -c1-180 || true
            }
            if [[ "$music_node_failed" -eq 0 ]]; then echo 'PASS music-405 Node music suite'; fi
            media_node_failed=0
            npm run test:media:backup >"$RUNNER_TEMP/music-405-media-backup.log" 2>&1 || {
              media_node_failed=1
              echo 'FAIL music-405 media backup Node suite'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-405-media-backup.log" | head -n 16 | cut -c1-180 || true
            }
            backup_node_failed=0
            npm run test:backup:modules >"$RUNNER_TEMP/music-405-backup-modules.log" 2>&1 || {
              backup_node_failed=1
              echo 'FAIL music-405 backup modules Node suite'
              grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/music-405-backup-modules.log" | head -n 16 | cut -c1-180 || true
            }
            echo "MUSIC_GATES browser=$browser_failed music_node=$music_node_failed media_backup=$media_node_failed backup_modules=$backup_node_failed"
            if [[ "$browser_failed" -ne 0 || "$music_node_failed" -ne 0 || "$media_node_failed" -ne 0 || "$backup_node_failed" -ne 0 ]]; then
              echo 'FAIL music-405 verification; no deployment'
              exit 1
            fi
            echo 'PASS music-405 all Node music/backup suites; verify only, no deployment'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_AFTER_CHAT_EDIT_20261123' ]]; then
            test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/qa-storage-after-edit-20261123' || { echo 'FAILED approved QA candidate branch'; exit 1; }
            node scripts/qa-direct-release.mjs >"$RUNNER_TEMP/qa-storage-after-edit.log" 2>&1 || {
              echo 'FAILED full QA Node/Vite/Chromium release safety gates; no deployment'
              exit 1
            }
            echo 'PASS full QA Node/Vite/Chromium release safety gates; verify only'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_QA_FINAL_395_20261122' || "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_QA_CACHE_FINAL_395_20261122' ]]; then
            test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/qa-storage-395-20261122' || { echo 'FAILED QA candidate branch guard'; exit 1; }
            # Existing candidate script checks clean HEAD, exact remote ref, account safety,
            # all original Node/Vite/Chromium gates; no --deploy or --qa-only flag.
            node scripts/qa-direct-release.mjs >"$RUNNER_TEMP/qa-storage-full-gates.log" 2>&1 || {
              echo 'FAILED full QA candidate release gates: verification only; no deployment'
              exit 1
            }
            echo 'PASS full QA candidate release gates: verification only; no deployment'
            exit 0
          fi
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/install.log" 2>&1 || { echo 'FAILED dependencies'; exit 1; }
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_QA_395_20261122' ]]; then
            npm run test:storage:reliability >"$RUNNER_TEMP/storage-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Node quota tests'; exit 1; }
            echo 'QA_STORAGE Node quota tests PASS'
            npm run test:chat:contract >"$RUNNER_TEMP/chat-qa.log" 2>&1 || { echo 'QA_STORAGE failed: chat contract'; exit 1; }
            echo 'QA_STORAGE chat contract PASS'
            npm run test:chat:isolation >"$RUNNER_TEMP/isolation-qa.log" 2>&1 || { echo 'QA_STORAGE failed: chat isolation'; exit 1; }
            echo 'QA_STORAGE chat isolation PASS'
            npm run build >"$RUNNER_TEMP/vite-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Vite'; exit 1; }
            echo 'QA_STORAGE Vite build PASS'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Chromium dependencies'; exit 1; }
            npm run test:chat:isolation:browser >"$RUNNER_TEMP/browser-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Chromium chat isolation'; exit 1; }
            echo 'QA_STORAGE Chromium browser PASS, verify-only (no deploy)'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_BASELINE_20261122' ]]; then
            chat_status=0
            isolation_status=0
            npm run test:chat:contract >"$RUNNER_TEMP/baseline-chat.log" 2>&1 || chat_status=$?
            npm run test:chat:isolation >"$RUNNER_TEMP/baseline-isolation.log" 2>&1 || isolation_status=$?
            node --input-type=module <<'SAFE_BASELINE_REPORT'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = s => createHash('sha256').update(s).digest('hex').slice(0,12);
          for(const [name,file] of [['chat','baseline-chat.log'],['isolation','baseline-isolation.log']]) {
            const lines = readFileSync(process.env.RUNNER_TEMP + '/' + file, 'utf8').split(/\r?\n/);
            for(const line of lines) {
              const fail=line.match(/^not ok (\d+) - (.*)$/);
              if(fail) console.log('BASELINE_FAIL suite='+name+' ordinal='+fail[1]+' hash='+hash(fail[2]));
              if(/^# (?:tests|pass|fail|skipped) \d+$/.test(line)) console.log('BASELINE '+name+' '+line);
            }
          }
          SAFE_BASELINE_REPORT
            echo "BASELINE_COMPARE chat_status=$chat_status isolation_status=$isolation_status"
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_395_20261122' ]]; then
            npm run test:storage:reliability >"$RUNNER_TEMP/storage.log" 2>&1 || { echo 'FAILED storage Node regression'; exit 1; }
            chat_contract_failed=0
            npm run test:chat:contract >"$RUNNER_TEMP/chat.log" 2>&1 || {
              chat_contract_failed=1
              node --input-type=module <<'SAFE_CHAT_FAILURE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const log = readFileSync(process.env.RUNNER_TEMP + '/chat.log', 'utf8').split(/\r?\n/);
          const hash = s => createHash('sha256').update(s).digest('hex').slice(0, 12);
          for (let i = 0; i < log.length; i++) {
            const failure = log[i].match(/^not ok (\d+) - (.*)$/);
            if (!failure) continue;
            const context = log.slice(i, i + 28).join(' ');
            const location = context.match(/(?:tests\/)[A-Za-z0-9_.-]+\.test\.mjs(?::\d+(?::\d+)?)?/);
            console.log('CHAT_FAIL ordinal=' + failure[1] + ' titleHash=' + hash(failure[2]) + ' source=' + (location?.[0] || 'unknown'));
          }
          for (const line of log) if (/^# (?:tests|pass|fail|skipped) \d+$/.test(line)) console.log(line);
          SAFE_CHAT_FAILURE
              echo 'CHAT CONTRACT FAILED: continuing other gates without bypassing this failure'
            }
            isolation_failed=0
            npm run test:chat:isolation >"$RUNNER_TEMP/isolation.log" 2>&1 || {
              isolation_failed=1
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                import { createHash } from "node:crypto";
                const log = readFileSync(process.env.RUNNER_TEMP + "/isolation.log", "utf8").split(/\r?\n/);
                const hash = s => createHash("sha256").update(s).digest("hex").slice(0,12);
                for(const line of log) {
                  const match = line.match(/^not ok (\d+) - (.*)$/);
                  if(match) console.log("ISOLATION_FAIL ordinal=" + match[1] + " titleHash=" + hash(match[2]));
                  if(/^# (?:tests|pass|fail|skipped) \d+$/.test(line)) console.log(line);
                }
              '
              echo 'FAILED chat isolation regression'
            }
            build_failed=0
            npm run build >"$RUNNER_TEMP/build.log" 2>&1 || { build_failed=1; echo 'FAILED Vite'; }
            browser_failed=0
            if [[ "$build_failed" -eq 0 ]]; then
              npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log" 2>&1 || { browser_failed=1; echo 'FAILED Chromium dependencies'; }
              if [[ "$browser_failed" -eq 0 ]]; then
                npm run test:chat:isolation:browser >"$RUNNER_TEMP/browser.log" 2>&1 || { browser_failed=1; echo 'FAILED Chromium chat isolation'; }
              fi
            else
              browser_failed=1
              echo 'NOT_RUN Chromium due to failed Vite build'
            fi
            echo "GATES storage=pass chat_contract_failed=$chat_contract_failed isolation_failed=$isolation_failed vite_failed=$build_failed browser_failed=$browser_failed"
            if [[ "$chat_contract_failed" -ne 0 || "$isolation_failed" -ne 0 || "$build_failed" -ne 0 || "$browser_failed" -ne 0 ]]; then
              echo 'FAILED storage candidate verification; no deployment performed'
              exit 1
            fi
            echo 'PASS storage Node, chat contract, chat isolation, Vite and Chromium'
            exit 0
          fi
          npm run build >"$RUNNER_TEMP/build.log" 2>&1 || { echo 'FAILED Vite'; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log" 2>&1 || { echo 'FAILED Chromium dependencies'; exit 1; }
          export NODE_DISABLE_COLORS=1
          set +e
          node --test --test-concurrency=1 >"$RUNNER_TEMP/full-node.log" 2>&1
          result=$?
          set -e
          node --input-type=module <<'SAFE_DIAGNOSTICS'
          import {readFileSync} from 'node:fs';
          const log=readFileSync(process.env.RUNNER_TEMP+'/full-node.log','utf8');
          const lines=log.split('\n');
          function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return (h>>>0).toString(16);}
          const name='tests/inspect-phone-gesture.test.mjs';
          const start=lines.findIndex(line=>line.includes('FATAL:')&&(line.includes('画师')||line.includes('用户单聊')||line.includes('Timeout')||line.includes('模型')||line.includes('返回桌面')));
          if(start>=0){
            const line=lines[start];
            console.log('INSPECT_CHECK '+['画师聊天按本人档案生成','用户单聊固定首位','Timeout','微信聊天详情可直返桌面','备忘录正文可直返桌面','读取第二个角色自己的档案','两个角色各生成一次'].map(value=>Number(line.includes(value))).join(''));
            console.log('INSPECT_WAIT '+['.nv-contact','#appHome','[data-action=','[data-detail=','[data-app='].map(value=>Number(lines.slice(start,start+12).some(line=>line.includes(value)))).join(''));
          }
          for(const [i,line] of lines.entries()){
            const match=line.match(/^not ok (\d+) - (.*)/);
            if(!match)continue;
            const nearby=lines.slice(i,i+15).join('\n');
            const location=nearby.match(/\/candidate\/(tests\/[^\s'":]+)(?::(\d+):\d+)?/);
            console.log('FAIL ordinal='+match[1]+' inspect='+Number(nearby.includes(name)||match[2].includes(name))+' pathHash='+hash(location?.[1]||'')+' labelHash='+hash(match[2])+' line='+(location?.[2]||0));
          }
          for(const line of lines)if(/^# (tests|pass|fail|skipped) \d+$/.test(line))console.log(line);
          SAFE_DIAGNOSTICS
          exit "$result"
