name: Pinned QA Node diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinned-node-diagnostics.yml'
permissions:
  contents: read
concurrency:
  group: pinned-node-diagnostics
  cancel-in-progress: false
jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent private source in public runner repo
        run: node scripts/public-content-check.mjs
      - name: Restricted repository configuration
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::$(basename "$SOURCE_REPOSITORY")"
      - name: Checkout pinned candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ github.event.head_commit.message == 'VERIFY_STORAGE_BASELINE_20261122' && 'a5415d7e28280fd07cea4d02e19e87d9ec36083e' || github.event.head_commit.message == 'VERIFY_STORAGE_395_20261122' && '2c0685d5b3dd39851c381a2231050827c6076bed' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_395_20261122' && '92b4785c91cc61149070d7ac7e62c86823ffd300' || 'ad341afc481063c4a0943380650722e306f3ba20' }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify source and run isolated recovery gates
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.head_commit.message == 'VERIFY_STORAGE_BASELINE_20261122' && 'a5415d7e28280fd07cea4d02e19e87d9ec36083e' || github.event.head_commit.message == 'VERIFY_STORAGE_395_20261122' && '2c0685d5b3dd39851c381a2231050827c6076bed' || github.event.head_commit.message == 'VERIFY_STORAGE_QA_395_20261122' && '92b4785c91cc61149070d7ac7e62c86823ffd300' || 'ad341afc481063c4a0943380650722e306f3ba20' }}"
          test "$(git -C candidate rev-parse HEAD)" = "$expected"
          cd candidate
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/install.log" 2>&1 || { echo 'FAILED dependencies'; exit 1; }
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_QA_395_20261122' ]]; then
            npm run test:storage:reliability >"$RUNNER_TEMP/storage-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Node quota tests'; exit 1; }
            echo 'QA_STORAGE Node quota tests PASS'
            npm run test:chat:contract >"$RUNNER_TEMP/chat-qa.log" 2>&1 || { echo 'QA_STORAGE failed: chat contract'; exit 1; }
            echo 'QA_STORAGE chat contract PASS'
            npm run test:chat:isolation >"$RUNNER_TEMP/isolation-qa.log" 2>&1 || { echo 'QA_STORAGE failed: chat isolation'; exit 1; }
            echo 'QA_STORAGE chat isolation PASS'
            npm run build >"$RUNNER_TEMP/vite-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Vite'; exit 1; }
            echo 'QA_STORAGE Vite build PASS'
            npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Chromium dependencies'; exit 1; }
            npm run test:chat:isolation:browser >"$RUNNER_TEMP/browser-qa.log" 2>&1 || { echo 'QA_STORAGE failed: Chromium chat isolation'; exit 1; }
            echo 'QA_STORAGE Chromium browser PASS, verify-only (no deploy)'
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_BASELINE_20261122' ]]; then
            chat_status=0
            isolation_status=0
            npm run test:chat:contract >"$RUNNER_TEMP/baseline-chat.log" 2>&1 || chat_status=$?
            npm run test:chat:isolation >"$RUNNER_TEMP/baseline-isolation.log" 2>&1 || isolation_status=$?
            node --input-type=module <<'SAFE_BASELINE_REPORT'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = s => createHash('sha256').update(s).digest('hex').slice(0,12);
          for(const [name,file] of [['chat','baseline-chat.log'],['isolation','baseline-isolation.log']]) {
            const lines = readFileSync(process.env.RUNNER_TEMP + '/' + file, 'utf8').split(/\r?\n/);
            for(const line of lines) {
              const fail=line.match(/^not ok (\d+) - (.*)$/);
              if(fail) console.log('BASELINE_FAIL suite='+name+' ordinal='+fail[1]+' hash='+hash(fail[2]));
              if(/^# (?:tests|pass|fail|skipped) \d+$/.test(line)) console.log('BASELINE '+name+' '+line);
            }
          }
          SAFE_BASELINE_REPORT
            echo "BASELINE_COMPARE chat_status=$chat_status isolation_status=$isolation_status"
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == 'VERIFY_STORAGE_395_20261122' ]]; then
            npm run test:storage:reliability >"$RUNNER_TEMP/storage.log" 2>&1 || { echo 'FAILED storage Node regression'; exit 1; }
            chat_contract_failed=0
            npm run test:chat:contract >"$RUNNER_TEMP/chat.log" 2>&1 || {
              chat_contract_failed=1
              node --input-type=module <<'SAFE_CHAT_FAILURE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const log = readFileSync(process.env.RUNNER_TEMP + '/chat.log', 'utf8').split(/\r?\n/);
          const hash = s => createHash('sha256').update(s).digest('hex').slice(0, 12);
          for (let i = 0; i < log.length; i++) {
            const failure = log[i].match(/^not ok (\d+) - (.*)$/);
            if (!failure) continue;
            const context = log.slice(i, i + 28).join(' ');
            const location = context.match(/(?:tests\/)[A-Za-z0-9_.-]+\.test\.mjs(?::\d+(?::\d+)?)?/);
            console.log('CHAT_FAIL ordinal=' + failure[1] + ' titleHash=' + hash(failure[2]) + ' source=' + (location?.[0] || 'unknown'));
          }
          for (const line of log) if (/^# (?:tests|pass|fail|skipped) \d+$/.test(line)) console.log(line);
          SAFE_CHAT_FAILURE
              echo 'CHAT CONTRACT FAILED: continuing other gates without bypassing this failure'
            }
            isolation_failed=0
            npm run test:chat:isolation >"$RUNNER_TEMP/isolation.log" 2>&1 || {
              isolation_failed=1
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                import { createHash } from "node:crypto";
                const log = readFileSync(process.env.RUNNER_TEMP + "/isolation.log", "utf8").split(/\r?\n/);
                const hash = s => createHash("sha256").update(s).digest("hex").slice(0,12);
                for(const line of log) {
                  const match = line.match(/^not ok (\d+) - (.*)$/);
                  if(match) console.log("ISOLATION_FAIL ordinal=" + match[1] + " titleHash=" + hash(match[2]));
                  if(/^# (?:tests|pass|fail|skipped) \d+$/.test(line)) console.log(line);
                }
              '
              echo 'FAILED chat isolation regression'
            }
            build_failed=0
            npm run build >"$RUNNER_TEMP/build.log" 2>&1 || { build_failed=1; echo 'FAILED Vite'; }
            browser_failed=0
            if [[ "$build_failed" -eq 0 ]]; then
              npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log" 2>&1 || { browser_failed=1; echo 'FAILED Chromium dependencies'; }
              if [[ "$browser_failed" -eq 0 ]]; then
                npm run test:chat:isolation:browser >"$RUNNER_TEMP/browser.log" 2>&1 || { browser_failed=1; echo 'FAILED Chromium chat isolation'; }
              fi
            else
              browser_failed=1
              echo 'NOT_RUN Chromium due to failed Vite build'
            fi
            echo "GATES storage=pass chat_contract_failed=$chat_contract_failed isolation_failed=$isolation_failed vite_failed=$build_failed browser_failed=$browser_failed"
            if [[ "$chat_contract_failed" -ne 0 || "$isolation_failed" -ne 0 || "$build_failed" -ne 0 || "$browser_failed" -ne 0 ]]; then
              echo 'FAILED storage candidate verification; no deployment performed'
              exit 1
            fi
            echo 'PASS storage Node, chat contract, chat isolation, Vite and Chromium'
            exit 0
          fi
          npm run build >"$RUNNER_TEMP/build.log" 2>&1 || { echo 'FAILED Vite'; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log" 2>&1 || { echo 'FAILED Chromium dependencies'; exit 1; }
          export NODE_DISABLE_COLORS=1
          set +e
          node --test --test-concurrency=1 >"$RUNNER_TEMP/full-node.log" 2>&1
          result=$?
          set -e
          node --input-type=module <<'SAFE_DIAGNOSTICS'
          import {readFileSync} from 'node:fs';
          const log=readFileSync(process.env.RUNNER_TEMP+'/full-node.log','utf8');
          const lines=log.split('\n');
          function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return (h>>>0).toString(16);}
          const name='tests/inspect-phone-gesture.test.mjs';
          const start=lines.findIndex(line=>line.includes('FATAL:')&&(line.includes('画师')||line.includes('用户单聊')||line.includes('Timeout')||line.includes('模型')||line.includes('返回桌面')));
          if(start>=0){
            const line=lines[start];
            console.log('INSPECT_CHECK '+['画师聊天按本人档案生成','用户单聊固定首位','Timeout','微信聊天详情可直返桌面','备忘录正文可直返桌面','读取第二个角色自己的档案','两个角色各生成一次'].map(value=>Number(line.includes(value))).join(''));
            console.log('INSPECT_WAIT '+['.nv-contact','#appHome','[data-action=','[data-detail=','[data-app='].map(value=>Number(lines.slice(start,start+12).some(line=>line.includes(value)))).join(''));
          }
          for(const [i,line] of lines.entries()){
            const match=line.match(/^not ok (\d+) - (.*)/);
            if(!match)continue;
            const nearby=lines.slice(i,i+15).join('\n');
            const location=nearby.match(/\/candidate\/(tests\/[^\s'":]+)(?::(\d+):\d+)?/);
            console.log('FAIL ordinal='+match[1]+' inspect='+Number(nearby.includes(name)||match[2].includes(name))+' pathHash='+hash(location?.[1]||'')+' labelHash='+hash(match[2])+' line='+(location?.[2]||0));
          }
          for(const line of lines)if(/^# (tests|pass|fail|skipped) \d+$/.test(line))console.log(line);
          SAFE_DIAGNOSTICS
          exit "$result"
