name: One-time canonical chat persona source QA verification
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-persona-source-unification-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'a179136049a920ff849a5be01d7aa95fd474a293' && github.event.head_commit.message == 'ci: verify complete role sources with all legacy protocol tests retained' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm public source isolation
        run: npm run check:public
      - name: Ensure scoped private read access is present
        env:
          REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          REF: ${{ secrets.CANDIDATE_REF }}
          TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO" && test -n "$REF" && test -n "$TOKEN"
          echo "::add-mask::$REPO"
          echo "::add-mask::${REPO##*/}"
          echo "::add-mask::$REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require precisely this QA source without logs
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b18e4991b2674a08e81f8dcf7f30f2d5cc945faa'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Execute complete sealed Node Vite Chromium and safety gates
        run: node scripts/run-candidate.mjs verify
