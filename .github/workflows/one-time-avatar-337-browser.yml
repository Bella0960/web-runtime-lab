name: Sealed avatar PR337 Chromium viewport acceptance
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-avatar-337-browser.yml
permissions:
  contents: read
concurrency:
  group: sealed-avatar-337-browser
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '7749611fb79756d78ac8cd6442d8d3578e470d8c' && github.event.head_commit.message == 'ci: verify PR337 mobile portrait viewport in isolation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata privacy
        run: node scripts/public-content-check.mjs
      - name: Private candidate fixed checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-CHAT-AVATAR-003/restore-pr278-qa-20261121
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact feature HEAD
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '59b12f75b5218aa8513c835e165ba42e012fb282'
          test -z "$(git -C candidate status --porcelain)"
      - name: Run sealed private Node Vite Chromium
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const checks = [
            ['dependencies','npm',['ci','--no-audit','--no-fund']],
            ['avatar-node','npm',['run','test:role:avatars']],
            ['chat-contract','npm',['run','test:chat:contract']],
            ['vite','npm',['run','build']],
            ['chromium-install','npx',['playwright','install','--with-deps','chromium']],
            ['avatar-chromium','npm',['run','test:role:avatars:browser']]
          ];
          for (const [name,cmd,args] of checks) {
            const run=spawnSync(cmd,args,{cwd:'candidate',encoding:'utf8',maxBuffer:30*1024*1024,timeout:3600000});
            if(run.error||run.status!==0){
              const output=(run.stdout||'')+'\n'+(run.stderr||'');
              const loc=[...output.matchAll(/chat-avatar-manager-browser\.mjs:(\d+):\d+/g)][0]?.[1];
              console.log('FAILED_GATE: '+name);
              if(loc) console.log('BROWSER_ASSERTION_LINE: '+loc);
              const bad=[...output.matchAll(/^not ok (\d+) -/gm)].slice(0,8).map(x=>x[1]);
              if(bad.length) console.log('FAILED_TEST_ORDINALS: '+bad.join(','));
              for(const tag of ['ERR_ASSERTION','TimeoutError','SyntaxError','Cannot find module']) if(output.includes(tag)) console.log('SAFE_ERROR: '+tag);
              throw Error('Private verification failed; source logs withheld');
            }
            console.log('PASS_GATE: '+name);
          }
          NODE