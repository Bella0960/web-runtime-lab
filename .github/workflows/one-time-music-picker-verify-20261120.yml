name: One-time restricted account switch scope regression

on:
  push:
    branches: [qa-candidate]
    paths:
      - '.github/workflows/one-time-music-picker-verify-20261120.yml'

permissions:
  contents: read

concurrency:
  group: one-time-account-context-regression-20261120
  cancel-in-progress: false

jobs:
  account-context:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing public guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata isolation
        run: node scripts/public-content-check.mjs
      - name: Checkout restricted account context candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-ACC-001/account-context-switch-20261120
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '94a7083ec7cde7618af9a43ab6bf296d08e99448'
      - name: Run sealed account isolation and session contracts
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const setup = spawnSync('npm', ['ci', '--no-audit', '--no-fund'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 150000
          });
          if (setup.status !== 0 || setup.error) throw new Error('Sealed dependency gate failed');
          const suite = [
            'tests/account-storage-isolation.test.mjs',
            'tests/account-session-expiry.test.mjs',
            'tests/account-identity-bridge-probe.test.mjs',
            'tests/account-qa-admin-proxy.test.mjs'
          ];
          for (const [index, path] of suite.entries()) {
            const run = spawnSync(process.execPath, ['--test', path], {
              cwd: 'candidate',
              stdio: 'ignore',
              timeout: 150000
            });
            if (run.status !== 0 || run.error) {
              throw new Error('Sealed account isolation regression failed at gate ' + (index + 1));
            }
          }
          console.log('PASS: four account isolation/session/identity contract suites');
          NODE

