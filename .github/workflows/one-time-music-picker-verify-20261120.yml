name: One-time restricted source-first prompt regression

on:
  push:
    branches: [qa-candidate]
    paths:
      - '.github/workflows/one-time-music-picker-verify-20261120.yml'

permissions:
  contents: read

concurrency:
  group: one-time-prompt-source-first-20261120
  cancel-in-progress: false

jobs:
  prompt-contract:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing public guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata isolation
        run: node scripts/public-content-check.mjs
      - name: Checkout restricted source-first prompt
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-CHAT-PROMPT-001/source-priority-cleanup-20261120
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '8deb264df568f1d0d3f5503f71533acb2e203ce7'
      - name: Run sealed source-first prompt and regex contracts
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const setup = spawnSync('npm', ['ci', '--no-audit', '--no-fund'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 150000
          });
          if (setup.status !== 0 || setup.error) throw new Error('Sealed dependency gate failed');
          const suite = [
            'tests/chat-rp-identity-runtime.test.mjs',
            'tests/chat-group-speaker-and-home-layout.test.mjs',
            'tests/chat-prompt-payload-diagnostic.test.mjs',
            'tests/chat-protocol-worldbook-priority.test.mjs',
            'tests/chat-persona-sources-mandatory.test.mjs',
            'tests/regex-editor-ui.test.mjs'
          ];
          for (const [index, path] of suite.entries()) {
            const run = spawnSync(process.execPath, ['--test', path], {
              cwd: 'candidate',
              stdio: 'ignore',
              timeout: 150000
            });
            if (run.status !== 0 || run.error) {
              throw new Error('Sealed prompt system regression failed at gate ' + (index + 1));
            }
          }
          const contract = spawnSync('npm', ['run', 'test:chat:contract'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 240000
          });
          if (contract.status !== 0 || contract.error) {
            throw new Error('Sealed complete chat contract regression failed');
          }
          const build = spawnSync('npm', ['run', 'build'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 240000
          });
          if (build.status !== 0 || build.error) throw new Error('Sealed QA build validation failed');
          const chromium = spawnSync('npx', ['playwright', 'install', '--with-deps', 'chromium'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 420000
          });
          if (chromium.status !== 0 || chromium.error) throw new Error('Sealed Chromium prerequisite gate failed');
          // Each Node file runs in its own process, just like native node --test.
          // Print ONLY ordinal indexes of failing files: no names/private TAP/log text.
          const { readdirSync } = await import('node:fs');
          const names = readdirSync('candidate/tests', { recursive: true })
            .map(String)
            .filter(x => ['.test.mjs','.test.cjs','.test.js'].some(ext => x.endsWith(ext)))
            .map(x => 'tests/' + x.split(String.fromCharCode(92)).join('/')).sort();
          const failed = [];
          for (let i=0; i<names.length; i++) {
            const one = spawnSync(process.execPath, ['--test', names[i]], {
              cwd:'candidate',stdio:'ignore',timeout:150000
            });
            if (one.status !== 0 || one.error) failed.push(i+1);
          }
          if (failed.length) {
            console.log('SEALED_FAILED_FILE_ORDINALS: ' + failed.join(','));
            throw new Error('Sealed per-file Node regression gate failed');
          }
          console.log('PASS: source-first prompt, full chat contract, Vite build and entire Node test suite');

          NODE

