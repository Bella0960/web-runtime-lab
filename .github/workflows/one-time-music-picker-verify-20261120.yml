name: One-time restricted persona source retry regression

on:
  push:
    branches: [qa-candidate]
    paths:
      - '.github/workflows/one-time-music-picker-verify-20261120.yml'

permissions:
  contents: read

concurrency:
  group: one-time-chat-history-regression-20261120
  cancel-in-progress: false

jobs:
  chat-history:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing public guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata isolation
        run: node scripts/public-content-check.mjs
      - name: Checkout restricted private chat history candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-CHAT-RP-001/required-source-retry-20261120
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '29da1f47a702e14553a8cf47f2aeebcfc73053a1'
      - name: Run sealed persona source and chat contracts
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const setup = spawnSync('npm', ['ci', '--no-audit', '--no-fund'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 150000
          });
          if (setup.status !== 0 || setup.error) throw new Error('Sealed dependency gate failed');
          const suite = [
            'tests/chat-required-source-retry.test.mjs',
            'tests/chat-persona-sources-mandatory.test.mjs',
            'tests/chat-protocol-worldbook-priority.test.mjs',
            'tests/chat-primary-send-lock.test.mjs',
            'tests/chat-direct-online-identity-guard.test.mjs'
          ];
          for (const [index, path] of suite.entries()) {
            const run = spawnSync(process.execPath, ['--test', path], {
              cwd: 'candidate',
              stdio: 'ignore',
              timeout: 150000
            });
            if (run.status !== 0 || run.error) {
              throw new Error('Sealed persona source regression failed at gate ' + (index + 1));
            }
          }
          const contract = spawnSync('npm', ['run', 'test:chat:contract'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 240000
          });
          if (contract.status !== 0 || contract.error) throw new Error('Sealed full chat contract gate failed');
          console.log('PASS: five persona/source suites and complete chat contract gate');
          NODE

