name: One-time restricted group private history regression

on:
  push:
    branches: [qa-candidate]
    paths:
      - '.github/workflows/one-time-music-picker-verify-20261120.yml'

permissions:
  contents: read

concurrency:
  group: one-time-chat-history-regression-20261120
  cancel-in-progress: false

jobs:
  chat-history:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing public guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public metadata isolation
        run: node scripts/public-content-check.mjs
      - name: Checkout restricted private chat history candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-CHAT-HISTORY-001/group-private-contract-20261120
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '6b060a8095dd11537c80035b6bc91626c59b76ca'
      - name: Run sealed group and history integrity tests
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const setup = spawnSync('npm', ['ci', '--no-audit', '--no-fund'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 150000
          });
          if (setup.status !== 0 || setup.error) throw new Error('Sealed dependency gate failed');
          const suite = [
            'tests/group-turn-integration.test.mjs',
            'tests/chat-history-atomic.test.mjs',
            'tests/chat-history-corruption-guard.test.mjs',
            'tests/group-private-receipt-recovery.test.mjs',
            'tests/group-speaker-scoped-history.test.mjs'
          ];
          for (const [index, path] of suite.entries()) {
            const run = spawnSync(process.execPath, ['--test', path], {
              cwd: 'candidate',
              stdio: 'ignore',
              timeout: 150000
            });
            if (run.status !== 0 || run.error) {
              throw new Error('Sealed group history regression failed at gate ' + (index + 1));
            }
          }
          const contract = spawnSync('npm', ['run', 'test:chat:contract'], {
            cwd: 'candidate', stdio: 'ignore', timeout: 240000
          });
          if (contract.status !== 0 || contract.error) throw new Error('Sealed full chat contract gate failed');
          console.log('PASS: five group/history suites and complete chat contract gate');
          NODE

