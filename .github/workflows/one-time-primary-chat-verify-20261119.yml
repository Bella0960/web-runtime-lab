name: One-time protected primary chat QA verification
on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-primary-chat-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '8b169e70481c5b1ce8c1b55f9b25283d00b8917b' && github.event.head_commit.message == 'ci: sealed verify protected primary chat sends 20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public metadata and source isolation
        run: npm run check:public
      - name: Confirm restricted candidate credentials
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO"
          test -n "$SOURCE_REF"
          test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPO"
          echo "::add-mask::${SOURCE_REPO##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require original QA branch and exact review snapshot
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '46e35e2ed830c1c57cf7cfe35cf88384ec68d40d'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Run original full isolated Node Vite Chromium gates
        run: node scripts/run-candidate.mjs verify
