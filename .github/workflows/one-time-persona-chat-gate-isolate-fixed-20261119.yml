name: One-time sealed persona chat suite fixed diagnosis
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-persona-chat-gate-isolate-fixed-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '3602e20152604a66fa2f117a1a70350bedf83b18' && github.event.head_commit.message == 'ci: diagnose only sealed persona test ordinals' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public source isolation
        run: npm run check:public
      - name: Ensure scoped secret checkout
        env:
          PRIVATE_REPO: ${{ secrets.CANDIDATE_REPOSITORY }}
          PRIVATE_REF: ${{ secrets.CANDIDATE_REF }}
          PRIVATE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" && test -n "$PRIVATE_REF" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPO"
          echo "::add-mask::${PRIVATE_REPO##*/}"
          echo "::add-mask::$PRIVATE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Check exact QA source
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b18e4991b2674a08e81f8dcf7f30f2d5cc945faa'
      - name: Report only test ordinals (private output sealed)
        run: node scripts/sealed-chat-suite-isolator.mjs persona
