name: One-time PR323 full Node failure classifier
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-role-identity-323-node-classifier-20261120.yml
permissions:
  contents: read
concurrency:
  group: isolated-role-identity-323-node-classifier-20261120
  cancel-in-progress: false
jobs:
  node-diagnostic:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public safety runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public content
        run: node scripts/public-content-check.mjs
      - name: Checkout exact private QA revision
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: e71766bdbe4af9cd53dcb49c0fe67c78dc746672
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 100
      - name: Verify immutable QA revision
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 'e71766bdbe4af9cd53dcb49c0fe67c78dc746672'
      - name: Run isolated per-file Node regression and report only ordinal failures
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {readdirSync} from 'node:fs';
          function gate(command,args,n,timeout=420000){
            const r=spawnSync(command,args,{cwd:'candidate',stdio:'ignore',timeout});
            if(r.error||r.status!==0)throw Error('Sealed setup gate-'+n+' failed');
          }
          gate('npm',['ci','--no-audit','--no-fund'],1,250000);
          gate('npm',['run','build'],2,420000);
          gate('npx',['playwright','install','--with-deps','chromium'],3,420000);
          const names=readdirSync('candidate/tests',{recursive:true}).map(String)
            .filter(x=>['.test.mjs','.test.cjs','.test.js'].some(ext=>x.endsWith(ext)))
            .map(x=>'tests/'+x.split(String.fromCharCode(92)).join('/')).sort();
          const failed=[];
          for(let i=0;i<names.length;i++){
            const r=spawnSync(process.execPath,['--test',names[i]],{
              cwd:'candidate',stdio:'ignore',timeout:200000
            });
            if(r.error||r.status!==0)failed.push(i+1);
          }
          console.log('SEALED_TOTAL_NODE_FILES:',names.length);
          console.log('SEALED_FAILED_FILE_ORDINALS:',failed.length?failed.join(','):'none');
          if(failed.length)throw Error('Full Node per-file isolation failure');
          console.log('PASS: every standalone Node test file');
          NODE
