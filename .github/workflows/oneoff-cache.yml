name: One-shot offline cache contract

on:
  push:
    branches:
      - qa-candidate

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  regression:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '00154a09aca072f84e076bedec08f520946cbe32' && github.event.head_commit.message == 'ci: one-shot cache contract' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source boundary
        run: node scripts/public-content-check.mjs
      - name: Verify read-only source configuration
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY" && test -n "$SOURCE_REF" && test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - name: Real Node navigation lifecycle regression
        shell: bash
        run: |
          set -u
          logfile="$RUNNER_TEMP/closed-lifecycle-test.log"
          (cd candidate && node --test tests/sw-navigation-cache-lifecycle.test.mjs tests/pwa-navigation-cache.test.mjs) > "$logfile" 2>&1
          result=$?
          rm -f "$logfile"
          if [[ "$result" -eq 0 ]]; then
            echo 'Scoped Node navigation regressions PASS'
          else
            echo 'Scoped Node navigation regressions FAIL; private logs withheld'
          fi
          exit "$result"
