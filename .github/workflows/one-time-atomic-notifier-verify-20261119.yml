name: One-time sealed DATA-008 QA verification
on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-atomic-notifier-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'f58df34bc05ea3c5721f19911512f3a0aaad31e1' && github.event.head_commit.message == 'ci: sealed verify DATA-008 atomic notifier exact QA candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing public guard scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public repo contains no private artifacts
        run: npm run check:public
      - name: Check restricted candidate source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Restricted candidate authorization missing.'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
          echo 'Existing restricted authorization confirmed.'
      - name: Checkout original private QA branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact approved QA snapshot and original branch
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e7ef707c6a82c22b9713992e50d3f7c2808a81f2'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
          echo 'Exact approved private QA candidate matched.'
      - name: Execute original complete Node Vite Chromium security gates
        run: node scripts/run-candidate.mjs verify
