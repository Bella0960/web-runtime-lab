name: One-time QA identity reconnect candidate full verification
on:
  push:
    branches:
      - qa-candidate
    paths:
      - .github/workflows/one-time-qa-identity-reconnect-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '622fa2e07e52700e455ef09a2eb61abbcdf6200b' && github.event.head_commit.message == 'ci: sealed QA identity reconnect full verify 20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout original public safety runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public repository contains no restricted sources
        run: npm run check:public
      - name: Verify restricted existing QA source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'QA restricted source unavailable'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout original private QA branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Confirm exact corrected candidate snapshot
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8558de7bb1b631a93c893ce0441e4c18ff3c4b1f'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Check identity reconnection behavior with private logs sealed
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qa-identity-reconnect-node.log"
          trap 'rm -f "$log"' EXIT
          if ( cd candidate && node --test tests/qa-identity-reconnect.test.mjs ) > "$log" 2>&1; then
            echo 'QA identity reconnect focused Node behavior gate: PASS'
          else
            echo 'QA identity reconnect focused Node behavior gate: FAILED; private diagnostics withheld'
            exit 1
          fi
      - name: Full original private Node Vite Chromium safety gates
        run: node scripts/run-candidate.mjs verify
