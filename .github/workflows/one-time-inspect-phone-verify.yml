name: Isolated role phone verification
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-inspect-phone-verify.yml]
permissions:
  contents: read
concurrency:
  group: sealed-memory-verification
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '7ba186f16281bcc3079a068668f5a5079c099efe' && github.event.head_commit.message == 'ci: verify role phone profile and desktop controls' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/public-content-check.mjs
      - name: Checkout restricted candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          ref: 'd28ed0d78eaf13a8a9586fb85b4c8e30798a69aa'
          path: candidate
          persist-credentials: false
      - name: Verify exact checkout and run sealed regression
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd28ed0d78eaf13a8a9586fb85b4c8e30798a69aa'
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          run() {
            local stage="$1"
            shift
            if "$@" >"$log" 2>&1; then
              echo "$stage passed"
            else
              if [[ "$stage" == Full-Node ]]; then
                node -e 'const fs=require("node:fs"), crypto=require("node:crypto"); const s=fs.readFileSync(process.argv[1],"utf8"); const lines=s.split(/\r?\n/).filter(l=>l.startsWith("test at")||l.startsWith("✖ tests/")); const keys=new Set(); for(const l of lines){for(const m of l.matchAll(/tests\/[a-zA-Z0-9_./-]+\.mjs(?::\d+)?/g)){const [p,n]=m[0].split(":");keys.add(crypto.createHash("sha256").update(p).digest("hex").slice(0,12)+" "+(n||"0"));}}for(const k of keys)process.stdout.write("Failed assertion "+k+"\n");' "$log"
              fi
              echo "::error::$stage failed in the restricted candidate"
              exit 1
            fi
          }
          run Install npm ci
          run Vite npm run build
          run Chromium-install npx playwright install --with-deps chromium
          run Role-phone-Chromium node --test tests/inspect-phone-gesture.test.mjs
          run Full-Node node --test --test-concurrency=1
