name: Verify group mention wake receipt
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-chat-wake-330-receipt.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'ec4b4be223eb0eef33e21c36cd2409407ba3aea5' && github.event.head_commit.message == 'ci: confirm active group mention wake receipt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing public isolation guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public repository privacy
        run: node scripts/public-content-check.mjs
      - name: Checkout existing private QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 100
      - name: Require exact merged QA commit and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'a72c65e4b042f9e6f23e4ba09d5527ae84b56e60'
          test "$(git -C candidate branch --show-current)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git -C candidate status --porcelain)"
          echo 'Exact approved QA candidate verified.'
      - name: Run the existing read-only origin and login probes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const source = readFileSync('candidate/scripts/qa-direct-release.mjs','utf8');
          const sha = execFileSync('git',['-C','candidate','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const checks = [
            ['verifyOwnerQaOrigin', sha, 'OWNER_ORIGIN_RECEIPT'],
            ['qaHttpSmoke', true, 'ACCOUNT_ASSET_SMOKE']
          ];
          let failures = 0;
          for (const [fn,value,label] of checks) {
            const start = source.indexOf('async function '+fn+'(');
            const end = source.indexOf('\n}\n',start)+2;
            assert.ok(start >= 0 && end > start);
            const probe = new Function('assert',source.slice(start,end)+'\nreturn '+fn+';')(assert);
            try {
              await probe(value);
              console.log(label+': PASS');
            } catch (error) {
              failures++;
              const failure = error.cause?.code || error.code || error.name;
              const allowed = ['ERR_ASSERTION','TimeoutError','ECONNRESET','ENOTFOUND','EAI_AGAIN','TypeError','UND_ERR_CONNECT_TIMEOUT','CERT_HAS_EXPIRED'];
              console.log(label+': '+(allowed.includes(failure) ? failure : 'FAILED'));
            }
          }
          process.exitCode = failures ? 1 : 0;
          NODE
