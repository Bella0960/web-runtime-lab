name: One-time sealed PR323 contract failure locator
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-role-identity-323-contract-locator-20261120.yml
permissions:
  contents: read
concurrency:
  group: sealed-role-identity-323-contract-locator
  cancel-in-progress: false
jobs:
  locate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/public-content-check.mjs
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: task-CHAT-RP-IDENTITY-002/weak-name-and-global-identity-seal-20261120
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '2f720c4907d26b8c83c7069f5b5abc30afa31416'
      - name: Locate failing contract files without leaking logs
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const install=spawnSync('npm',['ci','--no-audit','--no-fund'],{
            cwd:'candidate',stdio:'ignore',timeout:180000
          });
          if(install.error||install.status!==0)throw Error('Sealed install failed');
          const script=JSON.parse(readFileSync('candidate/package.json','utf8'))
             .scripts['test:chat:contract'];
          const files=[...script.matchAll(/tests\/[\w/-]+\.test\.(?:mjs|js|cjs)/g)]
            .map(x=>x[0]);
          const errors=[];
          for(let i=0;i<files.length;i++){
            const result=spawnSync(process.execPath,['--test',files[i]],{
              cwd:'candidate',stdio:['ignore','pipe','pipe'],
              encoding:'utf8',maxBuffer:3*1024*1024,timeout:180000
            });
            if(result.error||result.status!==0){
              const numbered=[...String(result.stdout||'').matchAll(/^not ok ([0-9]+) /gm)]
                .map(m=>m[1]).join(',');
              errors.push(i+1);
              console.log('SEALED_FAILED_FILE_ORDINAL: '+(i+1)+'; SUBTEST: '+numbered);
            }
          }
          console.log('SEALED_CONTRACT_FILE_COUNT: '+files.length);
          if(errors.length)throw Error('Contract locator found failing file ordinals');
          console.log('PASS: all per-file chat contracts');
          NODE
