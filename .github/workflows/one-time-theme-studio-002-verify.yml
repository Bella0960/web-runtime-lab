name: One-time theme studio 002 private mobile verification
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-theme-studio-002-verify.yml]
permissions:
  contents: read
concurrency:
  group: theme-studio-002-verify
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.actor == github.repository_owner &&
      github.event.before == 'c52aaba23753accf5d52b8b4b06e11279a70c1d8' &&
      github.event.head_commit.message == 'ci: reverify enhanced studio synthetic image contract 002'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public privacy guard
        run: npm run check:public
      - name: Checkout original private editor branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: THEME-STUDIO-002/mobile-editor-images-preview-20261121
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate
      - name: Pin immutable source SHA
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1335fadcde56a97c377ee9bfab6a84764726fb12'
          test -z "$(git status --porcelain)"
          test -f shared/js/theme-studio-assets.js
      - name: Native Node, Vite, Chromium and IDB image verification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          logfile="$RUNNER_TEMP/theme-002.log"
          trap 'rm -f "$logfile"' EXIT
          phase=dependencies
          if ! (cd candidate && npm ci --no-audit --no-fund) >"$logfile" 2>&1; then echo "SAFE_FAIL_PHASE: $phase";exit 1;fi
          phase=node
          if ! (cd candidate && node --test tests/theme-studio.test.mjs tests/theme-studio-advanced.test.mjs tests/default-desktop-layout.test.mjs) >"$logfile" 2>&1; then
            echo "SAFE_FAIL_PHASE: $phase";sed -n 's/^not ok \([0-9]*\).*/FAILED_ORDINAL \1/p' "$logfile";exit 1;fi
          echo 'SAFE_PASS: theme Node, legacy compatibility, desktop layout'
          phase=tutorial
          if ! (cd candidate && npm run test:tutorial) >"$logfile" 2>&1; then echo "SAFE_FAIL_PHASE: $phase";exit 1;fi
          phase=build
          if ! (cd candidate && npm run build) >"$logfile" 2>&1; then echo "SAFE_FAIL_PHASE: $phase";exit 1;fi
          echo 'SAFE_PASS: Vite and tutorial'
          phase=chromium-install
          if ! (cd candidate && npx playwright install --with-deps chromium) >"$logfile" 2>&1; then echo "SAFE_FAIL_PHASE: $phase";exit 1;fi
          phase=browser
          if ! (cd candidate && node tests/theme-studio-browser.mjs) >"$logfile" 2>&1; then
            echo "SAFE_FAIL_PHASE: $phase"
            grep -E 'AssertionError|TimeoutError|expected|actual|Error:' "$logfile" | \
              sed -E 's/([A-Za-z_]+)=([^ ]+)/\1=[redacted]/g' | head -12 || true
            exit 1
          fi
          echo 'SAFE_PASS: Chromium 375/390/430 image import, IDB and actual chat CSS'
