name: One-time isolated focused and browser checks

on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-contract-diagnosis-20261119.yml]

permissions: { contents: read }

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'a49d4466e830e3d7076bc1033803da8888717613' && github.event.head_commit.message == 'ci: one-time isolated focused and browser checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source
        run: npm run check:public
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Lock candidate snapshot
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = 'c40e1ad92c0344223cadf30bf69187b04a0c3929'
      - name: Run independent validations with numbered, sealed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'AUDIT'
          import { spawnSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          const cwd='candidate';
          const tests=readdirSync(cwd+'/tests',{recursive:true})
            .filter(x=>/\.test\.(?:[cm]?js)$/.test(String(x))).map(String).sort();
          function execute(cmd,args,timeout=15*60*1000) {
            return spawnSync(cmd,args,{cwd,encoding:'utf8',maxBuffer:48*1024*1024,timeout});
          }
          if(execute('npm',['ci','--no-audit','--no-fund']).status!==0){
            console.log('dependency-setup=failed');process.exit(1);
          }
          if(execute('npm',['run','build']).status!==0){
            console.log('build=failed');process.exit(1);
          }
          let failures=0;
          function checkFile(index){
            const x=execute('node',['--test','tests/'+tests[index-1]],12*60*1000);
            if(x.status===0){console.log('file-index='+index+' pass');return;}
            failures++;
            const out=String(x.stdout||'');
            const items=[...out.matchAll(/^not ok (\d+) - [^\n]+/gm)];
            if(!items.length){
              const kind=/Executable doesn't exist|browserType\.launch/i.test(out+String(x.stderr||'')) ? 'browser-launch' :
                /TimeoutError|timeout/i.test(out+String(x.stderr||'')) ? 'timeout' : 'unknown';
              console.log('file-index='+index+' error='+kind);
              return;
            }
            for(let i=0;i<Math.min(items.length,35);i++){
              const part=out.slice(items[i].index,items[i+1]?.index);
              const location=part.match(/location:\s*['"]?[^\n]*?\/tests\/[^:\n'"]+:(\d+)/);
              const kind=part.match(/failureType:\s*['"]([A-Za-z]+)['"]/);
              console.log('file-index='+index+' case='+items[i][1]+
                ' line='+(location?.[1]||'?')+' kind='+(kind?.[1]||'?'));
            }
          }
          for(const n of [22,38,39,41,45,47,57,70])checkFile(n);
          const install=execute('npx',['playwright','install','--with-deps','chromium'],10*60*1000);
          if(install.status===0){
            for(const n of [49,65,76,78,84])checkFile(n);
          }else{console.log('browser-setup=failed');failures++;}
          console.log('targeted-failure-count='+failures);
          if(failures)process.exitCode=1;
          AUDIT
