name: One-time isolated focused regression check

on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-contract-diagnosis-20261119.yml]

permissions: { contents: read }

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'c310e7bdd0f31e071b0c96fb554b68ef7643eead' && github.event.head_commit.message == 'ci: one-time isolated focused regression check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source
        run: npm run check:public
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Lock candidate snapshot
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = '9439c7ddd8e32810adde2c4aa553cd0c6d76ab52'
      - name: Verify focused regression without exposing private test contents
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'AUDIT'
          import { spawnSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          const cwd='candidate';
          const tests=readdirSync(cwd+'/tests',{recursive:true})
            .filter(x=>/\.test\.(?:[cm]?js)$/.test(String(x))).map(String).sort();
          function exec(cmd,args,timeout=12*60*1000){
            return spawnSync(cmd,args,{cwd,encoding:'utf8',maxBuffer:32*1024*1024,timeout});
          }
          const i=exec('npm',['ci','--no-audit','--no-fund']);
          if(i.status!==0){console.log('npm-setup=fail');process.exit(1);}
          let failures=0;
          for(const index of [22,38,39,41,45,47,57,70]){
            const result=exec('node',['--test','tests/'+tests[index-1]]);
            if(result.status===0){console.log('file='+index+' pass');continue;}
            failures++;
            const text=String(result.stdout||'');
            const matches=[...text.matchAll(/^not ok (\d+) - [^\n]+/gm)];
            for(let n=0;n<matches.length;n++){
              const block=text.slice(matches[n].index,matches[n+1]?.index);
              const line=block.match(/location:\s*['"]?[^\n]*?\/tests\/[^:\n'"]+:(\d+)/);
              const kind=block.match(/failureType:\s*['"]([A-Za-z]+)['"]/);
              console.log('file='+index+' case='+matches[n][1]+' line='+(line?.[1]||'?')+
                ' kind='+(kind?.[1]||'?'));
            }
          }
          console.log('focus-failure-count='+failures);
          if(failures)process.exitCode=1;
          AUDIT
