name: One-time isolated full regression locator

on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-contract-diagnosis-20261119.yml]

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'a5f2c30429ae4b8b8097431a9592fb9c21450527' && github.event.head_commit.message == 'ci: one-time isolated full regression locator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source
        run: npm run check:public
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Lock candidate snapshot
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = '7af6c502352dba83dd58c4ccb7d7cb9b732eae13'
      - name: Locate full Node regression failures by numeric index only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'DIAG'
          import { spawnSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          const cwd='candidate';
          const files=readdirSync(cwd+'/tests',{recursive:true})
            .filter(x => /\.test\.(?:[cm]?js)$/.test(String(x)))
            .map(String).sort();
          function call(cmd,args,timeout=22*60*1000) {
            return spawnSync(cmd,args,{cwd,encoding:'utf8',maxBuffer:64*1024*1024,timeout});
          }
          if(call('npm',['ci','--no-audit','--no-fund']).status!==0) {
            console.log('setup=fail');process.exit(1);
          }
          if(call('npm',['run','build']).status!==0) {
            console.log('build=fail');process.exit(1);
          }
          const result=call('node',['--test'],35*60*1000);
          const output=String(result.stdout||'');
          const matches=[...output.matchAll(/^not ok (\d+) - [^\n]+/gm)];
          for (let i=0;i<Math.min(matches.length,160);i++) {
            const current=matches[i];
            const part=output.slice(current.index,matches[i+1]?.index);
            const location=part.match(/location:\s*['"]?[^\n]*?\/tests\/([^:\n'"]+\.test\.[cm]?js):(\d+)/);
            const fileIndex=location ? files.indexOf(location[1])+1 : 0;
            const operator=part.match(/operator:\s*['"]([A-Za-z]+)['"]/);
            const kind=part.match(/failureType:\s*['"]([A-Za-z]+)['"]/);
            console.log('failed file-index='+fileIndex+' case='+current[1]+
              ' line='+(location?.[2]||'unknown')+' op='+(operator?.[1]||'unknown')+
              ' kind='+(kind?.[1]||'unknown'));
          }
          console.log('node-count='+files.length+' failure-count='+matches.length+' status='+(result.status===0?'pass':'fail'));
          const gate18=call('npm',['run','gate:encounter'],180000);
          console.log('gate18='+(gate18.status===0?'pass':'fail'));
          if(result.status!==0||gate18.status!==0)process.exitCode=1;
          DIAG
