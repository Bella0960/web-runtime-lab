name: One-time isolated validation gate audit

on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-contract-diagnosis-20261119.yml]

permissions:
  contents: read

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'cd56fe6a0b149813fcfab4aa7fc4cac54a1801ed' && github.event.head_commit.message == 'ci: one-time isolated remaining gate audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public surface
        run: npm run check:public
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Lock approved snapshot
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = '52e109269598f15f2ac62e64b81da46dda8b7ba5'
      - name: Scan remaining small tests without exposing their output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'DIAG'
          import { spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const cwd = 'candidate';
          const pkg = JSON.parse(readFileSync(cwd+'/package.json', 'utf8'));
          const run = (cmd,args) => spawnSync(cmd,args,{
            cwd, encoding:'utf8',maxBuffer:32*1024*1024,timeout:22*60*1000
          });
          const setup = run('npm',['ci','--no-audit','--no-fund']);
          if (setup.status !== 0) { console.log('setup=failed');process.exit(1); }
          let failures = 0;
          function report(label,result) {
            if (result.status === 0) { console.log(label+'=pass');return; }
            failures++;
            const text = String(result.stdout || '');
            const matches = [...text.matchAll(/^not ok (\d+) - [^\n]+/gm)];
            if (!matches.length) { console.log(label+'=fail');return; }
            for(let i=0;i<matches.length;i++) {
              const part=text.slice(matches[i].index,matches[i+1]?.index);
              const line=part.match(/\.test\.mjs:(\d+):\d+/);
              const op=part.match(/operator:\s*['"]([A-Za-z]+)['"]/);
              console.log(label+' case='+matches[i][1]+' line='+(line?.[1]||'unknown')+' op='+(op?.[1]||'unknown'));
            }
          }
          function fileList(script) {
            return String(pkg.scripts[script]||'').split(/\s+/).filter(x=>x.endsWith('.mjs'));
          }
          for(const [idx,path] of fileList('test:group:governance').entries()) {
            report('gate8-file'+(idx+1),run('node',['--test',path]));
          }
          report('gate9',run('node',['--test','tests/qa-cloud-settings-integration.test.mjs']));
          const built=run('npm',['run','build']);
          report('gate10',built);
          report('gate11',run('npm',['run','test:encounter']));
          if(built.status===0) {
            for(const [idx,path] of fileList('test:pwa:navigation').entries()) {
              report('gate12-file'+(idx+1),run('node',['--test',path]));
            }
          }else console.log('gate12=blocked-by-build');
          console.log('audit-failure-count='+failures);
          if(failures)process.exitCode=1;
          DIAG
