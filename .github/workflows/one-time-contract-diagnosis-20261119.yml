name: One-time isolated browser failure locator

on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-contract-diagnosis-20261119.yml]

permissions: { contents: read }

concurrency:
  group: sealed-candidate
  cancel-in-progress: false

jobs:
  locate:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '814c99246ba404d47c744f34845e96bd208a5ffc' && github.event.head_commit.message == 'ci: one-time isolated group browser failure locator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public safety check
        run: npm run check:public
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate snapshot
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = 'c40e1ad92c0344223cadf30bf69187b04a0c3929'
      - name: Identify browser assertion by numeric source position
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'LOCATE'
          import { spawnSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          const cwd='candidate';
          const files=readdirSync(cwd+'/tests',{recursive:true})
            .filter(x=>/\.test\.(?:[cm]?js)$/.test(String(x))).map(String).sort();
          const call=(cmd,args,timeout=10*60*1000)=>spawnSync(cmd,args,{cwd,encoding:'utf8',maxBuffer:32*1024*1024,timeout});
          if(call('npm',['ci','--no-audit','--no-fund']).status!==0){console.log('setup=fail');process.exit(1);}
          if(call('npx',['playwright','install','--with-deps','chromium']).status!==0){
            console.log('browser-setup=fail');process.exit(1);
          }
          const r=call('node',['--test','tests/'+files[64]]);
          if(r.status===0){console.log('target=pass');process.exit(0);}
          const stdout=String(r.stdout||'');
          const matched=[...stdout.matchAll(/^not ok (\d+) - [^\n]+/gm)];
          for(let i=0;i<matched.length;i++){
            const block=stdout.slice(matched[i].index,matched[i+1]?.index);
            const frames=[...block.matchAll(/tests\/[^:\n]+\.test\.[cm]?js:(\d+):(\d+)/g)];
            const safeReason=(block.match(/reason=(lore-read|protocol-read|persona-read|api-config|other-toast|no-toast)/)||[])[1]||'unknown';
            const errorKind=(block.match(/failureType:\s*['"]([A-Za-z]+)['"]/ )||[])[1]||'unknown';
            const operator=(block.match(/operator:\s*['"]([A-Za-z]+)['"]/ )||[])[1]||'unknown';
            const type=/TimeoutError/i.test(block)?'timeout':/AssertionError/i.test(block)?'assertion':/TypeError/i.test(block)?'type':'other';
            console.log('case='+matched[i][1]+' call-line='+(frames[0]?.[1]||'?')+
              ' reason='+safeReason+' kind='+errorKind+' op='+operator+' type='+type);
          }
          console.log('target=fail cases='+matched.length);
          process.exitCode=1;
          LOCATE
