name: One-time QA login reconnect and PWA cache final release
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-qa-login-reconnect-final-release-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == 'e1c8612b9d97659e2565f7a8ac8e907a86dd6e13' && github.event.head_commit.message == 'ci: QA login reconnect PWA cache guarded release final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout original public isolation runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source isolation
        run: npm run check:public
      - name: Confirm restricted original QA-only authorization
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" || ! "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ || ${#QA_TOKEN} -lt 20 ]]; then
            echo 'Restricted QA-only authorization missing'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout original private QA branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Require exact QA login candidate revision and branch
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '40fbe9b369acc17982bc5bb0de624350d8940e41'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Sealed focused login reconnect and live release URL regression
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/login-reconnect-release-gate.log"
          trap 'rm -f "$log"' EXIT
          for fixture in qa-identity-reconnect.test.mjs qa-release-live-version.test.mjs; do
            if (cd candidate && node --test "tests/$fixture") > "$log" 2>&1; then
              echo "Original private $fixture PASS"
            else
              indices=$(sed -n 's/^not ok \([0-9][0-9]*\).*/\1/p' "$log" | paste -sd, -)
              echo "Original private $fixture FAILED, cases = ${indices:-unavailable}; private logs withheld"
              exit 1
            fi
          done
      - name: Run complete original Node Vite Chromium and QA-only release gates
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
