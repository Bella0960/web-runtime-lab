name: One-time sealed weak role identity premerge validation
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-role-identity-323-verify-20261120.yml
permissions:
  contents: read
concurrency:
  group: sealed-role-identity-323
  cancel-in-progress: false
jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/public-content-check.mjs
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: 542e3551b83be6c9ff71bb748464ddfc40948c82
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm exact PR323 source
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '542e3551b83be6c9ff71bb748464ddfc40948c82'
      - name: Run sealed focused Node, complete chat, build and Chromium
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const gates = [
            ['npm',['ci','--no-audit','--no-fund']],
            ['node',['--test','tests/chat-strict-role-isolation.test.mjs']],
            ['node',['--test','tests/chat-protocol-worldbook-priority.test.mjs']],
            ['node',['--test','tests/chat-rp-identity-runtime.test.mjs']],
            ['node',['--test','tests/chat-scheduled-persona-source.test.mjs']],
            ['node',['--test','tests/chat-offline-source-contract.test.mjs']],
            ['npm',['run','test:chat:contract']],
            ['npm',['run','build']],
            ['npx',['playwright','install','--with-deps','chromium']],
            ['node',['tests/chat-light-surfaces-browser.mjs']]
          ];
          for (let i=0;i<gates.length;i++){
            const [bin,args]=gates[i];
            const r=spawnSync(bin,args,{cwd:'candidate',stdio:['ignore','pipe','pipe'],
              encoding:'utf8',maxBuffer:3*1024*1024,timeout:12*60*1000});
            if(r.error||r.status!==0){
              const ordinals=[...String(r.stdout||'').matchAll(/^not ok ([0-9]+) /gm)].map(x=>x[1]);
              console.log('SEALED_FAILED_GATE_ORDINAL: '+(i+1));
              console.log('SEALED_FAILED_TEST_ORDINALS: '+(ordinals.join(',')||'setup'));
              if(i===6){
                const {readFileSync}=await import('node:fs');
                const files=JSON.parse(readFileSync('candidate/package.json','utf8'))
                  .scripts['test:chat:contract'].split(' ').filter(x=>x.startsWith('tests/'));
                const lines=String(r.stdout||'').split(String.fromCharCode(10));
                for(let j=0;j<lines.length;j++){
                  const found=/^not ok ([0-9]+) /.exec(lines[j]);
                  if(!found)continue;
                  const location=lines.slice(j+1,j+18).find(x=>x.includes('location:')&&x.includes('tests/'));
                  if(!location)continue;
                  const remainder=location.split('tests/').pop().split(':');
                  const fileOrdinal=files.findIndex(x=>x.endsWith('/'+remainder[0]))+1;
                  console.log('SEALED_CHAT_CONTRACT_FAIL_LOCATION: '+found[1]+':'+fileOrdinal+':'+(remainder[1]||'unknown'));
                }
              }
              const tap=String(r.stdout||'');
              const failedBlock=tap.match(/^not ok 7 [^\\n]*\\n([\\s\\S]*?)(?=^not ok |^ok |^1\\.\\.|$)/m);
              const line=failedBlock&&failedBlock[1].match(/location:\\s*['"]?[^\\n]*chat-strict-role-isolation\\.test\\.mjs:([0-9]+):[0-9]+/);
              const failure=failedBlock&&failedBlock[1].match(/error:\\s*['"]?([^\\n]+)/);
              console.log('SEALED_FAILED_SOURCE_LINE: '+(line?line[1]:'unresolved'));
              console.log('SEALED_FAILED_ERROR_CATEGORY: '+(failure?(/AssertionError/.test(failure[1])?'AssertionError':'other'):'unresolved'));
              throw Error('Restricted QA identity candidate check failed; private logs withheld');
            }
            console.log('SEALED_PASS_GATE_ORDINAL: '+(i+1));
          }
          console.log('PASS: exact role identity patch, full chat contracts, Vite, Chromium');
          NODE
