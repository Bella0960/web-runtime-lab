name: One-time guarded mobile theme studio QA-only publication
on:
  push:
    branches: [qa-candidate]
    paths: [.github/workflows/one-time-theme-studio-348-qa-release.yml]
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  qa_release:
    if: >-
      github.actor == github.repository_owner &&
      github.event.before == 'da7939e5a8b8cda1e813047815ef19fa91168e8f' &&
      github.event.head_commit.message == 'ci: publish PR350 mobile editor with IDB photos to existing QA only'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout approved public isolation runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public content privacy guard
        run: npm run check:public
      - name: Check restricted QA authorization is configured
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
          QA_ACCOUNT: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          QA_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY"
          test -n "$SOURCE_REF"
          test -n "$SOURCE_TOKEN"
          [[ "$QA_ACCOUNT" =~ ^[0-9a-f]{32}$ ]]
          test -n "$QA_TOKEN"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::$SOURCE_REF"
          echo 'Restricted QA-only runner is configured'
      - name: Checkout unchanged private QA integration project
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          persist-credentials: true
          fetch-depth: 100
          path: candidate
      - name: Pin exact QA revision and its unique branch
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'da5df63b37ca5ca01990ee5b7f45d03397850e16'
          test "$(git branch --show-current)" = 'integration/account-fanwai-stack-20261115'
          test -z "$(git status --porcelain)"
          test -f tests/theme-studio.test.mjs
          test -f tests/theme-studio-browser.mjs
          echo 'Approved exact QA candidate is checked out'
      - name: Test original mobile editor via Node Vite and Chromium
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/theme-studio-private.log"
          trap 'rm -f "$log"' EXIT
          if (cd candidate && npm ci --no-audit --no-fund && \
              node --test tests/theme-studio.test.mjs tests/theme-studio-advanced.test.mjs && \
              npm run test:tutorial && \
              npm run build && \
              npx playwright install --with-deps chromium && \
              node tests/theme-studio-browser.mjs) >"$log" 2>&1; then
            echo 'Mobile theme editor Node, Vite and Chromium 375/390/430 gates PASS'
          else
            echo 'Mobile theme editor verified gate FAILED; private logs withheld'
            sed -n 's/^not ok \([0-9][0-9]*\).*/failed assertion \1/p' "$log" | tail -8 || true
            exit 1
          fi
      - name: Original complete private tests plus immutable QA Worker-only release
        env:
          CANDIDATE_RELEASE_ACK: qa-only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CANDIDATE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_TOKEN }}
        run: node scripts/run-candidate.mjs release
