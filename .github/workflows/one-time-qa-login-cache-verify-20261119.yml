name: One-time QA login PWA cache fix full verification
on:
  push:
    branches: [qa-candidate]
    paths:
      - .github/workflows/one-time-qa-login-cache-verify-20261119.yml
permissions:
  contents: read
concurrency:
  group: sealed-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ github.actor == github.repository_owner && github.event.before == '9adc5bf778dfdc72bd4bae6513da68ab01f350db' && github.event.head_commit.message == 'ci: sealed login PWA script cache QA full verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing public guard repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect public source isolation
        run: npm run check:public
      - name: Check restricted private QA source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CANDIDATE_REPOSITORY }}
          SOURCE_REF: ${{ secrets.CANDIDATE_REF }}
          SOURCE_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || -z "$SOURCE_TOKEN" ]]; then
            echo 'Restricted QA source unavailable'
            exit 1
          fi
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::${SOURCE_REPOSITORY##*/}"
          echo "::add-mask::$SOURCE_REF"
      - name: Checkout original private QA candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CANDIDATE_REPOSITORY }}
          ref: ${{ secrets.CANDIDATE_REF }}
          token: ${{ secrets.CANDIDATE_READ_TOKEN }}
          path: candidate
          persist-credentials: true
          fetch-depth: 100
      - name: Lock fully patched QA source SHA
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '008752518b48fec31e3c9efb283b0242274286e6'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'integration/account-fanwai-stack-20261115'
      - name: Check synthetic reconnection and mobile PWA cache contract with sealed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/reconnect-cache-test.log"
          trap 'rm -f "$log"' EXIT
          if (cd candidate && node --test tests/qa-identity-reconnect.test.mjs) >"$log" 2>&1; then
            echo 'Synthetic identity reconnection and PWA cache gate PASS'
          else
            echo 'Synthetic identity reconnection and PWA cache gate FAILED; private logs not exported'
            exit 1
          fi
      - name: Original complete Node Vite Chromium safety gates
        run: node scripts/run-candidate.mjs verify
